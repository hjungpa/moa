<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="보장비교">
<title>보장 비교</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --panel2:#fafbfc; --line:#e3e6ea;
  --tx:#15181d; --tx2:#5c646f; --tx3:#98a0ab;
  --accent:#2f6df6; --accent-soft:#e8efff;
  --up:#1a6fd4; --up-soft:#e7f0ff;      /* 보장 증가 · 파랑 */
  --new-soft:#dce9ff;                   /* 새로 넣는 담보 */
  --down:#e23b3b; --down-soft:#fdeaea;  /* 보장 감소 · 빨강 */
  --warn:#e0a411; --ok:#17a34a;
  --shadow:0 1px 2px rgba(16,20,30,.06),0 6px 20px rgba(16,20,30,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --panel:#171b22; --panel2:#1d222b; --line:#2a313c;
    --tx:#eef1f5; --tx2:#a3acb9; --tx3:#6d7785;
    --accent:#5b8cff; --accent-soft:#1b2740;
    --up:#74b6ff; --up-soft:#132540; --down:#ff6b6b; --down-soft:#35191a;
    --new-soft:#16294a;
    --warn:#f0bb3c; --ok:#3ecf72;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --panel:#171b22; --panel2:#1d222b; --line:#2a313c;
  --tx:#eef1f5; --tx2:#a3acb9; --tx3:#6d7785;
  --accent:#5b8cff; --accent-soft:#1b2740;
  --up:#74b6ff; --up-soft:#132540; --down:#ff6b6b; --down-soft:#35191a;
  --new-soft:#16294a;
  --warn:#f0bb3c; --ok:#3ecf72;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
input,select,textarea,button{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
.hidden{display:none !important}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--tx3)} .tiny{font-size:11.5px} .sm{font-size:13px} .b{font-weight:700}
.c-up{color:var(--up)} .c-down{color:var(--down)} .c-warn{color:var(--warn)} .c-ok{color:var(--ok)}

#app{max-width:1100px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--line)}
.topbar h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.02em}
.topbar .sub{font-size:12px;color:var(--tx3);font-weight:600;background:none;border:0;padding:0;text-align:left}
main{flex:1;padding:12px 14px calc(env(safe-area-inset-bottom) + 86px)}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--panel);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:1100px;margin:0 auto;display:flex;width:100%}
.tabbar button{flex:1;background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10.5px;color:var(--tx3);font-weight:700}
.tabbar button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--accent)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.card .hd{padding:12px 14px 0;display:flex;align-items:center;gap:8px}
.card .hd.pb{padding-bottom:12px}
.card .hd h2{font-size:13px;margin:0;font-weight:800;color:var(--tx2);flex:1}
.card .bd{padding:12px 14px 14px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--tx);border-radius:10px;
  padding:9px 13px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.gho{background:transparent}
.btn.dan{color:var(--down);border-color:var(--down)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--tx2);margin-bottom:5px}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.inp:focus{border-color:var(--accent);background:var(--panel)}
textarea.inp{min-height:150px;resize:vertical;font-size:13px;line-height:1.6}
.two{display:flex;gap:8px}.two>*{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11.5px;
  font-weight:800;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.pill.old{background:var(--panel2);color:var(--tx2)}
.pill.new{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.empty{text-align:center;padding:26px 14px;color:var(--tx3);font-size:13px}
.empty b{display:block;color:var(--tx2);font-size:14px;margin-bottom:4px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--tx3)}
.seg button.on{background:var(--panel);color:var(--tx);box-shadow:var(--shadow)}
.tog{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.tog:first-child{border-top:0}
.tog input[type=checkbox]{width:21px;height:21px;accent-color:var(--accent);flex:none}
.err{color:var(--down);font-size:12.5px;font-weight:700;min-height:16px}
.spin{width:16px;height:16px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;
  animation:sp .7s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}

/* 모달 */
.mask{position:fixed;inset:0;z-index:100;background:rgba(8,11,16,.5);display:flex;align-items:flex-end;justify-content:center}
.modal{width:100%;max-width:760px;max-height:92vh;background:var(--panel);border-radius:18px 18px 0 0;
  display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.28);animation:up .2s ease}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.modal .mh{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h3{margin:0;font-size:16px;font-weight:800;flex:1}
.modal .mb{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal .mf{padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.modal .mf .btn.wide{flex:1 0 100%}
.modal .mf .btn{flex:1}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--tx3);padding:2px 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 78px);
  background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;
  z-index:200;box-shadow:var(--shadow);animation:up .2s ease}

/* 상품 카드 */
.prod{display:flex;align-items:center;gap:11px;padding:12px 14px;border-top:1px solid var(--line)}
.prod:first-child{border-top:0}
.prod .ic{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;
  font-size:12px;font-weight:900;color:#fff}

/* 비교표 */
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th,.cmp td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.cmp thead th{position:sticky;top:0;background:var(--panel2);font-size:11.5px;font-weight:800;color:var(--tx2);
  z-index:2;border-bottom:1.5px solid var(--line)}
.cmp td.nm{font-weight:700;line-height:1.35}
.cmp td.n{text-align:right;white-space:nowrap}
.cmp tr.up td.d{color:var(--up)} .cmp tr.down td.d{color:var(--down)}
.cmp tr.up{background:var(--up-soft)} .cmp tr.down{background:var(--down-soft)}
.cmp tbody tr:not(.cat):not(.csum):not(.gap) td{border-bottom:1px solid var(--line)}
.cmp tr.off{opacity:.42}
.cmp tr.off td.nm{text-decoration:line-through}
.cmp .dash{color:var(--tx3);font-weight:800}
.cmp .sub{font-size:10.5px;color:var(--tx3);font-weight:600;display:block;margin-top:2px}
.cmp .hand{cursor:grab;color:var(--tx3);font-size:14px;padding:0 2px;touch-action:none;user-select:none}
.cmp tr.drag{opacity:.4}
.cmp tr.over{outline:2px dashed var(--accent);outline-offset:-2px}
.cmp tfoot td{font-weight:900;background:var(--panel2);border-top:2px solid var(--line);font-size:14px}
.cmp tfoot tr.tsum td{font-size:13px;border-top:1px solid var(--line);background:var(--panel2)}
.cmp .was{display:block;text-decoration:line-through;color:var(--tx3);font-size:10.5px;font-weight:600;line-height:1.25}
.cmp tfoot tr.grand td{font-size:14.5px;border-top:2px solid var(--line)}
.cmp tfoot tr.grand td .c-down,.cmp tfoot tr.grand td .c-up{font-weight:900}
.cmp tr.cat td{background:var(--accent-soft);color:var(--accent);font-weight:900;font-size:12px;
  padding:7px 8px;border-top:0;letter-spacing:.2px}
.cmp tr.gap td{padding:0;height:9px;background:var(--bg);border:0}
.cmp tr.csum td.lab{font-weight:900}
.cmp tfoot td.lab{font-weight:900}
.cmp tr.cat td .cnt{float:right;font-weight:800;opacity:.75}
.cmp tr.csum td{background:var(--panel2);font-weight:900;font-size:12px;color:var(--tx2);border-bottom:0}
.cmp .pen{margin-left:6px;font-size:11px;opacity:.55;cursor:pointer;padding:2px 3px}
.cmp .pen:active{opacity:1}
.cmp tr.gone td{color:var(--tx3) !important;opacity:.7}
.cmp tr.gone td.nm .nmtx{text-decoration:line-through}
.cmp tr.gone .ins{opacity:.55}
.tagsp{margin-left:5px}
.nmtx{}
.tag{display:inline-block;padding:1px 6px;border-radius:6px;font-size:10px;font-weight:900;
  margin-right:4px;vertical-align:1.5px;white-space:nowrap}
.tag.keep{background:var(--line);color:var(--tx2)}
.tag.add {background:var(--up-soft);color:var(--up)}
.tag.upx {background:var(--up-soft);color:var(--up)}
.tag.drop{background:var(--down-soft);color:var(--down)}
.tag.cutx{background:var(--down-soft);color:var(--down)}
.tag.swap{background:var(--accent-soft);color:var(--accent)}
.tag.ren {background:var(--warn);color:#fff}
.tag.est {background:var(--panel2);color:var(--tx3);border:1px solid var(--line)}
.miniseg{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2)}
.miniseg button{flex:1;border:0;background:none;padding:7px 6px;font:inherit;font-size:12px;font-weight:800;
  color:var(--tx2);cursor:pointer}
.miniseg button.on{background:var(--accent);color:#fff}
.plan .prod{align-items:flex-start}
.mk{font-size:10px;font-weight:900;margin-right:3px;vertical-align:1px;letter-spacing:-1px}
.paren{font-weight:700;opacity:.72;font-size:11px}
.tag.kind{background:var(--ok);color:#fff}
.pie{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.piesvg{width:190px;height:190px;flex:none;margin:0 auto}
.piesvg .pt1{font-size:12px;font-weight:800;fill:var(--tx2)}
.piesvg .pt2{font-size:15px;font-weight:900;fill:var(--tx)}
.pielg{flex:1;min-width:210px;display:flex;flex-direction:column;gap:2px}
.lgrow{display:flex;align-items:center;gap:6px;padding:4px 2px;border-bottom:1px solid var(--line);font-size:11.5px}
.lgrow i{width:9px;height:9px;border-radius:3px;flex:none}
.lgn{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lgp{width:36px;text-align:right;font-weight:900;color:var(--tx2)}
.lgv{width:80px;text-align:right;font-weight:800}
.lgd{width:52px;text-align:right;font-weight:900;font-size:10.5px}
@media (max-width:420px){ .pielg{min-width:0;width:100%} .lgv{width:70px} }
.tag.memo{background:var(--panel2);color:var(--tx2);border:1px solid var(--line)}
.cmp td.inp-cell{padding:3px 4px}
.kindhd{display:flex;align-items:baseline;gap:8px;padding:9px 14px 5px;font-size:12.5px;font-weight:900;color:var(--tx2);
  background:var(--panel2);border-top:1px solid var(--line)}
.kindhd.sumline{border-top:2px solid var(--line);font-size:13.5px;color:var(--tx);padding:10px 14px}
.kindlist{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.kindrow{display:flex;align-items:center;gap:7px;font-size:12.5px}
.kindrow .knm{flex:none;min-width:74px;font-weight:800}
.kindrow .kbar{flex:1;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.kindrow .kbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.kindrow .kamt{flex:none;min-width:62px;text-align:right}
.kindrow .kpct{flex:none;min-width:30px;text-align:right}
.prod .hand{flex:none;cursor:grab;color:var(--tx3);font-size:15px;padding:0 1px;touch-action:none;user-select:none}
.prod.drag{opacity:.4}
.prod.pover{outline:2px dashed var(--accent);outline-offset:-2px}
.pname{cursor:pointer}
.pname .pen2{font-size:10px;opacity:.5}
.unitnote{margin-left:9px;color:var(--tx3);font-weight:600;font-size:10.5px;white-space:nowrap}
.payn{display:block;font-size:10px;color:var(--tx3);font-weight:700;line-height:1.3}
.bars{display:flex;flex-direction:column;gap:11px;margin-top:4px}
.cfrow.drag{opacity:.4}
.cfrow .hand{flex:none;cursor:grab;color:var(--tx3);font-size:15px;touch-action:none;user-select:none}
.cname{cursor:pointer}
.cname.off{text-decoration:line-through;color:var(--tx3)}
.crow{padding:10px 14px;border-bottom:1px solid var(--line)}
.crow.on{background:var(--accent-soft)}
.tcolbar{display:flex;gap:4px;justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;padding-left:6px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.tcolbar::-webkit-scrollbar{display:none}
.tcolbar .lg{flex:none;font-size:10.5px;padding:2px 7px;border:1px solid var(--line);border-radius:999px;
  background:var(--panel2);color:var(--tx2);cursor:pointer;white-space:nowrap}
.cmini{flex:none;padding:4px 9px;font-size:11.5px;min-width:0}
.chit{cursor:pointer;width:11px;height:11px;border-radius:4px;margin:0}
.crow .lnk{flex:none;font-size:12.5px;padding:2px 3px;line-height:1}
.bgrp{cursor:pointer}
.bhd .goal{font-size:10.5px;color:var(--tx3);font-weight:700;margin-left:5px}
.fullmk{color:var(--ok);font-weight:900}
.bhd .goal.own{color:var(--warn)}
.bgrp:active{opacity:.75}
.brkrow{display:flex;align-items:baseline;gap:6px;padding:4px 0;border-top:1px solid var(--line);font-size:12px}
.brkrow.off{opacity:.55}
.brkrow.off .bk1{text-decoration:line-through}
.brkrow .bk1{flex:1;min-width:0}
.brkrow .bk1 .sub2{display:block;font-size:11px;color:var(--tx2);font-weight:600;margin-top:1px}
.brkrow .bk2{flex:none;min-width:66px;text-align:right;color:var(--tx3);font-size:11.5px}
.brkrow .bk3{flex:none;min-width:70px;text-align:right}
.rngline{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--tx2);margin:2px 0 1px}
.rngline b{font-weight:800}
.plusa{color:var(--warn);font-weight:900}
.miniseg button{white-space:nowrap}
.bgrp.sub{margin-left:14px;padding-left:9px;border-left:2px solid var(--line)}
.bhd{display:flex;align-items:baseline;gap:5px;margin-bottom:4px}
.bhd .bnm{flex:1;font-size:12.5px;font-weight:800;letter-spacing:-.2px}
.bhd .bch{flex:none;font-size:11px;font-weight:800}
.brow{display:flex;align-items:center;gap:6px;margin-top:3px}
.brow .blab{flex:none;width:26px;font-size:10px;color:var(--tx3);font-weight:700}
.brow .btrk{flex:1;min-width:0;height:13px;background:var(--panel2);border-radius:3px;overflow:hidden}
.brow .btrk i{display:block;height:100%;border-radius:3px;transition:width .2s}
.brow .bval{flex:none;min-width:70px;text-align:right;font-size:11.5px}
.feeline{font-size:17px;line-height:1.4;text-align:left}
.cmp thead th .subfold{cursor:pointer;margin-right:2px}
.cmp thead th .foldtx{cursor:pointer;user-select:none}
.fnote{margin-top:9px}
.fnbtn{background:none;border:0;padding:2px 0;font:inherit;font-size:11.5px;font-weight:800;
  color:var(--tx3);cursor:pointer;letter-spacing:-.2px}
.fnote.warn .fnbtn{color:var(--warn)}
.fnbody{font-size:11.5px;line-height:1.65;color:var(--tx2);margin-top:5px}
.fnote.warn .fnbody{color:var(--warn)}
.cmp th.ck,.cmp td.ck{width:22px;min-width:22px;padding:4px 0 4px 2px;text-align:center}
.cmp td.ck input{width:17px;height:17px;margin:0;vertical-align:middle}
.cmp td.inp-cell input{width:96px;padding:5px 7px;font-size:12px;text-align:right;
  border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--tx);font:inherit;
  font-size:12px;text-align:right}
.pnote-row td{background:var(--panel2);font-size:11px;color:var(--tx2);line-height:1.6;padding:6px 10px}
.cmp tr.offrow td{opacity:.38;background:repeating-linear-gradient(45deg,transparent,transparent 5px,var(--line) 5px,var(--line) 6px)}
.cmp th.hid{cursor:pointer;user-select:none;-webkit-user-select:none;position:relative}
.cmp th.hid .x{display:inline-block;margin-left:4px;font-size:12px;font-weight:900;opacity:.35}
.cmp th.hid:active .x{opacity:.9;color:var(--down)}
.picks{display:flex;flex-direction:column;gap:6px}
.pick{display:flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--line);
  border-radius:10px;background:var(--panel2);cursor:pointer;opacity:.5}
.pick.on{opacity:1;border-color:var(--accent);background:var(--accent-soft)}
.pick input{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:0}
.pick .pnm{font-size:12.5px;font-weight:800;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.pick .pnm.dead{text-decoration:line-through;color:var(--tx3)}
.mk.big{font-size:13px;margin-right:4px}
.ins{display:inline-block;min-width:17px;padding:1px 4px;border-radius:5px;color:#fff;
  font-size:9.5px;font-weight:900;text-align:center;margin-right:3px;vertical-align:1.5px;letter-spacing:-.2px}
.cmp tr.drag{opacity:.35;background:var(--accent-soft) !important}
.cmp tr.dropline td{box-shadow:inset 0 2px 0 0 var(--accent)}
.cmp td.hand{cursor:grab;color:var(--tx3);font-size:15px;padding:0 2px;touch-action:none;
  user-select:none;-webkit-user-select:none;text-align:center}
.cmp tr.cat td{cursor:pointer}
.cmp tr.cat .fold{display:inline-block;width:16px;font-size:13px;opacity:.9;font-weight:900}
.cmp thead th.foldcell{cursor:pointer;user-select:none;text-align:center;padding:8px 0}
.cmp thead th[data-foldall]{cursor:pointer;user-select:none}
.cmp thead th[data-foldall] .fold{display:inline-block;width:13px;font-size:12px;opacity:.85;font-weight:900}
.hd h2 .fold{display:inline-block;width:15px;font-size:11px;opacity:.7}

<script>
/* ============================================================
   보장 비교 — 단일 파일 도구
   저장: localStorage (기기 안)
   ============================================================ */
"use strict";
const APP_VERSION = "2026.10.02.0355";
const KEY = "insure.v1";
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
/* 짧고 서로 겹치지 않는 꼬리표 — uid() 앞부분은 시각이라 늘 같아서 쓰면 안 된다 */
let RIDN = 0;
const rid = () => (++RIDN).toString(36) + Math.random().toString(36).slice(2, 6);

function blank() {
  return {
    custs: [],          /* 고객 */
    cur: null,          /* 보고 있는 고객 id */
    dict: {},           /* 담보명 짝 사전: 표준키 -> [별칭...] */
    cats: {},           /* 담보 분류 직접 지정: 표준키 -> 분류키 */
    labels: {},         /* 비교표 줄 이름 직접 지정: 표준키 -> 이름 */
    ord: {},            /* 내가 끌어서 정한 순서: 표준키 -> 번호 */
    savedAt: 0,         /* 이 기기에서 마지막으로 내용이 바뀐 시각 */
    ordBak: {},         /* 순서를 지우기 직전 모습 — 한 번은 되살릴 수 있게 */
    bars: {},           /* 막대에 넣을 담보 직접 고르기: 막대키 -> {줄키: true/false} */
    barGoal: {},        /* 막대가 꽉 차는 기준 금액: 막대키 -> 원 */
    settings: { theme: "auto", agent: "", office: "", tel: "", tint: 0.18, disc: "", dev: "" }
  };
}
let D = blank();
function load() {
  try { const o = JSON.parse(localStorage.getItem(KEY) || ""); if (o && o.custs) D = Object.assign(blank(), o); }
  catch (e) {}
  D.settings = Object.assign(blank().settings, D.settings || {});
  if (D.settings.tint == null) D.settings.tint = 0.18;
  /* 예전 분류 이름을 새 이름으로 바꿔 둔다 */
  Object.keys(D.cats || {}).forEach(k => { const v = D.cats[k]; if (v && !CATN[v]) D.cats[k] = CATOLD[v] || "etc"; });
  if (!D.dict) D.dict = {};
  if (!D.cats) D.cats = {};
  if (!D.labels) D.labels = {};
  if (!D.ord) D.ord = {};
  if (D.settings.disc && D.settings.disc.indexOf(DISC_OLD) >= 0) D.settings.disc = "";
  (D.custs || []).forEach(c => { if (!c.at) c.at = Date.now(); });
  migrate();
  seedStamps();          /* 새 항목을 채운 뒤에 기준을 잡아야 괜히 분석일이 바뀌지 않는다 */
  loadCols();
}
/* 예전에 저장해 둔 내용을 하나도 잃지 않고 새 항목만 채운다 */
function migrate() {
  let touched = false;
  if (!D.bars) { D.bars = {}; touched = true; }
  if (!D.barGoal) { D.barGoal = {}; touched = true; }
  (D.custs || []).forEach(c => {              /* 예전 버전은 고객마다 따로 적어 두었다 */
    if (c.bars) { Object.keys(c.bars).forEach(k => {
      D.bars[k] = Object.assign({}, c.bars[k], D.bars[k] || {}); });
      delete c.bars; touched = true; }
  });
  (D.custs || []).forEach(c => (c.prods || []).forEach(p => {
    if (!p.id) { p.id = uid(); touched = true; }
    if (p.kind === undefined) { p.kind = "보장성"; touched = true; }
    if (p.note === undefined) { p.note = ""; touched = true; }
    if (p.refund === undefined) { p.refund = 0; touched = true; }
    (p.items || []).forEach(it => {
      if (!it.id) { it.id = uid(); touched = true; }
      if (it.on === undefined) { it.on = true; touched = true; }
      /* 결정: 기존은 "유지", 신규는 "가입"이 기본. 정하지 않았다고 줄어든 것처럼 보이지 않게 한다 */
      if (it.keep === undefined) { it.keep = true; touched = true; }
      if (it.cut === undefined) { it.cut = 0; touched = true; }
      if (it.cov === undefined) { it.cov = ""; touched = true; }
      if (it.covAmt === undefined) { it.covAmt = 0; touched = true; }
      if (it.renew === undefined) { it.renew = RENEW_RE.test(String(it.name || "")); touched = true; }
    });
  }));
  if (touched) { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) {} }
}
/* 고객 내용이 실제로 바뀐 날만 "마지막 분석일"로 남긴다 */
let LASTC = {};
function stamp(c) { return JSON.stringify([c.prods, D.cats, D.ord, D.labels, D.dict]); }
function seedStamps() { LASTC = {}; (D.custs || []).forEach(c => { LASTC[c.id] = stamp(c); }); LASTJ = bodyOf(D); }
let LASTJ = null;
function bodyOf(o) { return JSON.stringify([o.custs, o.dict, o.cats, o.labels, o.ord, o.bars, o.barGoal, o.settings]); }
function save() {
  try {
    const c = cust();
    if (c) {
      const j = stamp(c);
      if (LASTC[c.id] !== j) { c.updated = Date.now(); LASTC[c.id] = j; }
      if (!c.updated) c.updated = c.at || Date.now();
    }
    /* 내용이 실제로 바뀐 때만 "마지막 저장" 시각을 올린다 — 그냥 열어 본 것으로는 안 바뀐다 */
    const b = bodyOf(D);
    if (LASTJ !== null && b !== LASTJ) D.savedAt = Date.now();
    LASTJ = b;
    localStorage.setItem(KEY, JSON.stringify(D)); snap();
  } catch (e) { toast("저장 공간이 부족합니다"); }
}
/* 며칠 전인지 사람 말로 */
function ago(ts) {
  if (!ts) return "";
  const d = Math.floor((Date.now() - ts) / 86400000);
  if (d <= 0) return "오늘";
  if (d === 1) return "어제";
  if (d < 7) return d + "일 전";
  if (d < 31) return Math.floor(d / 7) + "주 전";
  if (d < 365) return Math.floor(d / 30) + "달 전";
  return Math.floor(d / 365) + "년 전";
}
/* 2026-10-01 20:51 — 어느 쪽이 최신인지 견주려고 */
function timeStr(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  return dayStr(ts) + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
/* 몇 분/몇 시간 차이인지 */
function gapStr(ms) {
  const m = Math.round(Math.abs(ms) / 60000);
  if (m < 1) return "거의 같은 때";
  if (m < 60) return m + "분";
  const h = Math.round(m / 60);
  if (h < 48) return h + "시간";
  return Math.round(h / 24) + "일";
}
function devName() { return (D.settings && D.settings.dev || "").trim(); }
function dayStr(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
/* 하루에 한 번씩 스냅샷을 남겨 실수로 지워도 되돌릴 수 있게 */
const SNAP = KEY + ".snap";
function snap() {
  try {
    const list = JSON.parse(localStorage.getItem(SNAP) || "[]");
    const day = todayISO();
    if (list.length && list[list.length - 1].day === day) list[list.length - 1] = { day, at: Date.now(), json: JSON.stringify(D) };
    else list.push({ day, at: Date.now(), json: JSON.stringify(D) });
    while (list.length > 7) list.shift();
    localStorage.setItem(SNAP, JSON.stringify(list));
  } catch (e) {}
}
function snaps() { try { return JSON.parse(localStorage.getItem(SNAP) || "[]"); } catch (e) { return []; } }

/* ---------- 갱신형 ---------- */
const RENEW_RE = /(갱\s*신|\(갱\)|\[갱\]|갱신형|자동갱신)/;
const isRenew = it => !!(it && it.renew);
/* 이름에서 갱신 표시를 떼어 낸다 — 앞에 (갱) 배지로 따로 보여주기 때문 */
function bareName(n) {
  return String(n || "").replace(/[（(\[]?\s*(갱신형|비갱신형|자동갱신|갱신|갱)\s*[)）\]]?/g, " ")
    .replace(/\s{2,}/g, " ").trim() || String(n || "");
}

/* ---------- 보장 분류 ---------- */
const CATS = [
  ["life",    "사망·후유장해", "#7c8a9e"],   /* 회색빛 남색 */
  ["cancerD", "암 진단",      "#d64545"],   /* 빨강 진한 */
  ["cancerT", "암 치료",      "#e88b8b"],   /* 빨강 연한 */
  ["vesselD", "뇌·심 진단",    "#e2822f"],   /* 주황 진한 */
  ["vesselT", "뇌·심 치료",    "#f0ab6c"],   /* 주황 연한 */
  ["specD",   "특정 진단",     "#cf9e14"],   /* 노랑 진한 */
  ["specT",   "특정 치료",     "#e3c45c"],   /* 노랑 연한 */
  ["injury",  "재해·상해",     "#a9805c"],   /* 갈색 */
  ["surgery", "수술",         "#3fa55f"],   /* 초록 진한 */
  ["hosp",    "입원·통원",     "#86bf63"],   /* 초록 연한 */
  ["care",    "간병·치매·요양", "#9a79d1"],   /* 보라 */
  ["cost",    "실손·치료비",    "#3f9e9e"],   /* 청록 */
  ["etc",     "기타",         "#96a1ac"],   /* 회색 */
  ["driver",  "운전자",       "#3b74d8"],   /* 파랑 진한 */
  ["car",     "자동차",       "#54aee0"]    /* 파랑 연한 */
];
const CATN = CATS.reduce((a, x) => (a[x[0]] = x[1], a), {});
const CATC = CATS.reduce((a, x) => (a[x[0]] = x[2], a), {});
const CATI = CATS.reduce((a, x, i) => (a[x[0]] = i, a), {});
/* 예전에 쓰던 분류 이름을 새 이름으로 */
const CATOLD = { vessel: "vesselD", organ: "specD", diag: "specD", car: "driver" };
function hexRgb(h) {
  const m = String(h).replace("#", "");
  return [parseInt(m.slice(0, 2), 16), parseInt(m.slice(2, 4), 16), parseInt(m.slice(4, 6), 16)];
}
/* 색 진하기를 따르는 배경 — 소계처럼 색을 직접 쥔 곳에서 쓴다 */
function tintBg(hex, mul) {
  const t = (D.settings && D.settings.tint != null ? +D.settings.tint : 0.18) * (mul == null ? 1 : mul);
  if (!t) return "transparent";
  return catBg2(hex, Math.min(0.9, t));
}
function catBg2(hex, a) {
  const c = hexRgb(hex || "#aab3bd");
  return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
}
function catBg(k, mul) {
  const a = (D.settings && D.settings.tint != null ? +D.settings.tint : 0.18) * (mul == null ? 1 : mul);
  if (!a) return "transparent";
  const c = hexRgb(CATC[k] || "#aab3bd");
  return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + Math.min(1, a).toFixed(3) + ")";
}

/* 담보 이름에서 "무엇에 대한" + "무엇을" 두 가지를 읽어 분류를 정한다 */
function guessCat(name) {
  const n = String(name || "").replace(/\s/g, "");
  if (/(운전자|벌금|변호사|형사합의|사고처리지원|면허정지|면허취소|보복운전|스쿨존|어린이보호구역|음주운전|무면허|방어비용)/.test(n)) return "driver";
  if (/(자동차|자차|렌트|대차|긴급출동|차량손해|보험료할증|할증지원|부상치료|부상위로)/.test(n)) return "car";
  if (/(실손|실비|의료비|도수치료|체외충격파|증식치료|비급여주사|MRI|비급여약제|본인부담금)/.test(n)) return "cost";
  if (/(간병|치매|장기요양|요양병원|LTC|일상생활장해|경도인지)/.test(n)) return "care";
  if (/(사망|유족|상속|후유장해|후유장애|주계약|종신|장례)/.test(n) && !/(진단|치료|수술|입원|통원)/.test(n)) return "life";

  const act =
      /(수술|시술|이식|스텐트|관혈|절제)/.test(n) ? "S"
    : /(입원|통원|일당|병실)/.test(n)            ? "H"

function simil(a, b) {

  if (MODS(a) !== MODS(b)) return 0.3;     /* 표적항암 vs 카티항암 → 다른 담보 */
  if (SUBJ(a) !== SUBJ(b)) return 0.3;     /* 뇌졸중진단비 vs 암진단비 → 다른 담보 */
  if (a.indexOf(b) >= 0 || b.indexOf(a) >= 0) return 0.92;
  const A = bigrams(a), B = bigrams(b);
  const m = {}; A.forEach(x => m[x] = (m[x] || 0) + 1);

  B.forEach(x => { if (m[x] > 0) { m[x]--; hit++; } });

  if (!isFinite(v)) return null;

  else if (unit === "만") v *= 10000;

function findMoney(line) {

  let m;
  while ((m = re.exec(line))) {
    if (!m[1]) continue;
    let unit = (m[2] || "").replace(/\s/g, ""), v;
    if (/^억\d+만?$/.test(unit)) {                 /* 1억5000만 형태 */
      const eok = parseFloat(m[1].replace(/,/g, ""));
      const rest = parseFloat(unit.replace(/[억만]/g, ""));
      v = Math.round(eok * 100000000 + rest * 10000);
      unit = "억";
    } else v = money(m[1], unit ? unit[0] : "");
    if (v == null) continue;
    out.push({ v, unit: unit ? unit[0] : "", won: !!m[3], raw: m[0], i: m.index, len: m[0].length });
  }

}

      else if (m.amt == null && HDR.amt.test(t)) m.amt = j;
      else if (m.name == null && HDR.name.test(t)) m.name = j;
    });
    if (m.name != null && (m.amt != null || m.fee != null)) { hi = i; map = m; break; }
  }
  if (hi < 0) return null;
  const num = x => {
    const s = String(x == null ? "" : x);
    const f = findMoney(s).filter(y => y.unit || y.won || y.v >= 100);
    return f.length ? f[f.length - 1].v : 0;
  };
  const out = [];
  for (let i = hi + 1; i < rows.length; i++) {
    const c = rows[i];
    const nm = String(c[map.name] || "").trim();
    if (!nm || SKIP_RE.test(nm)) continue;
    const amount = map.amt != null ? num(c[map.amt]) : 0;
    const premium = map.fee != null ? num(c[map.fee]) : 0;
    if (!amount && !premium) continue;
    out.push({ name: cleanItemName(nm, []), amount, premium });
  }
  return out.length ? out : null;
}

/* 자유 형식 */
function parseFree(lines) {
  const out = [];
  let carry = "";
  lines.forEach(line => {
    if (SKIP_RE.test(line)) return;
    const mk = maskPeriod(line);
    const all = findMoney(mk).filter(x => {
      const after = mk.slice(x.i + x.len, x.i + x.len + 2);
      const before = mk.slice(Math.max(0, x.i - 1), x.i);
      /* 5대골절 · 1~14급 · 3종 · 6주 · 2회 — 담보명 속 숫자 */
      if (/^[대급종회주세%개년일차호가지군류형번]/.test(after)) return false;
      if (/[~\-–]/.test(before) && !x.unit && !x.won) return false;
      /* 단위도 "원"도 없는 아주 작은 수는 보험료가 아니다 */
      if (!x.unit && !x.won && x.v < 100) return false;
      return true;
    });
    const real = all.some(x => x.unit || x.won || x.v >= 10000);
    const ms = real ? all : [];
    if (!ms.length) {
      const txt = cleanItemName(line, []);
      if (txt && txt.length > 1 && !/^\d+$/.test(txt)) carry = txt;
      return;
    }
    /* 보장금액: 억/만 단위이거나 10만원 이상 */
    let amt = null, fee = null;
    const big = ms.filter(x => x.unit || x.v >= 100000);
    const small = ms.filter(x => !x.unit && x.v < 1000000);
    if (big.length) amt = big[0];
    if (small.length) fee = small[small.length - 1];
    if (amt && fee && amt.i === fee.i) fee = null;
    if (!amt && ms.length >= 2) { amt = ms[0]; fee = ms[ms.length - 1]; }
    if (amt && fee && amt === fee) fee = null;
    if (!amt && !fee) return;
    let nm = cleanItemName(line, [amt, fee].filter(Boolean));
    if (!nm || nm.length < 2) nm = carry || nm;
    if (!nm) return;
    out.push({ name: nm, amount: amt ? amt.v : 0, premium: fee ? fee.v : 0 });
    carry = "";
  });
  return out;
}

/* 상품명 찾아내기 */
function guessProdName(lines) {
  for (const l of lines.slice(0, 14)) {
    const m = l.match(/(상품명|보험명)\s*[:：]?\s*(.+)/);
    if (m && m[2].trim().length > 2) return m[2].trim().slice(0, 40);
  }
  const isHdr = l => HDR.name.test(l) && (HDR.amt.test(l) || HDR.fee.test(l));
  for (const l of lines.slice(0, 8)) {
    if (isHdr(l)) continue;
    if (/(보험|플랜|Plan)/.test(l) && l.length < 45 && !/\d{3,}/.test(l) && !SKIP_RE.test(l))
      return l.replace(/[|｜\t]+/g, " ").trim().slice(0, 40);
  }
  return "";
}

/* ------------------------------------------------------------
   세로 라벨형
     담보명
     가입금액 / 2,000만원 / 보험기간 / 63년 / 납입기간 / 20년 / 보험료 / 16,400원 …

   ------------------------------------------------------------ */
const VLBL = [
  ["amount", /^(가입\s*금액|보험\s*가입\s*금액|가입금액\(구좌\)|가입구좌|구좌수)$/],
  ["cov",    /^(보장\s*금액|보험\s*금액|지급\s*금액|보장내용)$/],
  ["premium",/^(보험료|월\s*보험료|보험료\(월\)|월납\s*보험료|납입\s*보험료)$/],
  ["term",   /^(보험\s*기간|보장\s*기간|만기)$/],
  ["payTerm",/^(납입\s*기간|납입기간\/주기|납기)$/],
  ["cycle",  /^(납입\s*주기|납입방법)$/],
  ["state",  /^(특약\s*상태|계약\s*상태|상태|특약구분)$/],
  ["skip",   /^(구분|순번|번호|비고|담보명|특약명|상품명|보종)$/]

}
/* 이 붙여넣기가 세로 라벨형인지 */
function isVertical(lines) {
  let lab = 0, got = {};
  lines.forEach(l => { const k = vLabel(l); if (k) { lab++; got[k] = 1; } });
  return lab >= 4 && !!got.premium && (!!got.amount || !!got.cov);
}
function parseVertical(lines) {
  const out = [];
  let cur = null;
  const push = () => {
    if (cur && cur.name && (cur.amount || cur.premium || cur.cov)) out.push(cur);
    cur = null;
  };
  const fresh = nm => ({ name: nm, amount: 0, premium: 0, cov: "", term: "", payTerm: "", state: "" });
  for (let i = 0; i < lines.length; i++) {
    const L = lines[i];
    const key = vLabel(L);
    if (key) {
      let v = "";
      /* 값은 보통 바로 다음 줄. "가입금액 2,000만원" 처럼 한 줄에 같이 있기도 하다 */
      const inline = String(L).replace(/\s+/g, " ").trim()
        .replace(/^(가입\s*금액|보험\s*가입\s*금액|보장\s*금액|보험\s*금액|보험료|월\s*보험료|보험\s*기간|보장\s*기간|납입\s*기간|납입\s*주기|특약\s*상태|상태)\s*[:：]?\s*/, "");
      if (inline && inline !== String(L).replace(/\s+/g, " ").trim()) v = inline;
      else if (i + 1 < lines.length && !vLabel(lines[i + 1])) { v = lines[i + 1]; i++; }
      if (!cur) cur = fresh("");
      if (key === "amount") { const m = findMoney(v); cur.amount = m.length ? m[0].v : 0; }
      else if (key === "premium") { const m = findMoney(v).filter(x => x.won || x.v >= 10); cur.premium = m.length ? m[0].v : 0; }
      else if (key === "cov") { cur.cov = v; }
      else if (key === "term") { cur.term = v; }
      else if (key === "payTerm") { cur.payTerm = v; }
      else if (key === "state") { cur.state = v; }
      continue;
    }

    if (SKIP_RE.test(L) && !/특약|담보|주계약/.test(L)) continue;
    if (/^[\-—·•\s]*$/.test(L)) continue;
    push();
    cur = fresh(L.replace(/^[▶▷·•\-]\s*/, "").trim());

}
/* 담보들이 공통으로 가진 기간을 골라 상품 기간으로 쓴다 */
function commonVal(list, key) {
  const c = {};
  list.forEach(x => { const v = String(x[key] || "").trim(); if (v) c[v] = (c[v] || 0) + 1; });
  let best = "", n = 0;
  Object.keys(c).forEach(k => { if (c[k] > n) { n = c[k]; best = k; } });
  return best;
}

/* ------------------------------------------------------------

  [/수\s*[술순출]\s*비/g, "수술비"],
  [/수\s*[술순]/g, "수술"],
  [/진\s*[단한](?=[비금특])/g, "진단"],
  [/진\s*[단한]\s*특약/g, "진단특약"],
  [/치\s*[료코]/g, "치료"], [/시\s*료/g, "치료"],
  [/[함항]\s*[암양]\s*(?=[방약중])/g, "항암"],
  [/표\s*[직적]\s*[향항]\s*[양암]/g, "표적항암"],
  [/각\s*물/g, "약물"], [/약\s*들\s*어/g, "약물허"],
  [/감\s*[상싱]\s*선/g, "갑상선"],
  [/뇌\s*[출혈]\s*관/g, "뇌혈관"],
  [/히\s*협\s*심\s*장\s*간/g, "허혈성심질환"],
  [/[금급]\s*여\s*전\s*액\s*[본인]{1,2}\s*부\s*담/g, "급여전액본인부담"],
  [/[자재]\s*해\s*[후추]\s*상\s*골\s*절/g, "재해추상골절"],
  [/주\s*석\s*[참침]\s*조/g, "주석참조"],
  [/산\s*정\s*[리특]\s*[례대]\s*상?/g, "산정특례대상"],
  [/당\s*,\s*보장/g, "당뇨보장"],
  [/연\s*간\s*1\s*[회차][한원]?\s*[초최]\s*[대HE]{0,2}\s*10\s*[회E]?/g, "연간1회한/최대10회"],

function cleanOCR(t) {
  let n = String(t == null ? "" : t);
  OCRFIX.forEach(([re, to]) => { n = n.replace(re, to); });

  n = n.replace(/^(\d{1,2})\s*[.。]?\s*/, "$1. ");

  const open = (n.match(/\(/g) || []).length, close = (n.match(/\)/g) || []).length;

/* ------------------------------------------------------------

  return /^[\d,]+(만원|원|만|억원|억|구좌|좌)?$/.test(t) && /\d/.test(t);
}
const JUNK_RE = /^(기본정보|계약사항|구분|순번|번호|비고|중피보험자|종피보험자|주피보험자|수피보험자|계약자|피보험자|납입주기|월납|연납|분기납|일시납|보[험펑정청]료|가[임입]금액|보장금액|[님납남][입임][\/·／]?\s*보험기간|보험기간|[납남님][입임]기간|특약상태|[합함]계\s*보[험펑정청]료|총\s*보[험펑정청]료)$/;

  const t = String(l).replace(/\s/g, "");
  if (!t) return true;
  if (JUNK_RE.test(t)) return true;

  if (/^나이[번변]경후보험료$/.test(t)) return true;

  if (/^\(?\d{1,3}세[,，]?\s*[남여]\)?$/.test(t)) return true;   /* (38세,여) */
  if (/^\d{4}년\d{1,2}[월원]\d{1,2}일$/.test(t)) return true;
  if (isMoneyLine(t) && !/주석/.test(t)) return true;

/* 설계서의 "구분" 칸 글자 → 우리 분류 */
const GRPMAP = { "사망": "life", "암진단": "cancerD", "암치료": "cancerT",
  "뇌심진단": "vesselD", "뇌심치료": "vesselT", "뇌심혈관": "vesselD",
  "특정진단": "specD", "특정치료": "specT", "특정질환": "specD",
  "재해": "injury", "상해": "injury", "수술": "surgery", "입원": "hosp",
  "간병": "care", "실손": "cost", "기타": "etc", "운전자": "driver", "자동차": "car" };

function parseBlock(lines) {
  const out = [];
  let lastEnd = -1, grp = "";

    if (!isTermLine(lines[i])) continue;
    /* 기간 줄 바로 위가 가입금액 */
    let ai = i - 1, amt = 0, amtTxt = "";
    if (ai > lastEnd && isMoneyLine(lines[ai])) {
      amtTxt = lines[ai];
      if (!/주석/.test(amtTxt)) { const m = findMoney(amtTxt); amt = m.length ? m[0].v : 0; }
      ai--;
    }
    /* 그 위쪽이 담보 이름 (여러 줄로 잘려 있을 수 있다) */
    const parts = [];
    for (let j = lastEnd + 1; j <= ai; j++) {
      const L = lines[j], t = L.replace(/\s/g, "");
      if (GRPMAP[t]) { grp = GRPMAP[t]; continue; }
      if (junkLine(L)) continue;
      if (isTermLine(L)) continue;
      parts.push(L);
    }
    /* 기간 줄 바로 아래가 보험료 — 없으면 0 */
    let fee = 0;
    if (i + 1 < lines.length && isMoneyLine(lines[i + 1]) && !/주석/.test(lines[i + 1])) {
      const m = findMoney(lines[i + 1]);
      fee = m.length ? m[0].v : 0;

    } else lastEnd = i;
    /* 납입기간 / 보험기간 */
    const tt = String(lines[i]).replace(/\s/g, "").split(/[\/／]/);
    const pay = (tt[0] || "").replace(/[납남님]$/, "");
    const term = (tt[1] || "").replace(/[납남님]$/, "");

/* 머리글에서 합계 보험료 찾기 */
function headTotal(lines) {
  for (let i = 0; i < Math.min(lines.length, 40); i++) {
    const t = lines[i].replace(/\s/g, "");
    if (/^(합계|함계|총)?\s*보[험펑정청]료$/.test(t)) {
      for (let j = i + 1; j < Math.min(lines.length, i + 4); j++) {

function splitCSV(line) {                 /* 따옴표 안의 쉼표는 그대로 둔다 */

    const c = s[i];
    if (q) { if (c === '"') { if (s[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }

/* ------------------------------------------------------------
   원형 분류표 — 보장이 어느 쪽에 치우쳐 있는지 한눈에

   ------------------------------------------------------------ */
/* 소액암·유사암 — 암 진단비와 따로 센다 */
const SMALLC = /소액암|유사암|제자리암|상피내|경계성|기타피부암|갑상선|대장점막/;
const CHEMO  = /방사선|약물|항암|표적|카티|CART|중입자|양성자|호르몬|면역|암주치/;
/* 이 줄에 붙은 모든 이름을 한 덩어리 글자로 — 무엇에 대한 담보인지 가려내려고 */
function rowText(r) {
  return String(r.b.label || "") + " " + Object.values(r.b.alias || {}).join(" ");
}
function isSmallCancer(r) { return SMALLC.test(rowText(r)); }
/* 막대가 꽉 차는 기준 금액 — 고객마다가 아니라 한 번 정해 두고 계속 쓴다 */
const BARGOAL = { life: 200000000, canD: 100000000, canS: 50000000, canT: 100000000,
                  brain: 50000000, heart: 50000000, surgery: 20000000, care: 50000000 };
/* 기본값 → 고객별로 고친 값이 있으면 그것 */
function barGoalBase(k) {
  const g = D.barGoal && D.barGoal[k];
  return g > 0 ? g : (BARGOAL[k] || 50000000);
}
function barGoal(k) {
  const c = cust();
  const v = c && c.barGoal && c.barGoal[k];
  return v > 0 ? v : barGoalBase(k);
}
function barGoalOwn(k) {                     /* 이 고객만 따로 정해 둔 값인가 */
  const c = cust();
  return !!(c && c.barGoal && c.barGoal[k] > 0);
}
function setBarGoal(k, v) {
  const c = cust(); if (!c) return;
  if (!c.barGoal) c.barGoal = {};
  if (v > 0 && v !== barGoalBase(k)) c.barGoal[k] = v;
  else delete c.barGoal[k];
  save();
}
function clearBarGoal(k) {
  const c = cust();
  if (c && c.barGoal) { delete c.barGoal[k]; save(); }
}
/* 막대에 넣을 담보를 직접 고쳐 둔 것 — 없으면 자동 규칙을 쓴다 */
function barHas(d, r) {
  const o = D.bars && D.bars[d.k];
  if (o && o[r.b.key] != null) return !!o[r.b.key];
  return !!d.f(r);
}
function setBarPick(bk, rowKey, on) {
  if (!D.bars) D.bars = {};

function resetBarPick(bk) {

function barEdited(bk) {

}
/* 비교표와 같은 차례로 — 분류 순서 다음에 내가 끌어서 정한 자리 */
function barSort(a, b) { return (catRank(a.cat) - catRank(b.cat)) || (a.ord - b.ord) || 0; }
/* 막대로 보여 줄 묶음 — 고객이 제일 먼저 보는 것들만 */
function barDefs() {
  return [
    { k: "life",   n: "주계약 사망보장",   c: CATC.life,    f: r => r.cat === "life" },
    { k: "canD",   n: "암 진단비",         c: CATC.cancerD, f: r => r.cat === "cancerD" && !isSmallCancer(r) },
    { k: "canS",   n: "소액암 진단비",     c: CATC.cancerT, f: r => r.cat === "cancerD" && isSmallCancer(r), sub: true },
    { k: "canT",   n: "항암 방사선·약물치료", c: CATC.cancerT,
      f: r => r.cat === "cancerT" && CHEMO.test(rowText(r)), sub: true },

    { k: "heart",  n: "심혈관 진단비",     c: CATC.vesselD,
      f: r => r.cat === "vesselD" && !/뇌/.test(rowText(r)) && /심|허혈|관상동맥/.test(rowText(r)) },
    { k: "surgery", n: "수술비",           c: CATC.surgery, f: r => r.cat === "surgery", range: true },
    { k: "care",   n: "치매·간병",         c: CATC.care,    f: r => r.cat === "care" }
  ];

/* 수술비처럼 1종~5종으로 갈리는 담보 — 제일 적게 주는 값과 제일 많이 주는 값 */
function tierRange(rows, fin) {
  let lo = 0, hi = 0, n = 0;
  rows.forEach(r => {
    const parts = (fin ? (r.ok.parts || []).concat(r.wk.parts || []) : (r.o.parts || []));
    parts.forEach(({ it }) => {
      n++;
      const cp = covParts(fin && isCut(it) ? scaleCov(it.cov, cutRatio(it)) : it.cov);
      let vals;
      if (cp && cp.nums.length) {
        const mul = cp.unit === "억" ? 100000000 : cp.unit === "만" ? 10000 : 1;
        vals = cp.nums.map(x => x * mul);
      } else {
        const a = fin ? effAmt(it) : baseAmt(it);
        vals = a ? [a] : [];
      }
      vals.forEach(v => { if (!lo || v < lo) lo = v; if (v > hi) hi = v; });
    });
  });
  return { lo, hi, n };
}
/* 보장 구성 비교 — 가로 막대, 묶음마다 현재와 최종을 같은 자로 잰다 */
function viewPie(rs) {
  const basis = VIEW.pieBy === "fee" ? "fee" : "amt";
  const val = (r, fin) => basis === "fee" ? (fin ? r.finFee : r.nowFee) : (fin ? r.finAmt : r.nowAmt);
  const f = v => basis === "fee" ? won(v) + "원" : manwon(v) + "원";
  const defs = barDefs().map(d => {
    const list = rs.filter(r => barHas(d, r));
    const o = Object.assign({}, d, {
      a: list.reduce((x, r) => x + val(r, false), 0),
      b: list.reduce((x, r) => x + val(r, true), 0),
      rows: list
    });
    if (d.range && basis === "amt" && list.length) {
      const A = tierRange(list, false), B = tierRange(list, true);
      o.rngA = A; o.rngB = B;
      o.a = A.hi; o.b = B.hi;                 /* 막대는 제일 많이 주는 값으로 */
    }
    return o;
  }).filter(d => d.a > 0 || d.b > 0);
  if (!defs.length) return "";
  /* 보장금액은 정해 둔 기준 금액이 꽉 찬 것, 보험료는 가장 큰 것을 기준으로 */
  const max = defs.reduce((m, d) => Math.max(m, d.a, d.b), 0) || 1;
  const pct = (v, d) => {
    const base = basis === "amt" ? barGoal(d.k) : max;
    return Math.max(v > 0 ? 1.5 : 0, Math.min(100, v / (base || 1) * 100));
  };
  const full = (v, d) => basis === "amt" && v >= barGoal(d.k);
  const shut = !!(VIEW.cfold && VIEW.cfold.pie);
  const rngTxt = (R, nRows) => {
    if (!R || !R.hi) return "—";
    const t = (R.lo && R.lo !== R.hi) ? manwon(R.lo) + " ~ " + manwon(R.hi) + "원" : manwon(R.hi) + "원";
    return t + (nRows > 1 ? ' <span class="plusa" title="수술비 담보가 여러 가지라 한 번에 다 받는 금액이 아닙니다">+α</span>' : '');
  };

  return '<div class="card"><div class="hd pb">' +
      '<h2 data-cfold="pie" style="cursor:pointer;flex:1"><span class="fold">' + (shut ? "▸" : "▾") + '</span>막대그래프</h2>' +
      (shut ? '<span class="tiny muted b">' + defs.length + '개 묶음</span>' :
      '<div class="miniseg" style="width:auto;flex:none">' +
        '<button data-pieby="amt" class="' + (basis === "amt" ? "on" : "") + '" style="padding:5px 10px">보장금액</button>' +
        '<button data-pieby="fee" class="' + (basis === "fee" ? "on" : "") + '" style="padding:5px 10px">보험료</button>' +
      '</div>') + '</div>' +
    (shut ? '' :
    '<div class="bd" style="padding-top:4px">' +
      '<div class="bars">' + defs.map(d => {
        const dd = d.b - d.a;
        const rng = d.rngA || d.rngB;
        return '<div class="bgrp' + (d.sub ? ' sub' : '') + '" data-bar="' + esc(d.k) + '" title="눌러서 무엇이 들어갔는지 보기">' +
          '<div class="bhd">' +
            '<span class="cdot" style="background:' + d.c + '"></span>' +
            '<span class="bnm">' + esc(d.n) +
              (basis === "amt" ? '<span class="goal' + (barGoalOwn(d.k) ? ' own' : '') + '">/ ' +
                manwon(barGoal(d.k)) + '원' + (barGoalOwn(d.k) ? ' ✎' : '') + '</span>' : '') + '</span>' +
            '<span class="bch num ' + (dd > 0 ? "c-up" : dd < 0 ? "c-down" : "muted") + '">' +
              (dd ? (dd > 0 ? "▲" : "▼") + f(Math.abs(dd)) : "그대로") + '</span>' +
          '</div>' +
          (rng ? '<div class="rngline">' +
              '<span>현재 <b>' + rngTxt(d.rngA, d.rows.length) + '</b></span>' +
              '<span>최종 <b>' + rngTxt(d.rngB, d.rows.length) + '</b></span>' +
            '</div>' : '') +
          '<div class="brow"><span class="blab">현재</span>' +
            '<span class="btrk"><i style="width:' + pct(d.a, d).toFixed(1) + '%;background:' + catBg2(d.c, .45) + '"></i></span>' +
            '<span class="bval num">' + (d.a ? f(d.a) : "—") + (full(d.a, d) ? ' <span class="fullmk">✓</span>' : '') + '</span></div>' +
          '<div class="brow"><span class="blab b">최종</span>' +

            '<span class="bval num b">' + (d.b ? f(d.b) : "—") + (full(d.b, d) ? ' <span class="fullmk">✓</span>' : '') + '</span></div>' +
        '</div>';

/* 막대 하나에 무엇이 들어갔는지 보여 주고, 그 자리에서 고치게 한다 */
function barMenu(k) {

function arrow(k) {

/* 표에 보일 열 — 껐다 켜도 합계 계산에는 영향이 없다 */
const COLS = [
  ["nowAmt", "현재 보장",   "기존 보장"],
  ["finAmt", "최종 보장",   "신규 보장"],

];
const PICKCOLS = COLS;
let PAIRNM = null;                 /* 두 보험을 맞대 볼 때 [왼쪽이름, 오른쪽이름] */
function shortNm(p) {

  if (first && ins && (ins.indexOf(first) === 0 || first.indexOf(ins.slice(0, 2)) === 0))
    n = n.slice(first.length).trim() || n;
  if (n.length > 6) n = n.slice(0, 6) + "…";
  return (t ? t + " " : "") + (n || p.name || "보험");

function allFolded(rs) {

function cmpTable(rs, forPrint) {

        '<span class="foldtx" data-foldall="' + (allFolded(rs) ? "0" : "1") + '" title="눌러서 담보 접기·펴기">담보</span></th>') +

    if (k === "nowAmt") return '<td class="n num">' + money(fin ? r.nowAmt : r.o.amt, r.o.has, r.o.txt) + '</td>';
    if (k === "nowFee") { const f = fin ? r.nowFee : r.o.fee;
      return '<td class="n num muted">' + (r.o.has && f ? won(f) : r.o.has ? "—" : dash) + '</td>'; }
    if (k === "finAmt") {
      const a1 = fin ? r.nowAmt : r.o.amt, a2 = fin ? r.finAmt : r.w.amt;
      const hh = fin ? live : r.w.has;
      const mk = (r.o.has && hh) ? mark(a1, a2, false) : "";
      return '<td class="n num b">' + mk + (fin ? money(r.finAmt, live, r.finTxt) : money(r.w.amt, r.w.has, r.w.txt)) + '</td>';
    }
    if (k === "finFee") {
      const f1 = fin ? r.nowFee : r.o.fee, f = fin ? r.finFee : r.w.fee;
      const hh = fin ? live : r.w.has;
      const mk = (r.o.has && hh) ? mark(f1, f, true) : "";
      return '<td class="n num muted">' + (hh && f ? mk + won(f) : hh ? "—" : dash) + '</td>';
    }
    if (k === "diff") {
      const d = fin ? r.fAmt : r.dAmt;
      /* 그대로인 것과 해지한 것은 적지 않는다 — 담보명에 이미 줄이 그어져 있다 */
      const txt = fin
        ? (r.act === "add" ? '<span class="c-up">추가</span>'
           : r.act === "drop" ? ""
           : d ? arrow(d > 0 ? "up" : "down") + (d > 0 ? "+" : "-") + manwon(Math.abs(d)) : "")
        : (r.kind === "onlyNew" ? '<span class="c-up">추가</span>'

    const stripe = forPrint ? '' : ' style="box-shadow:inset 3px 0 0 0 ' + col + '"';

  if (VIEW.group === false) {

      const shut = VIEW.fold && VIEW.fold[g.key];

        '<span class="fold">' + (shut ? "▸" : "▾") + '</span>' +
        '<span class="cdot" style="background:' + g.color + '"></span>' + esc(g.name) +
        '<span class="cnt">' + g.rows.length + '개' + (shut ? " · 접힘" : "") + '</span></td></tr>';

     월 보험료 합계는 위쪽 요약 카드에 있다. */

      '<p class="tiny muted" style="margin:-4px 0 10px;line-height:1.6">보험사마다 형식이 달라도 담보명·가입금액·보험료를 찾아냅니다. 엑셀에서 복사한 표도 그대로 넣으면 됩니다. 잘못 읽힌 곳은 다음 화면에서 고칠 수 있습니다.</p>' +
      '<div id="pPrev"></div>',

            '<span class="muted" style="font-weight:400">담보명과 금액이 같은 줄에 있어야 합니다. 표 전체를 복사하거나 “자동차부상치료비 1,000만원 3,200원” 형태로 적어주세요.</span></p>';
          return;

        if (!$("#pName", el).value.trim() && res.name) $("#pName", el).value = res.name;
        /* 붙여넣기에 보험기간·납입기간이 적혀 있으면 그대로 넣는다 */

        }

          (odd.length ? (auto.length ? " " : "") + "기간이 다른 담보 " + odd.length + "개는 담보별로 따로 기억합니다 (" +
            odd.slice(0, 3).map(i => i.name + " " + (i.term || "?") + "/" + (i.payTerm || "?")).join(", ") + (odd.length > 3 ? " 외" : "") + ")." : "");

        res.wantFee = +String($("#pTotal", el).value).replace(/[^\d]/g, "") || 0;
        showItems(el, prev, run, res.items, side, close, p0, res.autoNote, res);
      };
    }

}

    const keep = items.filter(i => i.on !== false && i.name && (i.amount || i.premium || i.cov));
    if (!keep.length) return toast("담보가 없습니다");
    keep.forEach(i => { if (i.keep === undefined) i.keep = true; if (i.cut === undefined) i.cut = 0;
      if (i.cov === undefined) i.cov = ""; if (i.covAmt === undefined) i.covAmt = 0; });

    const extra = {
      term: $("#pTerm", el).value.trim(), payTerm: $("#pPay", el).value.trim(),
      start: $("#pStart", el).value, totalFee: +String($("#pTotal", el).value).replace(/[^\d]/g, "") || 0
    };

    if (p0) { p0.name = nm; p0.insurer = $("#pIns", el).value.trim(); p0.items = keep; Object.assign(p0, extra);
      if (!hasFee && extra.totalFee) p0.feeMode = "total"; }

      color: PAL[c.prods.length % PAL.length], items: keep, at: Date.now(), age: 0,
      term: extra.term, payTerm: extra.payTerm, start: extra.start, totalFee: extra.totalFee,
      feeMode: hasFee ? "item" : "total", spread: false });
    save(); closeAll(); go(TAB === "cmp" ? "cmp" : "prod");
    toast(keep.length + "개 담보를 넣었습니다");
  };
}

/* ---------------- 담보 한번에 고치기 ---------------- */
function bulkEdit(p, after) {
  const rows = (p.items || []).map(it => Object.assign({}, it));   /* 복사본 — 취소하면 그대로 버린다 */
  let filt = "", only = "all";
  const m = modal({
    title: "담보 한번에 고치기", wide: true,
    body: '<div id="bkTop"></div>' +
      '<div class="row" style="gap:7px;margin-bottom:8px">' +
        '<input id="bkQ" class="inp grow" placeholder="담보 이름으로 찾기" style="padding:7px 10px;font-size:13px">' +
      '</div>' +
      '<div class="chipscroll" style="margin:0 0 8px">' +
        '<button class="chip on" data-bf="all">전체</button>' +
        '<button class="chip" data-bf="nofee">보험료 없는 것</button>' +
        '<button class="chip" data-bf="noamt">금액 없는 것</button>' +
        '<button class="chip" data-bf="cov">보장금액 넣은 것</button>' +
      '</div>' +
      '<div id="bkBody"></div>',
    foot: '<button class="btn" id="bkCancel">취소</button>' +
          '<button class="btn pri" id="bkSave">저장</button>',
    onOpen(el, close) {
      const body = $("#bkBody", el), top = $("#bkTop", el);
      const drawTop = () => {
        const on = rows.filter(r => r.on !== false);
        const fee = on.reduce((a, r) => a + (+r.premium || 0), 0);
        const want = +p.totalFee || 0, gap = want ? want - fee : 0;
        top.innerHTML = '<div class="stat" style="margin:0 0 10px">' +
            '<div><b class="num">' + on.length + '/' + rows.length + '</b><span>담보</span></div>' +
            '<div><b class="num">' + won(fee) + '</b><span>보험료 합계</span></div>' +
            (want ? '<div><b class="num">' + won(want) + '</b><span>설계서 총보험료</span></div>' +
              '<div><b class="num ' + (gap ? "c-down" : "c-up") + '">' + (gap ? won(gap) : "맞음") + '</b><span>' + (gap > 0 ? "비어 있음" : gap < 0 ? "더 많음" : "차이") + '</span></div>' : '') +
          '</div>' +
          '<p class="tiny muted" style="margin:0 0 8px;line-height:1.6">' +
            '<b>가입금액은 만원</b>, <b>보험료는 원</b> 단위입니다. ' +
            '보장금액이 가입금액과 다를 때만 가운데 칸에 적으세요 — <b>30/50/100/500만</b> 처럼 여러 개도 됩니다.<br>' +
            '체크를 끄면 그 담보는 없는 것으로 봅니다. 다 고치고 <b>저장</b>을 한 번만 누르면 됩니다.</p>';
      };
      const draw = () => {
        drawTop();
        const list = rows.map((r, i) => ({ r, i })).filter(({ r }) => {
          if (filt && String(r.name).indexOf(filt) < 0) return false;
          if (only === "nofee") return !(+r.premium);
          if (only === "noamt") return !(+r.amount) && !r.cov;
          if (only === "cov") return !!r.cov;
          return true;
        });
        const st = "padding:6px 8px;font-size:12.5px;text-align:right";
        body.innerHTML = '<div class="card" style="margin:0">' + (list.length ? list.map(({ r, i }) =>
          '<div class="prod" style="padding:8px 10px;gap:8px;flex-wrap:wrap;background:' + catBg(itemCat(r)) + '">' +
            '<input type="checkbox" data-bo="' + i + '"' + (r.on !== false ? " checked" : "") +
              ' style="width:19px;height:19px;accent-color:var(--accent);flex:none">' +
            (r.renew ? '<span class="tag ren" style="flex:none;margin:0">갱</span>' : '') +
            '<input class="inp grow" data-bn="' + i + '" value="' + esc(r.name) + '" style="padding:6px 8px;font-size:13px;min-width:110px">' +
            '<button class="btn sm gho" data-bx="' + i + '" style="flex:none;padding:5px 9px">삭제</button>' +
            '<div class="row" style="gap:6px;width:100%;padding-left:27px">' +
              '<input class="inp grow" data-ba="' + i + '" value="' + toMan(r.amount) + '" inputmode="decimal" style="' + st + '" placeholder="가입(만원)">' +
              '<input class="inp grow" data-bc="' + i + '" value="' + esc(r.cov || "") + '" style="padding:6px 8px;font-size:12.5px" placeholder="보장금액">' +
              '<input class="inp" data-bp="' + i + '" value="' + comma(r.premium || "") + '" inputmode="numeric" style="' + st + ';width:94px;flex:none" placeholder="보험료(원)">' +
            '</div>' +
          '</div>').join("") : '<div class="empty">해당하는 담보가 없습니다.</div>') + '</div>';

        $$("[data-bo]", body).forEach(x => x.onchange = () => { rows[+x.dataset.bo].on = x.checked; drawTop(); });
        $$("[data-bn]", body).forEach(x => x.oninput = () => {
          const r = rows[+x.dataset.bn]; r.name = x.value; r.renew = RENEW_RE.test(x.value); });
        $$("[data-bc]", body).forEach(x => x.oninput = () => { rows[+x.dataset.bc].cov = x.value.trim(); });
        $$("[data-ba]", body).forEach(x => { liveComma(x); x.addEventListener("input", () => {
          rows[+x.dataset.ba].amount = fromMan(x.value); }); });
        $$("[data-bp]", body).forEach(x => { liveComma(x); x.addEventListener("input", () => {
          rows[+x.dataset.bp].premium = +String(x.value).replace(/[^\d]/g, "") || 0; drawTop(); }); });
        $$("[data-bx]", body).forEach(x => x.onclick = () => {
          const i = +x.dataset.bx;
          ask("<b>" + esc(bareName(rows[i].name) || "이 담보") + "</b> 를 목록에서 지웁니다.", () => {
            rows.splice(i, 1); draw();
          }, "지우기", true);
        });
      };
      draw();
      $("#bkQ", el).oninput = () => { filt = $("#bkQ", el).value.trim(); draw(); };
      $$("[data-bf]", el).forEach(b => b.onclick = () => {
        only = b.dataset.bf;
        $$("[data-bf]", el).forEach(y => y.classList.toggle("on", y === b));
        draw();
      });
      $("#bkCancel", el).onclick = () => close();
      $("#bkSave", el).onclick = () => {
        const keep = rows.filter(r => r.name && String(r.name).trim());
        if (!keep.length) return toast("담보가 없습니다");
        keep.forEach(r => {
          r.name = String(r.name).trim();
          if (r.keep === undefined) r.keep = true;
          if (r.cut === undefined) r.cut = 0;
          if (r.covAmt === undefined) r.covAmt = 0;
        });
        p.items = keep;
        save();
        close();
        toast(keep.length + "개 담보를 저장했습니다");
        if (after) after();
      };
    }
  });
  return m;
}

let XP = null;
/* 색·테두리가 들어가는 판(xlsx-js-style)을 먼저 받아 보고, 안 되면 기본 판으로 */
const XSRC = [
  ["https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js", true],
  ["https://unpkg.com/xlsx-js-style@1.2.0/dist/xlsx.bundle.js", true],
  ["https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js", false]

let XSTYLED = false;
function loadOne(src) {
  return new Promise((res, rej) => {
    const el = document.createElement("script");
    let done = false;
    const fin = ok => { if (done) return; done = true; ok ? res(window.XLSX) : rej(new Error("x")); };
    el.src = src;
    el.onload = () => fin(!!window.XLSX);
    el.onerror = () => fin(false);
    document.head.appendChild(el);
    setTimeout(() => fin(!!window.XLSX), 8000);
  });
}
function loadXLSX() {
  if (XP) return XP;
  XP = (async () => {
    for (let i = 0; i < XSRC.length; i++) {
      try { const X = await loadOne(XSRC[i][0]); if (X) { XSTYLED = XSRC[i][1]; return X; } }
      catch (e) {}
    }
    XP = null;
    throw new Error("xlsx");
  })();
  return XP;
}

    const x = sumRows(g.rows);
    const r0 = aoa.length;
    g.rows.forEach((r, k) => {
      const live = r.ok.live || r.wk.live;
      const dA = Math.round(r.fAmt), dF = Math.round(r.fFee);

        Array.from(new Set((r.o.parts || []).concat(r.w.parts || []).map(y => insTag(y.p)).filter(Boolean))).join("/"),
        (r.o.renew || r.w.renew) ? "갱신" : "",
        r.o.has ? r.nowAmt : "", live ? r.finAmt : "", dA || "",
        r.o.has ? r.nowFee : "", live ? r.finFee : "", dF || "",
        ACTN[r.act] || "", r.finTxt || r.o.txt || ""]);
    });
    const ov = sumOver(g.key);
    if (g.rows.length > 1 || ov) {
      const a1 = (ov && ov.now != null) ? ov.now : x.nowAmt;
      const a2 = (ov && ov.fin != null) ? ov.fin : x.finAmt;
      marks.push([aoa.length, "sum", g.color]);
      aoa.push(["", (ov && ov.label) ? ov.label : g.name + " 소계", "", "",
        a1, a2, Math.round(a2 - a1) || "",
        x.nowFee, x.finFee, Math.round(x.finFee - x.nowFee) || "", "", ""]);
    }
    const r1 = aoa.length - 1;
    if (r1 > r0) mg.push({ s: { r: r0, c: 0 }, e: { r: r1, c: 0 } });
    catMg.push([r0, r1, g.color]);
  });
  aoa.push([]);
  const totR = aoa.length;
  aoa.push(["", "월 보험료 합계", "", "", "", "", "", t.nowFee, t.finFee, t.finFee - t.nowFee, "", ""]);
  aoa.push([]);
  const noteR = aoa.length;
  aoa.push(["※ " + DISC_TITLE]);
  discLines().forEach(x => aoa.push(["· " + x]));

  const noteEnd = aoa.length - 1;

  const w1 = X.utils.aoa_to_sheet(aoa);

                 { wch: 12 }, { wch: 12 }, { wch: 13 }, { wch: 9 }, { wch: 18 }];
  for (let r = noteR; r <= noteEnd; r++) mg.push({ s: { r, c: 0 }, e: { r, c: NC - 1 } });
  w1["!merges"] = mg;

  if (S) {
    styleCell(w1, 0, 0, { font: { name: XF, sz: 15, bold: true, color: { rgb: "1F3864" } },
      alignment: { vertical: "center" } }, X);
    styleCell(w1, 1, 0, { font: { name: XF, sz: 10, color: { rgb: "666666" } } }, X);
    styleRow(w1, 3, NC, { font: { name: XF, sz: 10, bold: true, color: { rgb: "FFFFFF" } },
      fill: { fgColor: { rgb: "1F3864" } }, border: BOX,
      alignment: { horizontal: "center", vertical: "center", wrapText: true } }, X);

    marks.forEach(([r, kind, col]) => {
      const bg = kind === "sum" ? tint(col, .68)

      for (let cc = 1; cc < NC; cc++) {
        const fnt = { name: XF, sz: 10 };
        if (kind === "gone") { fnt.strike = true; fnt.color = { rgb: "999999" }; }
        if (kind === "sum") { fnt.bold = true; fnt.color = { rgb: "333333" }; }
        if (cc === 1 && kind !== "sum") fnt.bold = true;
        const num = cc >= 4 && cc <= 9;
        const sty = { font: fnt, fill: { fgColor: { rgb: bg } }, border: BOX,
          alignment: { horizontal: num ? "right" : cc === 11 ? "right" : "left", vertical: "center" } };
        if (num) sty.numFmt = (cc === 6 || cc === 9) ? '▲#,##0;▼#,##0;' : "#,##0";
        if ((cc === 6 || cc === 9) && kind !== "sum") {
          const a2 = X.utils.encode_cell({ r, c: cc });

    });

    /* 분류 칸 — 합쳐진 한 칸에 분류 색 */
    catMg.forEach(([r0, r1, col]) => {

    [7, 8, 9].forEach(cc => {

    for (let r = noteR; r <= noteEnd; r++)

    "설계서 월보험료", "조정 후 월보험료", "가져갈 때 월보험료",
    "보험기간", "납입기간", "가입일", "총 납입보험료", "지금까지 낸 돈", "예상 해약환급금", "환급률", "앞으로 낼 돈", "상품 특징 메모"]];
  pickedProds().forEach(p => {

      on.filter(isKept).reduce((a, i) => a + effAmt(i), 0), prodFeeRaw(p), prodFee(p), prodFeeKept(p),
      p.term || "", p.payTerm || "", p.start || "",
      x.total != null ? x.total : "", x.paidFee != null ? x.paidFee : "",
      p.refund || "", (p.refund && x.paidFee) ? Math.round(p.refund / x.paidFee * 100) / 100 : "",
      x.leftFee != null ? x.leftFee : "", p.note || ""]);

  s2.push([], ["마지막 분석일", c.updated ? dayStr(c.updated) : ""],
    ["현재 내는 월 보험료", t.nowFee], ["최종 월 보험료", t.finFee], ["최종 차액", t.finFee - t.nowFee],
    ["유지하는 기존", keepO], ["새로 넣는 신규", keepN],
    ["유지", t.act.keep], ["추가", t.act.add], ["해지", t.act.drop], ["교체", t.act.swap], ["감액", t.act.cut], ["증액", t.act.up]);
  const w2 = X.utils.aoa_to_sheet(s2);
  w2["!cols"] = [{ wch: 7 }, { wch: 28 }, { wch: 12 }, { wch: 9 }, { wch: 8 }, { wch: 10 }, { wch: 14 },
    { wch: 14 }, { wch: 15 }, { wch: 16 }, { wch: 12 }, { wch: 11 }, { wch: 12 }, { wch: 15 }, { wch: 15 },
    { wch: 15 }, { wch: 9 }, { wch: 14 }, { wch: 46 }];
  if (S) {
    styleRow(w2, 0, s2[0].length, { font: { name: XF, sz: 10, bold: true, color: { rgb: "FFFFFF" } },
      fill: { fgColor: { rgb: "1F3864" } }, border: BOX,
      alignment: { horizontal: "center", vertical: "center", wrapText: true } }, X);
    for (let r = 1; r <= pickedProds().length; r++) {
      const old = s2[r][0] === "기존";
      styleRow(w2, r, s2[0].length, { font: { name: XF, sz: 10 },
        fill: { fgColor: { rgb: old ? "F5F6F8" : "DCE9FF" } }, border: BOX,
        alignment: { vertical: "top", wrapText: true } }, X);
      [6, 7, 8, 9, 13, 14, 15, 17].forEach(cc => {
        const a2 = X.utils.encode_cell({ r, c: cc });
        if (w2[a2] && typeof w2[a2].v === "number") w2[a2].s = Object.assign({}, w2[a2].s, { numFmt: "#,##0" });
      });
      const a3 = X.utils.encode_cell({ r, c: 16 });
      if (w2[a3] && typeof w2[a3].v === "number") w2[a3].s = Object.assign({}, w2[a3].s, { numFmt: "0%" });
    }
  }
  X.utils.book_append_sheet(wb, w2, "보험별");

  /* ---------- 3) 분류별 ---------- */
  const s3 = [["분류", "담보 수", "현재 보장금액", "현재 보험료", "최종 보장금액", "최종 보험료", "보장 변화", "보험료 변화"]];
  const gcols = [];
  groupByCat(rs).forEach(g => {
    const x = sumRows(g.rows);
    gcols.push(g.color);
    s3.push([g.name, g.rows.length, x.nowAmt, x.nowFee, x.finAmt, x.finFee,
      Math.round(x.finAmt - x.nowAmt), Math.round(x.finFee - x.nowFee)]);

  s3.push(["합계", rs.length, t.nowAmt, t.nowFee, t.finAmt, t.finFee, t.finAmt - t.nowAmt, t.finFee - t.nowFee]);

  w3["!cols"] = [{ wch: 16 }, { wch: 9 }, { wch: 16 }, { wch: 14 }, { wch: 16 }, { wch: 14 }, { wch: 14 }, { wch: 14 }];
  if (S) {
    styleRow(w3, 0, 8, { font: { name: XF, sz: 10, bold: true, color: { rgb: "FFFFFF" } },
      fill: { fgColor: { rgb: "1F3864" } }, border: BOX, alignment: { horizontal: "center" } }, X);
    gcols.forEach((col, i) => {

        fill: { fgColor: { rgb: tint(col, .82) } }, border: BOX }, X);
      for (let cc = 2; cc <= 7; cc++) {

    for (let r = 1; r < s4.length; r++) {
      const dec = s4[r][10];
      const drop = dec === "해지" || dec === "가입 안 함";
      styleRow(w4, r, 11, { font: Object.assign({ name: XF, sz: 10 },
        drop ? { strike: true, color: { rgb: "999999" } } : {}),
        fill: { fgColor: { rgb: drop ? "F7E9E9" : s4[r][0] === "신규" ? "DCE9FF" : "F7F8FA" } }, border: BOX }, X);
      [4, 5, 6, 7, 8, 9].forEach(cc => {

        if (w4[a2] && typeof w4[a2].v === "number") w4[a2].s = Object.assign({}, w4[a2].s, { numFmt: "#,##0" });

  const buf = X.write(wb, { bookType: "xlsx", type: "array", cellStyles: true });
  offerFile(base + ".xlsx", new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }),
    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
    "구글 드라이브에 올려 [Google 스프레드시트로 열기]" + (S ? " — 색까지 그대로 보입니다" : " (이번엔 색 없이 저장됐습니다)"));
}

      const prep = () => {
        o.title = $("#qT", el).value.trim() || "보장 비교";
        D.settings.disc = $("#qDisc", el).value;
        D.pdf = o; save(); buildPrint(o);
      };
      $("#qGo", el).onclick = () => {
        prep(); close();
        setTimeout(() => { try { window.print(); } catch (e) { toast("인쇄 화면을 열 수 없습니다 — 파일로 저장을 써주세요"); } }, 150);
      };
      $("#qFile", el).onclick = () => {
        prep();
        const nm = (cust() ? cust().name + "_" : "") + "보장정리_" + todayISO() + ".html";
        close();
        offerFile(nm, printHTML(o.title), "text/html", "열어서 공유 → 프린트 → PDF로 저장");
      };
    }
  });
}
/* 인쇄 화면이 열리지 않는 기기를 위해, 그대로 인쇄되는 HTML 파일을 만든다 */
function printHTML(title) {
  const css = (document.querySelector("style") || {}).textContent || "";
  const m = css.match(/@media print\{([\s\S]*)\n\}/);
  let pcss = m ? m[1] : "";
  pcss = pcss.replace(/#app,\.tabbar,\.mask,\.toast\{display:none !important\}/g, "");
  return '<!doctype html><html lang="ko"><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<title>' + esc(title) + '</title><style>' +
    'body{margin:0;padding:14px;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;' +
    '-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#fff;color:#000}' +
    '#print{display:block}' + pcss +
    '@media screen{#print{max-width:1000px;margin:0 auto}' +
    '.hint{max-width:1000px;margin:0 auto 14px;padding:10px 12px;border:1px solid #bbb;border-radius:8px;' +
    'background:#f6f7f9;font-size:12px;line-height:1.7;color:#333}}' +
    '@media print{.hint{display:none}}' +
    '</style></head><body>' +
    '<div class="hint"><b>PDF로 저장하는 법</b><br>' +

function buildPrint_(o) {

      ' · ' + esc([D.settings.office, D.settings.agent, D.settings.tel].filter(Boolean).join(" / ")) : '') + '</div>' +
    '<div class="pbox"><b>기존</b> ' + esc(oldNames) + '<br><b>신규</b> ' + esc(newNames) +
      (o.fee ? '<br><b>월 보험료</b> ' + won(F1) + '원 → ' + won(F2) + '원 (' + (F2 - F1 >= 0 ? "+" : "") + won(F2 - F1) + '원)' : '') +
      (o.term ? (() => {
        const A = sideTerm("old"), B = sideTerm("neu");
        let s2 = '<br><b>기간</b> ';
        s2 += sideProds("old").map(pp => esc(pp.name) + " " + (pp.term || "?") + "/" + (pp.payTerm || "?")).join(", ") || "-";
        s2 += ' → ' + (sideProds("neu").map(pp => esc(pp.name) + " " + (pp.term || "?") + "/" + (pp.payTerm || "?")).join(", ") || "-");
        if (A.some || B.some) s2 += '<br><b>총 납입보험료</b> ' + (A.some ? won(A.total) + "원" : "—") + ' → ' + (B.some ? won(B.total) + "원" : "—") +
          '<br><b>지금까지 낸 돈</b> ' + (A.some ? won(A.paidFee) + "원" : "—") + ' → ' + (B.some ? won(B.paidFee) + "원" : "—") +
          '<br><b>앞으로 낼 돈</b> ' + (A.some ? won(A.leftFee) + "원" : "—") + ' → ' + (B.some ? won(B.leftFee) + "원" : "—");
        return s2;
      })() : '') +
      (fin
        ? '<br><b>이렇게 바뀝니다</b> 그대로 유지 ' + t.act.keep + '개 · 새로 추가 ' + t.act.add + '개 · 해지 ' + t.act.drop +
          '개 · 교체 ' + t.act.swap + '개 · 감액 ' + t.act.cut + '개 · 증액 ' + t.act.up + '개'
        : '<br><b>보장 변화</b> 커짐 ' + t.up + '개 · 줄어듦 ' + t.down + '개 · 신규에 없음 ' + t.onlyOld + '개 · 새로 생김 ' + t.onlyNew + '개') +
    '</div>';

  const cols = ['<th>담보</th>',
    '<th>' + (fin ? "현재 보장" : "기존 보장") + '</th>']
    .concat(o.fee ? ['<th>' + (fin ? "현재 보험료" : "기존 보험료") + '</th>'] : [])
    .concat(['<th>' + (fin ? "최종 보장" : "신규 보장") + '</th>'])
    .concat(o.fee ? ['<th>' + (fin ? "최종 보험료" : "신규 보험료") + '</th>'] : [])
    .concat(['<th>' + (fin ? "변화" : "보장 차이") + '</th>'])
    .concat(o.unit ? ['<th>1,000만원당</th>'] : [])
    .concat((o.verdict || (fin && o.act)) ? ['<th>' + (fin ? "처리" : "비고") + '</th>'] : []);
  h += '<table><thead><tr>' + cols.join("") + '</tr></thead><tbody>';

  const line = r => {
    const live = r.ok.live || r.wk.live;
    const cls = !o.color ? "" : fin
      ? (r.act === "add" || r.act === "up" ? "up" : r.act === "drop" || r.act === "cut" ? "down" : "")
      : (r.kind === "up" || r.kind === "onlyNew" ? "up" : r.kind === "down" || r.kind === "onlyOld" ? "down" : "");
    const vd = fin ? (ACTN[r.act] || "")
      : (r.kind === "up" ? "보장 커짐" : r.kind === "down" ? "보장 줄어듦"
        : r.kind === "onlyNew" ? "새로 생김" : r.kind === "onlyOld" ? "신규에 없음" : "같음");
    const a1 = fin ? r.nowAmt : r.o.amt, f1 = fin ? r.nowFee : r.o.fee;
    const a2 = fin ? r.finAmt : r.w.amt, f2 = fin ? r.finFee : r.w.fee;
    const h1 = r.o.has, h2 = fin ? live : r.w.has;
    const u1 = fin ? r.unow : r.uo, u2 = fin ? r.ufin : r.un;
    const dA = fin ? r.fAmt : r.dAmt;
    const x1 = fin ? r.o.txt : r.o.txt, x2 = fin ? r.finTxt : r.w.txt;
    return '<tr class="' + cls + '"><td>' +
      (o.renew && (r.o.renew || r.w.renew) ? "(갱) " : "") + esc(bareName(r.b.label)) + '</td>' +
      '<td class="n">' + (h1 ? (x1 ? esc(x1) : (a1 ? manwon(a1) : "-")) : dash) + '</td>' +
      (o.fee ? '<td class="n">' + (h1 && f1 ? won(f1) : h1 ? "-" : dash) + '</td>' : '') +
      '<td class="n">' + (h2 ? (x2 ? esc(x2) : (a2 ? manwon(a2) : "-")) : dash) + '</td>' +
      (o.fee ? '<td class="n">' + (h2 && f2 ? won(f2) : h2 ? "-" : dash) + '</td>' : '') +
      '<td class="n">' + (fin
        ? (r.act === "add" ? "추가" : r.act === "drop" ? "해지"
           : dA ? (dA > 0 ? "▲ +" : "▼ -") + manwon(Math.abs(dA)) : "")
        : (h1 && h2 ? (dA ? (dA > 0 ? "▲ +" : "▼ -") + manwon(Math.abs(dA)) : "-") : dash)) + '</td>' +
      (o.unit ? '<td class="n">' + (u1 ? won(Math.round(u1)) : "-") + " → " + (u2 ? won(Math.round(u2)) : "-") + '</td>' : '') +
      ((o.verdict || (fin && o.act)) ? '<td>' + vd + '</td>' : '') + '</tr>';
  };

  if (o.group) {
    groupByCat(rs).forEach(g => {
      h += '<tr class="pcat"><td colspan="' + cols.length + '">' + esc(g.name) + '</td></tr>';
      g.rows.forEach(r => { h += line(r); });
      const ov = sumOver(g.key);
      if (o.sum && (g.rows.length > 1 || ov)) {
        const x = sumRows(g.rows);
        let b1 = fin ? x.nowAmt : x.oAmt, b2 = fin ? x.finAmt : x.nAmt;
        if (ov && ov.now != null) b1 = ov.now;
        if (ov && ov.fin != null) b2 = ov.fin;
        const e1 = fin ? x.nowFee : x.oFee, e2 = fin ? x.finFee : x.nFee;
        h += '<tr class="psum"><td>' + esc((ov && ov.label) ? ov.label : g.name + " 소계") + '</td>' +
          '<td class="n">' + manwon(b1) + '</td>' + (o.fee ? '<td class="n">' + won(e1) + '</td>' : '') +
          '<td class="n">' + manwon(b2) + '</td>' + (o.fee ? '<td class="n">' + won(e2) + '</td>' : '') +
          '<td class="n">' + (b2 - b1 >= 0 ? "+" : "-") + manwon(Math.abs(b2 - b1)) + '</td>' +
          (o.unit ? '<td></td>' : '') + ((o.verdict || (fin && o.act)) ? '<td></td>' : '') + '</tr>';
      }
    });
  } else rs.forEach(r => { h += line(r); });

  h += '</tbody>' + (o.sum ? '<tfoot><tr><td>' + (fin ? "최종 합계" : "합계") + '</td>' +
    '<td class="n">' + manwon(A1) + '</td>' + (o.fee ? '<td class="n">' + won(F1) + '</td>' : '') +
    '<td class="n">' + manwon(A2) + '</td>' + (o.fee ? '<td class="n">' + won(F2) + '</td>' : '') +
    '<td class="n">' + (A2 - A1 >= 0 ? "+" : "-") + manwon(Math.abs(A2 - A1)) + '</td>' +
    (o.unit ? '<td></td>' : '') + ((o.verdict || (fin && o.act)) ? '<td></td>' : '') + '</tr></tfoot>' : '') + '</table>';

  const dl = discLines();
  const notes = prods().filter(pickOn).filter(p => p.note || kindOf(p) !== "보장성" || p.refund);
  if (notes.length) h += '<div class="pmemo"><b class="pnt">상품별 참고 사항</b>' +
    notes.map(p => {
      const x = prodTerm(p);
      return '· <b>' + esc(p.name) + '</b>' +
        (kindOf(p) !== "보장성" ? ' <b>[' + esc(kindOf(p)) + ']</b>' : '') +
        (p.refund ? ' 예상 해약환급금 ' + won(p.refund) + '원' +
          (x.paidFee ? ' (낸 돈 대비 ' + Math.round(p.refund / x.paidFee * 100) + '%)' : '') : '') +
        (p.note ? '<br>&nbsp;&nbsp;' + esc(String(p.note)).replace(/\n/g, '<br>&nbsp;&nbsp;') : '');
    }).join('<br>') + '</div>';
  if (dl.length) h += '<div class="pnote"><b class="pnt">' + esc(DISC_TITLE) + '</b>' +
    dl.map(x => '· ' + esc(x)).join('<br>') + '</div>';
  if (o.note) h += '<div class="pfoot">' +
    (fin ? '· <b>현재 보장</b>은 지금 가지고 계신 보험, <b>최종 보장</b>은 정리한 뒤의 모습입니다. ' +
           '유지하는 특약은 그대로 두고, 해지하는 특약은 빼고, 새로 넣는 특약은 더해서 계산했습니다.<br>'
         : '· 설계서에 적힌 그대로 기존 보험과 새 제안을 맞대어 본 것입니다.<br>') +
    '· 보장금액이 늘어난 담보는 파랑, 줄어든 담보는 빨강으로 표시했습니다. “—”는 해당 담보가 없다는 뜻입니다.<br>' +
    (o.renew ? '· <b>(갱)</b> 은 갱신형 특약으로, 갱신할 때 보험료가 오를 수 있습니다.<br>' : '') +
    (prods().filter(pickOn).some(isEst) ? '· 담보별 보험료를 알 수 없는 상품은 총보험료를 보장금액 비율로 나눈 <b>추정치</b>입니다.<br>' : '') +
    (rs.some(r => r.o.cut || r.w.cut) ? '· <b>감액</b>한 담보의 보험료는 보장금액에 비례해 어림한 값으로, 실제 보험사 산출과 다를 수 있습니다.<br>' : '') +
    '· 담보별 보험료는 설계서 기준이며, 특약을 빼거나 더하면 실제 보험료는 보험사 산출과 다를 수 있습니다.</div>';
  $("#print").innerHTML = h;
}

function bind() {
  const v = $("#view");
  $$("[data-add]", v).forEach(b => b.onclick = () => {

    pasteFlow(b.dataset.add);
  });
  $$("[data-prod]", v).forEach(b => b.onclick = () => openProd(b.dataset.prod));
  $$("[data-pdrag]", v).forEach(h => {
    h.addEventListener("pointerdown", e => pdragStart(e, h));
    h.addEventListener("click", e => e.stopPropagation());
  });
  $$("[data-newcust]", v).forEach(b => b.onclick = addCust);
  $$("[data-usecust]", v).forEach(b => b.onclick = () => { D.cur = b.dataset.usecust; save(); go("prod"); });
  $$("[data-editcust]", v).forEach(b => b.onclick = () => editCust(b.dataset.editcust));
  $$("[data-memocust]", v).forEach(b => b.onclick = () => memoCust(b.dataset.memocust));
  $$("[data-delcust]", v).forEach(b => b.onclick = () => delCust(b.dataset.delcust));
  /* ---- 정리 화면 ---- */
  const pick = key => {
    const [pid, iid] = String(key).split("|");
    const p = prod(pid); if (!p) return null;
    const it = (p.items || []).find(y => y.id === iid); if (!it) return null;
    return { p, it };
  };
  $$("[data-keep]", v).forEach(x => x.onchange = () => {
    const o = pick(x.dataset.keep); if (!o) return;
    o.it.keep = x.checked; save(); render();
  });

    x.onchange = () => {
      const o = pick(x.dataset.cut); if (!o) return;
      const man = +String(x.value).replace(/[^\d]/g, "") || 0;
      const full = cutBase(o.it);
      if (!man) { o.it.cut = 0; }
      else if (!full) { toast("가입금액을 먼저 넣어주세요"); o.it.cut = 0; }
      else if (man * 10000 >= full) { toast("가입금액(" + manwon(full) + "원)보다 작게 적어주세요"); o.it.cut = 0; }
      else o.it.cut = man * 10000;
      save(); render();
    };
    x.onkeydown = e => { if (e.key === "Enter") x.blur(); };
  });
  $$("[data-uncut]", v).forEach(x => x.onclick = () => {

    save(); render();

/* 분류 옮기기 창 안에서 끌어 옮기기 — 같은 분류 안에서만 */
let CFD = null;
function cfDragStart(e, hd, el, draw) {
  const row = hd.closest(".cfrow"); if (!row) return;
  CFD = { row, box: row.parentNode, moved: false, el, draw };
  row.classList.add("drag");
  try { hd.setPointerCapture(e.pointerId); } catch (x) {}
  e.preventDefault();
}
function cfDragMove(e) {
  if (!CFD) return;
  e.preventDefault();
  const pt = document.elementFromPoint(e.clientX, e.clientY);
  if (!pt || !pt.closest) return;
  const over = pt.closest(".cfrow");
  if (!over || over === CFD.row || over.parentNode !== CFD.box) return;
  const r = over.getBoundingClientRect();
  CFD.box.insertBefore(CFD.row, e.clientY < r.top + r.height / 2 ? over : over.nextSibling);
  CFD.moved = true;
}
function cfDragEnd() {
  if (!CFD) return;
  const d = CFD; CFD = null;
  d.row.classList.remove("drag");
  if (!d.moved) return;
  /* 창에 보이는 차례 그대로 번호를 다시 매긴다 */
  let n = 0;
  Array.from(d.el.querySelectorAll(".cfrow")).forEach(x => {
    const k = x.dataset.cfrow; if (k) D.ord[k] = n++;
  });
  save();
  toast("차례를 바꿨습니다");
  if (d.draw) d.draw(d.el);
}
document.addEventListener("pointermove", cfDragMove, { passive: false });
document.addEventListener("pointerup", cfDragEnd);
document.addEventListener("pointercancel", cfDragEnd);

/* ---------- 끌어서 순서 바꾸기 ---------- */
let DRAG = null;
function dragStart(e, handle) {
  const tr = handle.closest("tr");
  if (!tr) return;
  const tb = tr.parentNode;
  DRAG = { tr, tb, key: handle.dataset.drag, moved: false };
  tr.classList.add("drag");
  try { handle.setPointerCapture(e.pointerId); } catch (x) {}
  e.preventDefault();
}
function dragMove(e) {
  if (!DRAG) return;
  e.preventDefault();
  const pt = document.elementFromPoint(e.clientX, e.clientY);
  if (!pt || !pt.closest) return;
  const over = pt.closest("tr[data-row], tr.cat");
  if (!over || over === DRAG.tr || over.parentNode !== DRAG.tb) return;
  const r = over.getBoundingClientRect();
  const before = e.clientY < r.top + r.height / 2;
  DRAG.tb.insertBefore(DRAG.tr, before ? over : over.nextSibling);
  DRAG.moved = true;
}
function dragEnd() {
  if (!DRAG) return;
  const d = DRAG; DRAG = null;
  d.tr.classList.remove("drag");
  if (!d.moved) return;
  /* 놓인 자리 기준으로 순서를 다시 매긴다 */
  const rows = Array.from(d.tb.children);
  let n = 0, cat = null, moved = false;
  rows.forEach(tr => {
    if (tr.classList.contains("cat")) { cat = tr.dataset.fold || null; return; }
    if (tr.classList.contains("csum")) return;
    const k = tr.dataset.row; if (!k) return;
    D.ord[k] = n++;
    const bk = String(k).split("#")[0];
    if (bk !== k && D.ord[bk] == null) D.ord[bk] = D.ord[k];
    /* 다른 분류 칸으로 옮겼으면 분류도 따라 바뀐다 */
    if (cat && k === d.key && tr.dataset.cat !== cat) { D.cats[k] = cat; moved = true; }
  });
  save();
  render();
  toast(moved ? CATN[D.cats[d.key]] + " 로 옮겼습니다" : "순서를 바꿨습니다");
}

/* 기록을 지운다 — 같은 고객의 기록이 여럿이면 어느 것을 지울지 고르게 한다 */
function dropCusts(ids) {
  if (!ids.length) return;
  D.custs = D.custs.filter(y => ids.indexOf(y.id) < 0);
  if (ids.indexOf(D.cur) >= 0) D.cur = D.custs.length ? D.custs[0].id : null;
  save(); go("set");
  toast("기록 " + ids.length + "개를 지웠습니다");
}
function delCust(id) {
  const x = D.custs.find(y => y.id === id); if (!x) return;
  const fam = D.custs.filter(y => gidOf(y) === gidOf(x))
    .slice().sort((a, b) => (a.at || 0) - (b.at || 0));
  if (fam.length < 2) {
    return ask("<b>" + esc(x.name) + "</b> 기록과 그 상품을 모두 지웁니다.<br>되돌릴 수 없습니다.",

      fam.map((y, i) =>
        '<div class="prod plan" style="padding:9px 11px;gap:9px">' +
          '<input type="checkbox" data-dc="' + i + '"' + (y.id === x.id ? " checked" : "") +

          '<div class="grow" style="min-width:0">' +

              (y.tag ? ' <span class="tag add">' + esc(y.tag) + '</span>' : '') +

              (y.id === D.cur ? ' <span class="pill">보는 중</span>' : '') + '</div>' +
            '<div class="tiny muted">상품 ' + (y.prods || []).length + '개 · 담보 ' +

              (y.updated ? dayStr(y.updated) : dayStr(y.at)) + '</div>' +

        '설정 → 화면과 저장에서 <b>백업</b>을 먼저 받아 두셔도 좋습니다.</p>',

    onOpen(el, close) {

      $("#dcOk", el).onclick = () => {

      };
      $("#dcKeepNew", el).onclick = () => ask(
        "<b>" + esc(newest.name) + (newest.tag ? " (" + esc(newest.tag) + ")" : "") + "</b> 하나만 남기고 " +

        () => { close(); dropCusts(fam.filter(y => y !== newest).map(y => y.id)); }, "삭제", true);
      $("#dcAll", el).onclick = () => ask(
        "<b>" + esc(x.name) + "</b> 의 기록 <b>" + fam.length + "개를 전부</b> 지웁니다.",

function addCust() { askText("고객 추가", "이름", "", n => { newCust(n); save(); go("prod"); }, "예: 김영희"); }

/* 비교에서 보험을 걸러 놓은 채로도 같은 줄을 찾게 한다 */
function withPick(fn) {
  const o = USEPICK; USEPICK = true;
  try { return fn(); } finally { USEPICK = o; }
}
/* 반대로 — 걸러 놓은 것과 상관없이 "전체"로 계산한다 (합계·원형표·경고는 늘 전체 기준) */
function noPick(fn) {
  const o = USEPICK; USEPICK = false;
  try { return fn(); } finally { USEPICK = o; }
}
/* 소계를 직접 고쳐 쓰는 창 — "암진단 소계(암진단비)" 처럼 주력 보장 기준으로 */

/* 이 담보 줄에서 1,000만원당 가장 싼 값 */
function rowBestUnit(b) {
  let best = 0;
  ["old", "neu"].forEach(s2 => withPick(() => sideProds(s2)).forEach(p =>
    (b.cells[p.id] || []).filter(isOn).forEach(it => {
      const u = unitFee(effAmt(it), itemFee(p, it));
      if (u && (!best || u < best)) best = u;
    })));
  return best;
}
