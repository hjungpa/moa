      });
      $$("[data-rc]", el).forEach(x => x.onchange = () => {
        const o = grab(x.dataset.rc); if (!o) return;
        const man = +String(x.value).replace(/[^\d]/g, "") || 0;
        const full = cutBase(o.it);
        if (!man) o.it.cut = 0;
        else if (!full) { toast("가입금액을 먼저 넣어주세요"); o.it.cut = 0; }
        else if (man * 10000 >= full) { toast("가입금액(" + manwon(full) + "원)보다 작게 적어주세요"); o.it.cut = 0; }
        else o.it.cut = man * 10000;
        save(); close(); render(); rowMenu(key);
      });
      const gs = $("#rvCat", el);
      if (gs) gs.onchange = () => { setCat(key, gs.value); toast(CATN[gs.value] + " 로 옮겼습니다"); };
      const ns = $("#rvName", el);
      if (ns) ns.onchange = () => {
        const v = ns.value.trim();
        if (v) D.labels[key] = v; else delete D.labels[key];
        save();
      };
      $$("[data-re]", el).forEach(x => x.onclick = () => {
        const [pid, iid] = x.dataset.re.split("|");
        const p = prod(pid); if (!p) return;
        const i = p.items.findIndex(y => y.id === iid); if (i < 0) return;
        close(); editItem(p, i, () => { render(); rowMenu(key); });
      });
      $("#rvOk", el).onclick = () => { close(); render(); };
      $("#rvMove", el).onclick = () => { close(); VIEW.move = key; render(); };
      const sp = $("#rvSplit", el);
      if (sp) sp.onclick = () => { close(); splitMenu(b); };
    }
  });
}

function doRestore() {
  modal({
    title: "백업 불러오기",
    body: '<button class="btn wide" id="rPick" style="margin-bottom:10px">📄 백업 파일 선택</button>' +
      '<input type="file" id="rFile" class="hidden" accept=".json,application/json,text/plain">' +
      '<textarea id="rIn" class="inp" placeholder="또는 여기에 붙여넣기" style="min-height:120px;font-size:12px"></textarea>' +
      '<div id="rMsg" style="margin-top:10px"></div>',
    foot: '<button class="btn" id="rCheck">내용 확인</button><button class="btn pri" id="rGo" disabled>덮어쓰기</button>',
    onOpen(el, close) {
      const ta = $("#rIn", el), msg = $("#rMsg", el), go2 = $("#rGo", el), fi = $("#rFile", el);
      let parsed = null, risky = false;
      const bad = t => { parsed = null; risky = false; go2.disabled = true; msg.innerHTML = '<p class="sm c-down b" style="margin:0">' + t + '</p>'; };
      const check = () => {
        let raw = String(ta.value || "").trim();
        if (!raw) return bad("내용이 비어 있습니다.");
        const i = raw.indexOf("{"), j = raw.lastIndexOf("}");
        if (i < 0 || j < i) return bad("백업 형식이 아닙니다.");
        let o; try { o = JSON.parse(raw.slice(i, j + 1)); } catch (e) { return bad("내용이 중간에 끊긴 것 같습니다. 전체를 다시 복사해 주세요."); }
        if (!o || !Array.isArray(o.custs)) return bad("보장 비교 백업이 아닙니다.");
        parsed = o; go2.disabled = false;
        const fAt = +o.savedAt || 0, mAt = +D.savedAt || 0;
        const fDev = (o.settings && o.settings.dev || "").trim();
        const older = fAt && mAt && fAt < mAt;          /* 파일이 더 옛날 */
        const newer = fAt && (!mAt || fAt > mAt);
        risky = !!older;
        go2.textContent = older ? "그래도 덮어쓰기" : "덮어쓰기";
        go2.className = "btn " + (older ? "dan" : "pri");
        const when = t => t ? timeStr(t) : "시각 없음 (옛 백업)";
        msg.innerHTML =
          '<div class="card" style="margin:0"><div class="bd" style="padding:10px 11px">' +
            '<table class="cmp" style="font-size:12.5px"><tbody>' +
            '<tr><td class="nm" style="padding:5px 6px">가져올 파일' +
              (fDev ? ' <span class="tag add">' + esc(fDev) + '</span>' : '') + '</td>' +
              '<td class="n num b" style="padding:5px 6px">' + esc(when(fAt)) + '</td>' +
              '<td class="n num" style="padding:5px 6px">고객 ' + o.custs.length + '명</td></tr>' +
            '<tr><td class="nm" style="padding:5px 6px">지금 이 기기' +
              (devName() ? ' <span class="tag keep">' + esc(devName()) + '</span>' : '') + '</td>' +
              '<td class="n num b" style="padding:5px 6px">' + esc(when(mAt)) + '</td>' +
              '<td class="n num" style="padding:5px 6px">고객 ' + D.custs.length + '명</td></tr>' +
            '</tbody></table>' +
            (older
              ? '<p class="sm c-down b" style="margin:9px 0 0;line-height:1.65">⚠ <b>이 기기 자료가 ' +
                  gapStr(mAt - fAt) + ' 더 최신입니다.</b><br>덮어쓰면 그 사이에 이 기기에서 하신 작업이 사라집니다. ' +
                  '먼저 <b>백업</b>을 받아 두시거나, 이 기기 것을 다른 기기로 옮기세요.</p>'
              : newer
              ? '<p class="sm b" style="margin:9px 0 0;color:var(--ok);line-height:1.65">✓ 가져올 파일이 ' +
                  (mAt ? gapStr(fAt - mAt) + " 더 최신입니다." : "최신입니다.") + '</p>'
              : '<p class="tiny muted" style="margin:9px 0 0;line-height:1.6">시각을 알 수 없어 어느 쪽이 최신인지 가릴 수 없습니다. ' +
                  '고객 수와 이름을 보고 판단하세요.</p>') +
            '<p class="tiny muted" style="margin:7px 0 0">' + esc(o.custs.map(c => c.name).join(", ").slice(0, 90)) + '</p>' +
          '</div></div>';
      };
      $("#rPick", el).onclick = () => fi.click();
      fi.onchange = async () => { const f = fi.files && fi.files[0]; if (f) { ta.value = await f.text(); check(); } };
      ta.oninput = () => { if (parsed) { parsed = null; risky = false; go2.disabled = true; go2.textContent = "덮어쓰기"; go2.className = "btn pri"; msg.innerHTML = ""; } };
      $("#rCheck", el).onclick = check;
      const put = () => {
        D = Object.assign(blank(), parsed);
        if (!D.savedAt) D.savedAt = Date.now();
        /* 보고 있던 고객이 그 백업에 없으면 첫 고객으로 — 빈 화면이 되지 않게 */
        if (!D.custs.some(x => x.id === D.cur)) D.cur = D.custs.length ? D.custs[0].id : null;
        migrate(); seedStamps(); save(); close(); go("prod"); toast("불러왔습니다");
      };
      go2.onclick = () => {
        if (!parsed) return check();
        if (!risky) return put();
        ask("이 기기 자료가 더 최신입니다. 덮어쓰면 그동안 하신 작업이 사라집니다. 그래도 하시겠습니까?",
            put, "덮어쓰기", true);
      };
    }
  });
}

/* ---------------- 자동 갱신 ---------------- */
let UPD_AT = 0, UPD_SHOWN = false;
async function checkUpdate(manual) {
  if (!/^https?:$/.test(location.protocol)) { if (manual) toast("여기서는 확인할 수 없습니다"); return; }
  if (!manual && Date.now() - UPD_AT < 6e5) return;
  UPD_AT = Date.now();
  try {
    const r = await fetch(location.pathname + "?_=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("http");
    const m = (await r.text()).match(/APP_VERSION = "([^"]+)"/);
    if (!m) { if (manual) toast("갱신 정보를 찾지 못했습니다"); return; }
    if (m[1] === APP_VERSION) { if (manual) toast("이미 최신입니다"); return; }
    if (manual) { location.replace(location.pathname + "?v=" + encodeURIComponent(m[1])); return; }
    if (UPD_SHOWN) return;
    UPD_SHOWN = true;
    if (!$(".mask") && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || "")) {
      toast("새 버전으로 업데이트합니다");
      setTimeout(() => location.replace(location.pathname + "?v=" + encodeURIComponent(m[1])), 1100);
    }
  } catch (e) { if (manual) toast("인터넷 연결을 확인해 주세요"); }
}
setTimeout(() => checkUpdate(false), 2500);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(false); });

/* ---------------- 시작 ---------------- */
function applyTheme() {
  const t = D.settings.theme || "auto";
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}
$$(".tabbar button").forEach(b => b.onclick = () => go(b.dataset.tab));
$("#btnCust").onclick = () => {
  if (!D.custs.length) return addCust();
  modal({
    title: "고객 선택",
    body: '<div class="card" style="margin:0">' + D.custs.map(x =>
      '<div class="prod" data-pick="' + x.id + '"' + (x.id === D.cur ? ' style="background:var(--accent-soft)"' : '') + '>' +
        '<div class="ic" style="background:' + (x.id === D.cur ? "var(--accent)" : "var(--tx3)") + '">' + esc(x.name.slice(0, 2)) + '</div>' +
        '<div class="grow"><div class="b">' + esc(x.name) + '</div><div class="tiny muted">상품 ' + x.prods.length + '개</div></div>' +
        (x.id === D.cur ? '<span class="pill new">현재</span>' : '') + '</div>').join("") + '</div>',
    foot: '<button class="btn pri wide" id="cAdd">+ 새 고객</button>',
    onOpen(el, close) {
      $$("[data-pick]", el).forEach(b => b.onclick = () => { D.cur = b.dataset.pick; save(); close(); go("prod"); });
      $("#cAdd", el).onclick = () => { close(); addCust(); };
    }
  });
};
$("#btnTheme").onclick = () => {
  const o = ["auto", "light", "dark"], i = o.indexOf(D.settings.theme || "auto");
  D.settings.theme = o[(i + 1) % 3]; save(); applyTheme(); render();
};
load();
applyTheme();
if (!D.cur && D.custs.length) D.cur = D.custs[0].id;
go("prod");

</script>
