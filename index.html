<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가계부">
<title>우리집 가계부</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#fafbfc; --line:#e3e6ea;
  --tx:#15181d; --tx2:#5c646f; --tx3:#98a0ab;
  --accent:#2f6df6; --accent-soft:#e8efff;
  --ok:#17a34a; --warn:#e0a411; --bad:#e23b3b; --inc:#1a6fd4;
  --ok-soft:#e4f6ea; --warn-soft:#fdf3da; --bad-soft:#fdeaea;
  --shadow:0 1px 2px rgba(16,20,30,.06),0 6px 20px rgba(16,20,30,.06);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --panel:#171b22; --panel2:#1d222b; --line:#2a313c;
    --tx:#eef1f5; --tx2:#a3acb9; --tx3:#6d7785;
    --accent:#5b8cff; --accent-soft:#1b2740;
    --ok:#3ecf72; --warn:#f0bb3c; --bad:#ff6b6b; --inc:#74b6ff;
    --ok-soft:#14301f; --warn-soft:#332a12; --bad-soft:#35191a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --panel:#171b22; --panel2:#1d222b; --line:#2a313c;
  --tx:#eef1f5; --tx2:#a3acb9; --tx3:#6d7785;
  --accent:#5b8cff; --accent-soft:#1b2740;
  --ok:#3ecf72; --warn:#f0bb3c; --bad:#ff6b6b; --inc:#74b6ff;
  --ok-soft:#14301f; --warn-soft:#332a12; --bad-soft:#35191a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
input,select,textarea,button{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
.hidden{display:none !important}

/* ---------- layout ---------- */
#app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;
  display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);
}
.topbar h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.02em;flex:1}
.topbar .sub{font-size:12px;color:var(--tx3);font-weight:600}
.topbar .sub b{color:var(--accent)}
.acclist{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.acclist .r{display:flex;align-items:center;gap:10px;padding:12px 13px;border-top:1px solid var(--line);width:100%;background:var(--panel);border-left:0;border-right:0;border-bottom:0;text-align:left}
.acclist .r:first-child{border-top:0}
.acclist .r.on{background:var(--accent-soft)}
main{flex:1;padding:12px 14px calc(env(safe-area-inset-bottom) + 86px)}
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:var(--panel);
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:saturate(1.6) blur(14px);
  border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
.tabbar .in{max-width:720px;margin:0 auto;display:flex;width:100%}
.tabbar button{
  flex:1;background:none;border:0;padding:9px 2px 10px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;color:var(--tx3);font-weight:600;
}
.tabbar button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--accent)}

/* ---------- generic ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.card .hd{padding:12px 14px 0;display:flex;align-items:center;gap:8px}
.card .hd h2{font-size:13px;margin:0;font-weight:700;color:var(--tx2);letter-spacing:.02em;flex:1}
.card .bd{padding:12px 14px 14px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--tx3)}
.tiny{font-size:11.5px}
.sm{font-size:13px}
.b{font-weight:700}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{overflow-x:auto;-webkit-overflow-scrolling:touch}

.btn{
  border:1px solid var(--line);background:var(--panel2);color:var(--tx);
  border-radius:10px;padding:9px 13px;font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.gho{background:transparent}
.btn.dan{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}

.field{margin-bottom:10px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:5px}
.inp{
  width:100%;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;outline:none;
}
.inp:focus{border-color:var(--accent);background:var(--panel)}
textarea.inp{min-height:64px;resize:vertical;font-size:15px}
.two{display:flex;gap:8px}
.two>*{flex:1;min-width:0}

.pill{
  display:inline-flex;align-items:center;gap:5px;border-radius:999px;
  padding:3px 9px;font-size:11.5px;font-weight:700;border:1px solid var(--line);
  background:var(--panel2);white-space:nowrap;
}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--tx3)}
.light{width:13px;height:13px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(128,128,128,.22)}
.c-ok{color:var(--ok)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)} .c-inc{color:var(--inc)}
.bg-ok{background:var(--ok)} .bg-warn{background:var(--warn)} .bg-bad{background:var(--bad)} .bg-off{background:var(--tx3)}

.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .35s ease}

.empty{text-align:center;padding:26px 14px;color:var(--tx3);font-size:13px}
.empty b{display:block;color:var(--tx2);font-size:14px;margin-bottom:4px}

/* ---------- account cards ---------- */
.acc{display:flex;align-items:center;gap:11px;padding:12px 14px;border-top:1px solid var(--line)}
.acc:first-child{border-top:0}
.acc .ic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:14px;font-weight:800;color:#fff}
.acc .nm{font-weight:700;font-size:14.5px}
.acc .rt{text-align:right;flex:none}
.acc .rt .v{font-weight:800;font-size:15px}

/* ---------- transaction list ---------- */
.tx{display:flex;align-items:stretch;gap:0;border-top:1px solid var(--line);position:relative}
.tx:first-child{border-top:0}
.tx .stripe{width:5px;flex:none;background:transparent}
.tx .body{flex:1;min-width:0;padding:10px 12px 10px 9px;display:flex;align-items:center;gap:10px}
.tx .d{font-size:11px;color:var(--tx3);font-weight:600;width:44px;flex:none;text-align:center;line-height:1.25}
.tx .t{font-weight:600;font-size:14px}
.tx .m{font-size:11.5px;color:var(--tx3)}
.tx .a{font-weight:800;font-size:14.5px;text-align:right;flex:none}
.tx .a.in{color:var(--inc);font-weight:900;font-size:17px;letter-spacing:-.02em}
.tx .t.in{color:var(--inc);font-weight:800;font-size:15px}
.tx.xfer .body{opacity:.72}
.tx.xfer .d,.tx.xfer .t,.tx.xfer .a,.tx.xfer .m{color:var(--tx3);font-weight:600}
.tx.xfer .t,.tx.xfer .a{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--tx3)}
.tx .cn{font-weight:700}
.tx .badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;
  border-radius:5px;font-size:10.5px;font-weight:800;background:var(--bad);color:#fff;margin-right:5px;vertical-align:1px}
.tx.adj .a{color:var(--bad) !important;font-size:12.5px;font-weight:700}
.tx.fut .body{opacity:.6}
.tx.fut .d,.tx.fut .t,.tx.fut .a,.tx.fut .m{color:var(--tx3) !important;font-weight:600}
.tx.fut .a{font-size:14px}
.tx .instb{font-size:10px;font-weight:800;color:#fff;background:var(--accent);border-radius:5px;padding:1px 5px;margin-right:5px;vertical-align:1px}
.tx .soon{font-size:10px;font-weight:700;color:var(--tx3);border:1px solid var(--line);border-radius:5px;padding:0 4px;margin-right:5px}
.diff{font-size:11.5px;font-weight:700}
.spark{display:inline-flex;align-items:flex-end;gap:2.5px;height:20px;width:32px;flex:none;margin-right:8px}
.spark i{flex:1;border-radius:2px;min-height:2px;display:block}
.ybars{display:flex;align-items:flex-end;gap:3px;height:96px}
.ybar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  gap:4px;background:none;border:0;padding:0}
.ybar i{width:100%;border-radius:3px 3px 0 0;display:block}
.yb2{display:flex;align-items:flex-end;gap:2px;width:100%;height:100%}
.ybar span{font-size:9.5px;font-weight:700;color:var(--tx3)}
.sumrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1.5px solid var(--line);background:var(--panel2)}
.sumrow .v{font-weight:800;font-size:16px}
.tog{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.tog:first-child{border-top:0}
.tog input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
input[type=range]{width:100%;accent-color:var(--accent)}
.daysep{padding:8px 14px 5px;font-size:11.5px;font-weight:700;color:var(--tx3);background:var(--panel2);border-top:1px solid var(--line)}

/* ---------- chips ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:5px;border-radius:999px;
  padding:6px 11px;font-size:12.5px;font-weight:700;
  border:1px solid var(--line);background:var(--panel2);color:var(--tx2);
}
.chip.on{border-color:transparent;color:#fff}
.chipscroll{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.chipscroll .chip{flex:none}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;z-index:100;background:rgba(8,11,16,.5);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center}
.modal{
  width:100%;max-width:720px;max-height:92vh;background:var(--panel);
  border-radius:18px 18px 0 0;display:flex;flex-direction:column;
  box-shadow:0 -8px 40px rgba(0,0,0,.28);animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.modal .mh{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h3{margin:0;font-size:16px;font-weight:800;flex:1}
.modal .mb{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal .mf{padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid var(--line);display:flex;gap:8px}
.modal .mf .btn{flex:1}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--tx3);padding:2px 6px}

/* ---------- auth ---------- */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px}
#auth .box{width:100%;max-width:380px}
#auth .logo{text-align:center;margin-bottom:22px}
#auth .logo .em{font-size:40px}
#auth .logo h1{margin:6px 0 2px;font-size:22px;letter-spacing:-.03em}
#auth .logo p{margin:0;font-size:13px;color:var(--tx3)}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--tx3)}
.seg button.on{background:var(--panel);color:var(--tx);box-shadow:var(--shadow)}
.err{color:var(--bad);font-size:12.5px;font-weight:600;margin:4px 0 8px;min-height:16px}

/* ---------- import preview ---------- */
.prev{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:10px}
.prevrow{display:flex;align-items:center;gap:9px;padding:9px 11px;border-top:1px solid var(--line)}
.prevrow:first-child{border-top:0}
.prevrow.dup{background:var(--bad-soft)}
.prevrow input[type=checkbox]{width:19px;height:19px;flex:none;accent-color:var(--accent)}
.prevrow{align-items:flex-start}
.pin{width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line);
  padding:3px 2px;font-size:13.5px;font-weight:600;color:var(--tx);outline:none;border-radius:0}
.pin:focus{border-bottom-color:var(--accent);background:var(--accent-soft)}
.pin.xs{font-size:11.5px;font-weight:600;color:var(--tx3);width:auto;flex:none;padding:2px}
.pin.amt{width:96px;flex:none;text-align:right;font-weight:800;font-size:14px}
.pflow{font-size:11px;font-weight:800;border:1px solid var(--line);background:var(--panel2);
  color:var(--tx3);border-radius:6px;padding:2px 7px;flex:none}
.pflow.in{background:var(--inc);border-color:var(--inc);color:#fff}
.stat{display:flex;gap:8px;margin-bottom:10px}
.stat>div{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px;text-align:center}
.stat b{display:block;font-size:17px;font-weight:800}
.stat span{font-size:11px;color:var(--tx3);font-weight:600}
.drop{
  border:2px dashed var(--line);border-radius:13px;padding:22px 14px;text-align:center;
  background:var(--panel2);color:var(--tx3);font-size:13px;font-weight:600;
}
.drop.hot{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.spin{width:17px;height:17px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}

/* ---------- category bars ---------- */
.catrow{padding:11px 14px;border-top:1px solid var(--line)}
.catrow:first-child{border-top:0}
.legend{display:flex;height:11px;border-radius:99px;overflow:hidden;background:var(--line);margin-bottom:12px}
.legend i{display:block;height:100%}
.tourwrap{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px)}
.tourbox{width:100%;max-width:440px;display:flex;flex-direction:column;height:100%;max-height:640px}
.tourskip{align-self:flex-end;background:none;border:0;color:var(--tx3);font-size:13px;font-weight:700;padding:6px 4px}
.tourview{flex:1;overflow:hidden;display:flex;align-items:center}
.tourtrack{display:flex;width:100%;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.tourpage{min-width:100%;padding:0 6px;text-align:center}
.tourart{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 10px;margin-bottom:22px;box-shadow:var(--shadow)}
.tourart svg{width:100%;max-width:230px;height:auto}
.tourpage h3{margin:0 0 10px;font-size:19px;letter-spacing:-.03em;line-height:1.35}
.tourpage p{margin:0;font-size:14px;line-height:1.7;color:var(--tx2)}
.tourdots{display:flex;justify-content:center;gap:7px;margin:20px 0 14px}
.tourdots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block;transition:all .2s}
.tourdots i.on{background:var(--accent);width:20px;border-radius:99px}
.tournav{display:flex;gap:8px}
.tournav .btn{padding:13px}
.memotog{background:none;border:1px solid var(--line);color:var(--tx3);border-radius:7px;
  width:26px;height:26px;flex:none;font-size:16px;font-weight:800;line-height:1;padding:0;
  display:grid;place-items:center}
.memotog:active{background:var(--panel2)}
.updbar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 66px);z-index:250;
  margin:0 12px;background:var(--panel);border:1px solid var(--accent);border-radius:12px;
  padding:10px 12px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);
  font-size:13.5px;font-weight:700;max-width:696px;margin-left:auto;margin-right:auto}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 78px);
  background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;
  font-size:13px;font-weight:700;z-index:200;box-shadow:var(--shadow);animation:up .2s ease;
}
</style>
</head>
<body>

<div id="auth">
  <div class="box">
    <div class="logo">
      <div class="em">🧾</div>
      <h1>우리집 가계부</h1>
      <p>카드·은행 내역 캡처만 올리면 자동 기입</p>
    </div>
    <div class="seg">
      <button id="segLogin" class="on">로그인</button>
      <button id="segSignup">회원가입</button>
    </div>
    <div class="card"><div class="bd">
      <div class="field"><label>아이디</label><input id="aId" class="inp" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영문/숫자"></div>
      <div class="field"><label>비밀번호</label><input id="aPw" class="inp" type="password" placeholder="4자 이상"></div>
      <div class="field hidden" id="fPw2"><label>비밀번호 확인</label><input id="aPw2" class="inp" type="password"></div>
      <div class="field hidden" id="fHome"><label>가정 이름</label><input id="aHome" class="inp" placeholder="예: 우리집"></div>
      <div class="field hidden" id="fQ"><label>복구 질문 (비밀번호를 잊었을 때 씁니다)</label>
        <select id="aQ" class="inp">
          <option>처음 키운 반려동물 이름은?</option>
          <option>어릴 때 살던 동네 이름은?</option>
          <option>가장 좋아하는 음식은?</option>
          <option>졸업한 초등학교 이름은?</option>
          <option value="__c">직접 입력</option>
        </select>
        <input id="aQC" class="inp hidden" style="margin-top:6px" placeholder="질문을 직접 적으세요"></div>
      <div class="field hidden" id="fA"><label>질문의 답</label>
        <input id="aA" class="inp" autocapitalize="off" placeholder="띄어쓰기·대소문자는 무시됩니다"></div>
      <div class="err" id="aErr"></div>
      <button id="aGo" class="btn pri wide">로그인</button>
      <div class="row" style="justify-content:center;gap:14px;margin-top:12px">
        <button class="btn sm gho" id="aFindId" style="border:0">아이디 찾기</button>
        <span class="muted tiny">·</span>
        <button class="btn sm gho" id="aFindPw" style="border:0">비밀번호 재설정</button>
      </div>
    </div></div>
    <p class="tiny muted" style="text-align:center;line-height:1.6">
      계정과 모든 기록은 이 기기 안에만 저장됩니다.<br>설정에서 백업 파일을 내려받아 보관하세요.
    </p>
  </div>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <div class="grow">
      <h1 id="tbTitle">이번 달 요약</h1>

<div id="modalHost"></div>
<script>
/* ============================================================
   우리집 가계부 — 단일 파일 웹앱
   저장: localStorage (기기 내부)  /  OCR: claude sample capability
   ============================================================ */
"use strict";

const APP_VERSION = "2026.09.20.1211";   /* 자동 갱신 확인용 — 파일을 새로 올릴 때마다 바뀝니다 */
const KEY = "ledger.v1";
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- storage ---------- */
function loadAll() {
  try { return JSON.parse(localStorage.getItem(KEY) || "") || blank(); }
  catch (e) { return blank(); }
}
function blank() { return { users: {}, data: {}, session: null }; }
function saveAll() {
  try { localStorage.setItem(KEY, JSON.stringify(ROOT)); }
  catch (e) { toast("저장 공간이 부족합니다"); }
}
let ROOT = loadAll();
let ME = null;          // username
let D = null;           // 현재 사용자 데이터

function emptyData(homeName) {
  return {
    home: homeName || "우리집",
    accounts: [],
    txns: [],
    cats: [
      { id: uid(), name: "식비",   color: "#f0a68f" },
      { id: uid(), name: "생활",   color: "#8fcf9a" },
      { id: uid(), name: "교통",   color: "#7fa9e8" },

    settings: { hideXfer: false, tint: 16, instMode: "monthly", hideBal: false, catIncFuture: false, catYear: false },

}
function persist() { if (ME) { ROOT.data[ME] = D; saveAll(); } }

/* ---------- utils ---------- */
const won = n => (n < 0 ? "-" : "") + Math.abs(Math.round(n)).toLocaleString("ko-KR");
const wonS = n => won(n) + "원";
function pad(n) { return String(n).padStart(2, "0"); }
function todayISO() { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function thisMonth() { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1); }
function lastDay(y, m) { return new Date(y, m, 0).getDate(); }       // m = 1~12
function addMonth(ym, k) {
  let [y, m] = ym.split("-").map(Number);
  m += k; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1;
  return y + "-" + pad(m);
}
function fmtDate(iso) { const p = (iso || "").split("-"); return p.length === 3 ? +p[1] + "/" + +p[2] : iso; }
function weekday(iso) {
  const d = new Date(iso + "T00:00:00");
  return isNaN(d) ? "" : "일월화수목금토"[d.getDay()];
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function commaOn(inp) {                 // 금액칸에 천단위 쉼표 자동
  if (!inp) return;
  const f = () => {
    const raw = String(inp.value).replace(/[^\d]/g, "");
    const v = raw ? (+raw).toLocaleString("ko-KR") : "";
    if (inp.value !== v) { inp.value = v; try { inp.setSelectionRange(v.length, v.length); } catch (e) {} }
  };
  inp.addEventListener("input", f);
  f();
}
/* Claude 안에서는 downloads 기능, 일반 웹사이트에서는 브라우저 다운로드 */
async function saveFile(filename, data, mime) {
  try {
    const dl = window.claude && await window.claude.use("downloads");
    if (dl) { await dl.save({ filename, data }); return "ok"; }
  } catch (e) { if (e && e.code === "declined") return "declined"; }
  try {
    const blob = (typeof Blob !== "undefined" && data instanceof Blob)
      ? data : new Blob([data], { type: mime || "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return "ok";
  } catch (e2) {}
  return "fail";
}
/* 만든 파일을 어디로 보낼지 고르게 한다 (공유 시트 / 다운로드 / 복사) */
function offerFile(filename, data, mime, note) {
  const isText = typeof data === "string";
  let canShare = false;
  try {
    const f = new File([data], filename, { type: mime });
    canShare = !!(navigator.canShare && navigator.share && navigator.canShare({ files: [f] }));
  } catch (e) { canShare = false; }

  modal({
    title: "파일 저장",
    body:
      '<div class="card" style="margin:0 0 12px"><div class="bd">' +
        '<div class="b sm ell">' + esc(filename) + '</div>' +
        '<div class="tiny muted" style="margin-top:3px">' + esc(note || "") + '</div>' +
      '</div></div>' +
      (canShare
        ? '<p class="tiny muted" style="margin:0 0 10px;line-height:1.6"><b>공유하기</b>를 누르면 구글 드라이브, 메일, 카카오톡 등으로 바로 보낼 수 있습니다. 드라이브에 올려두면 폰이 바뀌어도 안전합니다.</p>'
        : '<p class="tiny muted" style="margin:0 0 10px;line-height:1.6">파일로 저장하면 <b>파일 앱 → 다운로드</b> 폴더에 들어갑니다.</p>') +
      '<div id="ofMsg" class="sm" style="min-height:18px"></div>',
    foot:
      (canShare ? '<button class="btn pri grow" id="ofShare">📤 공유하기</button>' : '') +
      '<button class="btn grow" id="ofDown">⬇ 파일로 저장</button>' +
      (isText ? '<button class="btn grow" id="ofCopy">📋 복사</button>' : ''),
    onOpen(el, close) {
      const msg = $("#ofMsg", el);
      const sh = $("#ofShare", el);
      if (sh) sh.onclick = async () => {
        try {
          const f = new File([data], filename, { type: mime });
          await navigator.share({ files: [f], title: filename });
          close(); toast("보냈습니다");
        } catch (e) {
          if (e && e.name === "AbortError") return;
          msg.innerHTML = '<span class="c-bad b">공유에 실패했습니다. 파일로 저장을 눌러보세요.</span>';
        }
      };
      $("#ofDown", el).onclick = async () => {
        const r = await saveFile(filename, data, mime);
        if (r === "ok") { close(); toast("저장했습니다 (파일 앱 → 다운로드)"); }
        else if (r === "declined") msg.textContent = "저장을 취소했습니다.";
        else msg.innerHTML = '<span class="c-bad b">이 화면에서는 저장이 막혀 있습니다. 복사를 써주세요.</span>';
      };
      const cp = $("#ofCopy", el);
      if (cp) cp.onclick = async () => {
        try { await navigator.clipboard.writeText(data); toast("복사했습니다"); close(); }
        catch (e) { msg.innerHTML = '<span class="c-bad b">복사가 막혀 있습니다.</span>'; }
      };
    }
  });
}

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
async function sha(txt) {
  const b = new TextEncoder().encode(txt);
  const h = await crypto.subtle.digest("SHA-256", b);
  return Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2, "0")).join("");
}

/* ---------- 카드 정산 기간 계산 ----------
   acc.ds = 시작일(1~31), acc.de = 종료일(1~31 또는 0 = 말일)
   anchor 'YYYY-MM' 기준으로 [시작ISO, 종료ISO] 반환                       */
function periodOf(acc, anchor) {
  const [y, m] = anchor.split("-").map(Number);
  const ds = Math.max(1, Math.min(31, acc.ds || 1));
  const deRaw = acc.de == null ? 0 : acc.de;
  const sD = Math.min(ds, lastDay(y, m));
  const start = y + "-" + pad(m) + "-" + pad(sD);
  let ey = y, em = m;
  if (ds !== 1) { const nx = addMonth(anchor, 1).split("-").map(Number); ey = nx[0]; em = nx[1]; }
  const eD = (deRaw === 0) ? lastDay(ey, em) : Math.min(deRaw, lastDay(ey, em));
  const end = ey + "-" + pad(em) + "-" + pad(eD);
  return [start, end];
}
function periodLabel(acc, anchor) {
  const [s, e] = periodOf(acc, anchor);
  return fmtDate(s) + " ~ " + fmtDate(e);
}
function inPeriod(t, acc, anchor) {
  const [s, e] = periodOf(acc, anchor);
  return t.date >= s && t.date <= e;
}
function txnsIn(list, accId, anchor) {
  const acc = D.accounts.find(a => a.id === accId);
  if (!acc) return [];
  return list.filter(t => t.acc === accId && inPeriod(t, acc, anchor))
    .sort((a, b) => (b.date + (b.time || "")).localeCompare(a.date + (a.time || "")));
}
function txnsOf(accId, anchor) { return txnsIn(SP, accId, anchor); }
const isFut = t => t.date > todayISO();            // 아직 오지 않은 예정 건
const accExcl = id => { const a = D.accounts.find(x => x.id === id); return !!(a && a.excl); };
const counts = t => !t.xfer && !t.adj && !isFut(t) && !accExcl(t.acc); // 합계에 들어가는 건
/* 실적: 승인 총액 기준, 승인한 달에만 잡힌다 (할부 잔여 회차는 실적에 안 들어감) */
function usedOf(accId, anchor) {
  return txnsIn(AL, accId, anchor).filter(counts)
    .reduce((s, t) => s + (t.flow === "in" ? -t.amt : t.amt), 0);
}
/* 실제 이번 기간 지출: 설정에 따라 월 납입액 또는 승인 총액 */
function spendOf(accId, anchor) {
  return txnsIn(SP, accId, anchor).filter(counts)
    .reduce((s, t) => s + (t.flow === "in" ? -t.amt : t.amt), 0);
}
const payOf = (acc, anchor) => (acc.pays || {})[anchor];
const mb = v => D.settings.hideBal ? "••••••" : wonS(v);   // 잔액 가리기
/* 주식: 원금 = seed + 원금 입출금, 손익 = 평가금액 − 원금 */
function stockSeed(a) {
  return (+a.seed || 0) + AL.filter(t => t.acc === a.id && t.adj && t.princ)
    .reduce((s, t) => s + (t.flow === "in" ? t.amt : -t.amt), 0);
}
function stockPL(a) { return (+a.bal || 0) - stockSeed(a); }
function stockLog(a) {
  return AL.filter(t => t.acc === a.id && t.adj)
    .sort((x, y) => (y.date + (y.time || "")).localeCompare(x.date + (x.time || "")));
}
/* 삼색 고양이 — 눈 뜬 얼굴 / 눈 감은 얼굴 */
let CATN_ID = 0;
function catIcon(closed) {
  const id = "ct" + (++CATN_ID);
  const eyes = closed
    ? '<path d="M7.6 13.1 q1.7 -1.9 3.4 0" stroke="#3b3128" stroke-width="1.35" fill="none" stroke-linecap="round"/>' +
      '<path d="M13 13.1 q1.7 -1.9 3.4 0" stroke="#3b3128" stroke-width="1.35" fill="none" stroke-linecap="round"/>'
    : '<circle cx="9.3" cy="13.3" r="1.75" fill="#3b3128"/>' +
      '<circle cx="14.7" cy="13.3" r="1.75" fill="#3b3128"/>' +
      '<circle cx="9.85" cy="12.7" r=".62" fill="#fff"/>' +
      '<circle cx="15.25" cy="12.7" r=".62" fill="#fff"/>';
  return '<svg viewBox="0 0 24 24" width="22" height="22" style="vertical-align:-5px">' +
    '<defs><clipPath id="' + id + '"><circle cx="12" cy="13.4" r="8.3"/></clipPath></defs>' +
    /* 귀 */
    '<path d="M4.6 10.2 C4 6.4 5 4.6 6 4.4 C7.2 4.2 9 5.6 10 7.2 Z" fill="#ef9f4e"/>' +
    '<path d="M6.1 8.6 C5.8 6.8 6.2 6 6.7 5.9 C7.3 5.8 8 6.5 8.5 7.4 Z" fill="#f4b9b0"/>' +
    '<path d="M19.4 10.2 C20 6.4 19 4.6 18 4.4 C16.8 4.2 15 5.6 14 7.2 Z" fill="#4a4139"/>' +
    '<path d="M17.9 8.6 C18.2 6.8 17.8 6 17.3 5.9 C16.7 5.8 16 6.5 15.5 7.4 Z" fill="#f4b9b0"/>' +
    /* 얼굴 */
    '<circle cx="12" cy="13.4" r="8.3" fill="#fff7ec"/>' +
    '<g clip-path="url(#' + id + ')">' +
      '<circle cx="6.6" cy="8.4" r="4.3" fill="#ef9f4e"/>' +

    '</g>' +
    '<circle cx="12" cy="13.4" r="8.3" fill="none" stroke="#e0d2c0" stroke-width=".9"/>' +
    /* 볼 */
    '<circle cx="6.8" cy="15.9" r="1.35" fill="#f2a7ae" opacity=".55"/>' +
    '<circle cx="17.2" cy="15.9" r="1.35" fill="#f2a7ae" opacity=".55"/>' +
    eyes +
    /* 코·입 */
    '<path d="M12 16.1 L10.85 15.1 L13.15 15.1 Z" fill="#ef8f9e"/>' +
    '<path d="M12 16.2 q-1.15 1.5 -2.2 .35 M12 16.2 q1.15 1.5 2.2 .35" stroke="#c9b49c" stroke-width=".85" fill="none" stroke-linecap="round"/>' +
    /* 수염 */
    '<path d="M2.9 12.6 L6 13.1 M2.9 15.1 L6 14.7 M21.1 12.6 L18 13.1 M21.1 15.1 L18 14.7" ' +
      'stroke="#d9c7b2" stroke-width=".8" stroke-linecap="round"/>' +
    '</svg>';
}
function daysLeft() {                                      // 기준 월의 남은 날짜
  const [y, m] = D.anchor.split("-").map(Number);
  const ld = lastDay(y, m), t = todayISO();
  if (D.anchor < t.slice(0, 7)) return 0;
  if (D.anchor > t.slice(0, 7)) return ld;
  return Math.max(1, ld - +t.slice(8, 10) + 1);
}
/* 직불(충전)카드: 시작 잔액 + 충전 - 사용, 예정 건 제외 */
function debitBal(a) {
  return SP.filter(t => t.acc === a.id && !isFut(t))
    .reduce((s, t) => s + (t.flow === "in" ? t.amt : -t.amt), +a.bal || 0);
}
const KINDN = { bank: "은행", card: "카드", debit: "생활비" };
function signWon(n) { return (n > 0 ? "+" : n < 0 ? "-" : "") + won(Math.abs(n)) + "원"; }
/* 은행 기간 집계 — 이체는 따로 뽑는다 */
function bankFlow(accId, anchor) {
  const L = txnsOf(accId, anchor);
  const f = (p) => L.filter(p).reduce((s, t) => s + t.amt, 0);
  const inc = f(t => t.flow === "in" && counts(t));
  const out = f(t => t.flow !== "in" && counts(t));
  const xin = f(t => t.flow === "in" && t.xfer && !isFut(t));
  const xout = f(t => t.flow !== "in" && t.xfer && !isFut(t));
  const adj = f(t => t.flow === "in" && t.adj && !isFut(t)) - f(t => t.flow !== "in" && t.adj && !isFut(t));
  const soon = L.filter(isFut).length;
  return { inc, out, xin, xout, adj, soon, net: inc - out + xin - xout + adj, n: L.length };
}
function lightOf(acc, anchor) {
  const goal = +acc.goal || 0;
  const used = usedOf(acc.id, anchor);
  if (!goal) return { k: "off", used, goal, pct: 0 };
  const pct = used / goal;
  return { k: pct >= 1 ? "ok" : pct >= 0.8 ? "warn" : "bad", used, goal, pct };
}
function rgba(hex, a) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || "");
  return m ? "rgba(" + parseInt(m[1], 16) + "," + parseInt(m[2], 16) + "," + parseInt(m[3], 16) + "," + a + ")" : "";
}
function onColor(hex) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || "");
  if (!m) return "#fff";
  const l = 0.299 * parseInt(m[1], 16) + 0.587 * parseInt(m[2], 16) + 0.114 * parseInt(m[3], 16);
  return l > 168 ? "#22262c" : "#ffffff";
}
const CATC = id => (D.cats.find(c => c.id === id) || {}).color;
const CATN = id => (D.cats.find(c => c.id === id) || {}).name;

/* ---------- 인증 ---------- */
let authMode = "login";
function setAuthMode(m) {
  authMode = m;
  $("#segLogin").classList.toggle("on", m === "login");
  $("#segSignup").classList.toggle("on", m === "signup");
  $("#fPw2").classList.toggle("hidden", m === "login");
  $("#fHome").classList.toggle("hidden", m === "login");
  $("#fQ").classList.toggle("hidden", m === "login");
  $("#fA").classList.toggle("hidden", m === "login");
  $("#aGo").textContent = m === "login" ? "로그인" : "가입하고 시작하기";
  $("#aErr").textContent = "";
}
$("#segLogin").onclick = () => setAuthMode("login");
$("#segSignup").onclick = () => setAuthMode("signup");
$("#aQ").onchange = () => $("#aQC").classList.toggle("hidden", $("#aQ").value !== "__c");
const normA = s => String(s || "").trim().toLowerCase().replace(/\s+/g, "");
const qOf = () => ($("#aQ").value === "__c" ? $("#aQC").value.trim() : $("#aQ").value);

$("#aGo").onclick = async () => {
  const id = $("#aId").value.trim().toLowerCase();
  const pw = $("#aPw").value;
  const err = $("#aErr");
  err.textContent = "";
  if (!id) return err.textContent = "아이디를 입력하세요.";
  if (pw.length < 4) return err.textContent = "비밀번호는 4자 이상이어야 합니다.";

  if (authMode === "signup") {
    if (ROOT.users[id]) return err.textContent = "이미 사용 중인 아이디입니다.";
    if (pw !== $("#aPw2").value) return err.textContent = "비밀번호가 서로 다릅니다.";
    const q = qOf(), ans = $("#aA").value;
    if (!q) return err.textContent = "복구 질문을 입력하세요.";
    if (!normA(ans)) return err.textContent = "복구 질문의 답을 입력하세요.";
    const salt = uid() + uid();
    ROOT.users[id] = { salt, hash: await sha(salt + pw), at: Date.now(), q, qhash: await sha(salt + "Q" + normA(ans)) };
    ROOT.data[id] = emptyData($("#aHome").value.trim() || "우리집");
    ROOT.session = id; saveAll(); enter(id);
  } else {
    const u = ROOT.users[id];
    if (!u) return err.textContent = "없는 아이디입니다.";
    if (await sha(u.salt + pw) !== u.hash) return err.textContent = "비밀번호가 맞지 않습니다.";
    ROOT.session = id; saveAll(); enter(id);
  }
};

function idList() {

  })).sort((a, b) => (a.at || 0) - (b.at || 0));
}

  const L = idList();

  modal({
    title: "비밀번호 재설정",

      '<div class="field"><label>아이디</label><select id="rId" class="inp">' +
        L.map(u => '<option value="' + esc(u.id) + '"' + (u.id === cur ? " selected" : "") + '>' + esc(u.id) + ' (' + esc(u.home) + ')</option>').join("") +
      '</select></div>' +
      '<div id="rWrap"></div>',
    foot: '<button class="btn pri" id="rOk">재설정</button>',
    onOpen(el, close) {
      const wrap = $("#rWrap", el), selId = $("#rId", el);
      const draw = () => {
        const u = ROOT.users[selId.value];
        wrap.innerHTML = u && u.qhash
          ? '<div class="field"><label>복구 질문</label><div class="card" style="margin:0"><div class="bd sm b">' + esc(u.q) + '</div></div></div>' +
            '<div class="field"><label>답</label><input id="rA" class="inp" autocapitalize="off"></div>' +
            '<div class="two"><div class="field"><label>새 비밀번호</label><input id="rP1" class="inp" type="password"></div>' +
            '<div class="field"><label>확인</label><input id="rP2" class="inp" type="password"></div></div>'
          : '<div class="card" style="margin:0"><div class="bd sm" style="line-height:1.7">' +
            '이 계정에는 복구 질문이 없습니다. 비밀번호는 기기 안에서 암호화되어 저장되므로 되돌릴 방법이 없습니다.<br><br>' +
            '<b>백업 파일이 있다면</b> 새 아이디로 가입한 뒤 설정 → 백업 불러오기로 내용을 옮기세요.<br>' +
            '<b class="c-bad">백업이 없다면</b> 아래 버튼으로 이 계정을 지우고 새로 시작하는 수밖에 없습니다.</div></div>' +
            '<button class="btn dan wide" id="rWipe" style="margin-top:10px">이 계정 삭제하고 새로 시작</button>';
        const w = $("#rWipe", wrap);
        if (w) w.onclick = () => {
          const id = selId.value;
          ask("<b>" + esc(id) + "</b> 계정과 그 안의 모든 기록을 지웁니다. 되돌릴 수 없습니다.", () => {
            delete ROOT.users[id]; delete ROOT.data[id];
            if (ROOT.trusted) delete ROOT.trusted[id];
            saveAll(); close(); toast("삭제했습니다");
          }, "삭제", true);
        };
      };
      selId.onchange = draw; draw();
      $("#rOk", el).onclick = async () => {
        const id = selId.value, u = ROOT.users[id];
        if (!u || !u.qhash) return toast("복구 질문이 없는 계정입니다");
        const a = $("#rA", el).value, p1 = $("#rP1", el).value, p2 = $("#rP2", el).value;
        if (await sha(u.salt + "Q" + normA(a)) !== u.qhash) return toast("답이 맞지 않습니다");
        if (p1.length < 4) return toast("비밀번호는 4자 이상");
        if (p1 !== p2) return toast("비밀번호가 서로 다릅니다");
        u.hash = await sha(u.salt + p1);
        saveAll(); close(); $("#aId").value = id; setAuthMode("login");
        toast("비밀번호를 바꿨습니다");
      };
    }
  });
}

function enter(id) {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  ROOT.trusted = ROOT.trusted || {};
  ROOT.trusted[id] = true;
  ME = id;
  D = ROOT.data[id] || emptyData();
  if (!D.anchor) D.anchor = thisMonth();
  if (!Array.isArray(D.cats)) D.cats = emptyData().cats;
  D.settings = Object.assign({ hideXfer: false, tint: 16, instMode: "monthly", hideBal: false, catIncFuture: false, catYear: false }, D.settings || {});
  if (!Array.isArray(D.rules)) D.rules = [];
  persist();
  $("#auth").classList.add("hidden");
  $("#app").classList.remove("hidden");
  go(TAB);
  if (!D.settings.tourDone) setTimeout(() => showTour(false), 250);
}
function toAuth(mode) {
  ROOT.session = null; saveAll(); ME = null; D = null;
  $("#app").classList.add("hidden");
  $("#auth").classList.remove("hidden");
  $("#aPw").value = ""; $("#aPw2").value = ""; $("#aA").value = "";
  setAuthMode(mode || "login");
}
function logout() { ROOT.trusted = {}; toAuth("login"); }   // 전체 잠금

          ROOT.session = id; saveAll(); close(); enter(id);

}

function modal({ title, body, foot, onOpen, wide }) {
  const host = $("#modalHost");
  const mask = document.createElement("div");
  mask.className = "mask";
  mask.innerHTML =
    '<div class="modal">' +
      '<div class="mh"><h3>' + esc(title) + '</h3><button class="x">&times;</button></div>' +
      '<div class="mb"></div>' +
      (foot ? '<div class="mf"></div>' : '') +
    '</div>';
  $(".mb", mask).innerHTML = body;
  if (foot) $(".mf", mask).innerHTML = foot;
  const close = () => mask.remove();
  $(".x", mask).onclick = close;
  mask.addEventListener("click", e => { if (e.target === mask) close(); });
  host.appendChild(mask);
  if (onOpen) onOpen(mask, close);
  return { el: mask, close };
}

/* 브라우저 기본 confirm/prompt은 아티팩트 안에서 막힐 수 있어 자체 창을 쓴다 */

const folded = k => !!(D.settings.fold || {})[k];
function foldBtn(k) {
  return '<button class="memotog" data-fold="' + k + '" style="margin-left:6px">' + (folded(k) ? "+" : "−") + '</button>';
}
function secHd(k, title, sum, addBtn) {
  return '<div class="hd"><h2 class="ell">' + title +
    (folded(k) && sum ? ' <span class="num" style="color:var(--tx3)"> · ' + sum + '</span>' : '') + '</h2>' +
    (folded(k) ? '' : (addBtn || '')) + foldBtn(k) + '</div>';
}
function viewHome() {
  const banks = D.accounts.filter(a => a.kind === "bank" && !a.stock);
  const stocks = D.accounts.filter(a => a.kind === "bank" && a.stock);
  const cards = D.accounts.filter(a => a.kind === "card");
  const debits = D.accounts.filter(a => a.kind === "debit");
  const bankSum = banks.reduce((s, a) => s + (+a.bal || 0), 0);
  const stockSum = stocks.reduce((s, a) => s + (+a.bal || 0), 0);
  const stockPLSum = stocks.reduce((s, a) => s + stockPL(a), 0);
  const cardSum = cards.reduce((s, a) => s + spendOf(a.id, D.anchor), 0);
  const debitSum = debits.filter(a => !a.excl).reduce((s, a) => s + debitBal(a), 0);
  /* 앞으로 남은 예정분 (이번 기준 월 안) */
  const futs = SP.filter(t => isFut(t) && !t.xfer && !t.adj && !accExcl(t.acc) && (t.date || "").slice(0, 7) === D.anchor);
  const futOut = futs.filter(t => t.flow !== "in").reduce((s, t) => s + t.amt, 0);
  const futIn  = futs.filter(t => t.flow === "in").reduce((s, t) => s + t.amt, 0);
  const fixedDue = futs.filter(t => t.flow !== "in" && t.virt).reduce((s, t) => s + t.amt, 0);
  /* 이번 기간 카드값: 결제금액을 넣었으면 그 값, 아니면 지출 합계 */
  const cardDue = cards.reduce((s, a) => { const pv = payOf(a, D.anchor); return s + (pv != null ? pv : spendOf(a.id, D.anchor)); }, 0);
  const forecast = bankSum - cardDue - futOut + futIn;

  let h = "";

  /* 계정별 마지막 기록 날짜 */
  if (D.accounts.length) {
    const T0 = todayISO();
    const last = {};
    D.txns.forEach(t => { if (t.date <= T0 && (!last[t.acc] || t.date > last[t.acc])) last[t.acc] = t.date; });
    const ago = iso => Math.round((dParse(T0) - dParse(iso)) / 86400000);
    const stale = D.accounts.filter(a => !last[a.id] || ago(last[a.id]) >= 7).length;
    const mOpen = D.settings.memoOpen !== false;
    h += '<div class="card" style="border-left:4px solid var(--warn)"><div class="bd" style="padding-bottom:' + (mOpen ? 14 : 11) + 'px">' +
      '<div class="row"' + (mOpen ? ' style="margin-bottom:8px"' : '') + '>' +
        '<span class="tiny b grow" data-memotog style="color:var(--warn)">📝 마지막 기록일자' +
          (!mOpen && stale ? ' <span class="c-warn">· ' + stale + '곳 밀림</span>' : '') + '</span>' +
        (mOpen ? '<span class="tiny muted" data-memo style="padding:2px 6px">눌러서 메모</span>' : '') +
        '<button class="memotog" data-memotog>' + (mOpen ? "−" : "+") + '</button></div>' +
      (!mOpen ? '' :
      D.accounts.map(a => {
        const d = last[a.id];
        const n = d ? ago(d) : null;
        const c = n == null ? "c-bad" : n >= 14 ? "c-bad" : n >= 7 ? "c-warn" : n >= 3 ? "" : "muted";
        return '<div class="row" style="padding:3px 0">' +
          '<span class="dot" style="background:' + esc(a.color) + ';width:8px;height:8px"></span>' +
          '<span class="sm grow ell">' + esc(a.name) + '</span>' +
          '<span class="tiny num ' + c + ' b">' + (d ? fmtDate(d) + ' · ' +
            (n === 0 ? "오늘" : n === 1 ? "어제" : n + "일 전") : "기록 없음") + '</span>' +
        '</div>';
      }).join("") +
      (stale ? '<div class="tiny c-warn b" style="margin-top:7px">' + stale + '곳이 일주일 넘게 비어 있습니다.</div>' : '') +
      (D.memo ? '<div class="sm" data-memo style="white-space:pre-wrap;line-height:1.65;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)">' +
        esc(D.memo) + '</div>' : '')) +
    '</div></div>';
  }

  /* 총괄 */
  h += '<div class="card">' +
    secHd("top", "이번 달 한눈에",
      (D.settings.hideBal ? "잔고 ••••" : "잔고 " + won(bankSum)) + " · 카드 " + won(cardSum)) +
    (folded("top") ? '' : '<div class="bd" style="padding-top:4px">' +
    '<div class="row" style="gap:0">' +
      '<div class="grow"><div class="tiny muted b">은행 잔고 합계 ' +
        '<button data-eye style="background:none;border:0;padding:0 0 0 4px;line-height:1" aria-label="잔액 가리기">' +
        catIcon(!!D.settings.hideBal) + '</button></div>' +
        '<div class="num b" style="font-size:24px;letter-spacing:-.03em">' + mb(bankSum) + '</div></div>' +
      '<div style="text-align:right"><div class="tiny muted b">카드 사용 합계</div>' +
        '<div class="num b c-bad" style="font-size:24px;letter-spacing:-.03em">' + wonS(cardSum) + '</div>' +
        (fixedDue ? '<div class="num muted" style="font-size:12.5px;font-weight:600;margin-top:2px">고정지출 예정 ' + won(fixedDue) + '원</div>' : '') +
      '</div>' +
    '</div>' +
    '<div style="margin-top:12px;padding-top:11px;border-top:1px solid var(--line)">' +
      '<div class="row" style="margin-bottom:8px">' +
        '<div class="grow"><div class="tiny muted b">이번 달 나갈 돈 합계</div>' +
          '<div class="tiny muted num" style="margin-top:2px">카드 ' + won(cardDue) +
            (fixedDue ? ' + 고정지출 ' + won(fixedDue) : '') +
            (futOut - fixedDue > 0 ? ' + 기타 예정 ' + won(futOut - fixedDue) : '') + '</div></div>' +
        '<span class="num b c-bad" style="font-size:19px">' + wonS(cardDue + futOut) + '</span>' +
      '</div>' +
      '<div class="row">' +
        '<div class="grow"><div class="tiny muted b">다 나가고 남는 잔고</div>' +
          '<div class="tiny muted num" style="margin-top:2px">' +
            '잔고 ' + (D.settings.hideBal ? "•••" : won(bankSum)) + ' − 나갈 돈 ' + won(cardDue + futOut) +
            (futIn ? ' + 예정수입 ' + won(futIn) : '') + '</div></div>' +
        '<span class="num b ' + (forecast < 0 ? "c-bad" : "c-inc") + '" style="font-size:19px">' + mb(forecast) + '</span>' +
      '</div>' +
    '</div>' +
    (debits.filter(a => !a.excl).length ? '<div class="row" style="margin-top:12px;padding-top:11px;border-top:1px solid var(--line)">' +
      '<span class="tiny muted b grow">생활비 · 지역화폐 잔액 합계</span>' +
      '<span class="num b" style="font-size:17px">' + mb(debitSum) + '</span></div>' : '') +
    (stocks.length ? '<div class="row" style="margin-top:12px;padding-top:11px;border-top:1px solid var(--line)">' +
      '<div class="grow"><div class="tiny muted b">📈 투자 평가액</div>' +
        '<div class="tiny num ' + (stockPLSum >= 0 ? "c-inc" : "c-bad") + ' b" style="margin-top:2px">누적 손익 ' + signWon(stockPLSum) + '</div></div>' +
      '<span class="num b" style="font-size:17px">' + mb(stockSum) + '</span></div>' : '') +
    '</div>') + '</div>';

  /* 은행 */
  h += '<div class="card">' + secHd("bank", "은행", mb(bankSum),
       '<button class="btn sm" data-add="bank">+ 은행 추가</button>');
  if (folded("bank")) h += '';
  else if (!banks.length) h += '<div class="empty"><b>등록된 은행이 없습니다</b>은행을 추가하고 잔고를 적어두세요.</div>';
  else {
    h += '<div style="margin-top:10px">';
    let tInc = 0, tOut = 0, tNet = 0;
    banks.forEach(a => {
      const F = bankFlow(a.id, D.anchor);
      tInc += F.inc; tOut += F.out; tNet += F.net;
      h += '<div class="acc" data-open="' + a.id + '">' +
        '<div class="ic" style="background:' + esc(a.color) + ';color:' + onColor(a.color) + '">' + esc((a.name || "?").slice(0, 1)) + '</div>' +
        '<div class="grow"><div class="nm ell">' + esc(a.name) + '</div>' +
          '<div class="tiny num"><span class="c-inc b">입금 ' + won(F.inc) + '</span>' +
          '<span class="muted"> · 출금 ' + won(F.out) + '</span>' +
          (F.xin || F.xout ? '<span class="muted"> · 이체 ' + won(F.xin - F.xout) + '</span>' : '') +
          (F.adj ? '<span class="c-bad b"> · 수 ' + signWon(F.adj) + '</span>' : '') +
          (F.soon ? '<span class="muted"> · 예정 ' + F.soon + '건</span>' : '') + '</div></div>' +
        '<div class="rt"><div class="v num">' + mb(+a.bal || 0) + '</div>' +
          '<div class="tiny num ' + (F.net >= 0 ? "c-inc" : "muted") + '">' + (F.net >= 0 ? "+" : "") + won(F.net) + '</div></div>' +
        '<button class="btn sm gho" data-bal="' + a.id + '" style="flex:none;padding:6px 9px;font-weight:800">수</button>' +
      '</div>';
    });
    h += '<div class="sumrow"><div class="grow"><div class="b sm">은행 잔고 합계</div>' +
        '<div class="tiny muted num">기간 입금 ' + won(tInc) + ' · 출금 ' + won(tOut) + ' · 순 ' + (tNet >= 0 ? "+" : "") + won(tNet) + ' · 잔액은 다음 달로 그대로 이어집니다</div></div>' +
        '<div class="v num">' + mb(bankSum) + '</div></div>';
    h += '</div>';
  }
  h += '</div>';

  /* 주식 · 투자 */
  if (stocks.length) {
    h += '<div class="card">' + secHd("stock", "📈 주식 · 투자", mb(stockSum),
         '<button class="btn sm" data-add="bank">+ 추가</button>');
    if (folded("stock")) h += '</div>';
    else {
    h += '<div style="margin-top:10px">';
    stocks.forEach(a => {
      const pl = stockPL(a), seed = stockSeed(a);
      const rate = seed ? (pl / seed * 100) : 0;
      const last = stockLog(a).find(t => !t.princ);
      h += '<div class="acc" data-stock="' + a.id + '">' +
        '<div class="ic" style="background:' + esc(a.color) + ';color:' + onColor(a.color) + '">' + esc((a.name || "?").slice(0, 1)) + '</div>' +
        '<div class="grow"><div class="nm ell">' + esc(a.name) + '</div>' +
          '<div class="tiny num"><span class="muted">원금 ' + won(seed) + '</span>' +
            '<span class="' + (pl >= 0 ? "c-inc" : "c-bad") + ' b"> · ' + signWon(pl) +
            (seed ? ' (' + (rate >= 0 ? "+" : "") + rate.toFixed(1) + '%)' : '') + '</span></div>' +
          (last ? '<div class="tiny muted">최근 ' + last.date + ' ' + (last.flow === "in" ? "+" : "-") + won(last.amt) + ' · 눌러서 변동 내역</div>'
                : '<div class="tiny muted">눌러서 변동 내역 보기</div>') +
        '</div>' +
        '<div class="rt"><div class="v num">' + mb(+a.bal || 0) + '</div>' +
          '<div class="tiny muted">평가금액</div></div>' +
        '<button class="btn sm gho" data-bal="' + a.id + '" style="flex:none;padding:6px 9px;font-weight:800">수</button>' +
      '</div>';
    });
    h += '<div class="sumrow"><div class="grow"><div class="b sm">투자 평가액 합계</div>' +
        '<div class="tiny ' + (stockPLSum >= 0 ? "c-inc" : "c-bad") + ' b num">누적 손익 ' + signWon(stockPLSum) + '</div></div>' +
        '<div class="v num">' + mb(stockSum) + '</div></div>';
    h += '</div></div>';
    }
  }

  /* 직불 · 충전카드 */
  h += '<div class="card">' + secHd("debit", "생활비 · 지역화폐", mb(debitSum),
       '<button class="btn sm" data-add="debit">+ 추가</button>');
  if (folded("debit")) h += '';
  else if (!debits.length) h += '<div class="empty"><b>등록된 것이 없습니다</b>지역화폐·선불카드처럼 충전해서 쓰는 것, 또는 이번 달 생활비 예산을 여기에 넣으세요.</div>';
  else {
    h += '<div style="margin-top:10px">';
    debits.forEach(a => {
      const bal = debitBal(a);
      const L = txnsOf(a.id, D.anchor).filter(t => !isFut(t));
      const ch = L.filter(t => t.flow === "in" && !t.adj).reduce((s, t) => s + t.amt, 0);
      const us = L.filter(t => t.flow !== "in" && !t.adj).reduce((s, t) => s + t.amt, 0);
      const bud = +a.budget || 0;
      const cap = bud || Math.max(1, bal + us);
      const left = bud ? bud - us : bal;
      const pct = Math.max(0, Math.min(100, (bud ? left / bud : bal / cap) * 100));
      const k = bud ? (left < 0 ? "bad" : left / bud < 0.2 ? "warn" : "ok") : null;
      h += '<div class="acc" data-open="' + a.id + '">' +
        '<div class="ic" style="background:' + esc(a.color) + ';color:' + onColor(a.color) + '">' + esc((a.name || "?").slice(0, 1)) + '</div>' +
        '<div class="grow"><div class="nm ell">' + esc(a.name) +
          (bud ? ' <span class="pill tiny" style="padding:1px 7px">예산</span>' : '') +
          (a.excl ? ' <span class="pill tiny muted" style="padding:1px 7px">합계 제외</span>' : '') + '</div>' +
          '<div class="tiny num" style="margin-bottom:4px">' +
            (bud ? '<span class="muted">예산 ' + won(bud) + ' · 사용 ' + won(us) + '</span>'
                 : '<span class="c-inc b">충전 ' + won(ch) + '</span><span class="muted"> · 사용 ' + won(us) + '</span>') + '</div>' +
          '<div class="bar" style="height:5px"><i style="width:' + pct.toFixed(1) + '%;background:' +
            (k ? "var(--" + k + ")" : esc(a.color)) + '"></i></div>' +
          (bud ? '<div class="tiny ' + (left < 0 ? "c-bad b" : "muted") + '" style="margin-top:4px">' +
            (left < 0 ? '예산보다 ' + won(-left) + '원 더 썼습니다'
              : '남은 예산 ' + won(left) + '원' + (daysLeft() > 0 ? ' · 하루 ' + won(Math.floor(left / daysLeft())) + '원' : '')) +
            '</div>' : '') +
        '</div>' +
        '<div class="rt"><div class="v num">' + mb(bud ? left : bal) + '</div>' +
          '<div class="tiny muted">' + (bud ? "남은 예산" : "남은 잔액") + '</div></div>' +
        '<button class="btn sm gho" data-bal="' + a.id + '" style="flex:none;padding:6px 9px;font-weight:800">수</button>' +
      '</div>';
    });
    h += '<div class="sumrow"><div class="grow"><div class="b sm">잔액 합계</div>' +
        '<div class="tiny muted">충전 − 사용으로 자동 차감됩니다</div></div>' +
        '<div class="v num">' + wonS(debitSum) + '</div></div>';
    h += '</div>';
  }
  h += '</div>';

  /* 카드 */
  h += '<div class="card">' + secHd("card", "카드 · 실적", wonS(cardSum),
       '<button class="btn sm" data-add="card">+ 카드 추가</button>');
  if (folded("card")) h += '';
  else if (!cards.length) h += '<div class="empty"><b>등록된 카드가 없습니다</b>카드사 이름과 정산 기간, 실적 목표를 직접 정하세요.</div>';
  else {
    h += '<div style="margin-top:10px">';
    let paySum = 0, payAny = false;
    cards.forEach(a => {
      const L = lightOf(a, D.anchor);
      const sp = spendOf(a.id, D.anchor);
      const cnt = txnsOf(a.id, D.anchor).length;
      const pay = payOf(a, D.anchor);
      if (pay != null) { paySum += pay; payAny = true; }
      h += '<div class="acc" data-open="' + a.id + '">' +
        '<div class="ic" style="background:' + esc(a.color) + ';color:' + onColor(a.color) + '">' + esc((a.name || "?").slice(0, 1)) + '</div>' +
        '<div class="grow"><div class="nm ell">' + esc(a.name) + '</div>' +
          '<div class="tiny num"><span class="muted">' + periodLabel(a, D.anchor) + ' · ' + cnt + '건</span>' +
          (pay != null ? '<span class="b"> · 결제 ' + won(pay) + '</span>' +
            '<span class="' + (pay - sp > 0 ? "c-bad" : "c-ok") + ' b"> (' + signWon(pay - sp) + ')</span>' : '') + '</div></div>' +
        '<div class="rt"><div class="v num">' + wonS(sp) + '</div>' +
          '<div class="tiny muted">' + (L.goal ? "실적 " + Math.round(L.pct * 100) + "%" : "실적 미설정") + '</div></div>' +
        '<button class="btn sm gho" data-pay="' + a.id + '" style="flex:none;padding:6px 8px">💳</button>' +
        '<button class="light bg-' + L.k + '" data-light="' + a.id + '" style="border:0;padding:0" aria-label="실적"></button>' +
      '</div>';
    });
    const goalSum = cards.reduce((s, a) => s + (+a.goal || 0), 0);
    h += '<div class="sumrow"><div class="grow"><div class="b sm">카드 사용 합계</div>' +
        '<div class="tiny muted num">' + ((D.settings.instMode || "monthly") === "monthly"
          ? '할부는 이번 달 납입액만 집계' : '할부 승인 총액으로 집계') +
          (goalSum ? ' · 실적 목표 합계 ' + won(goalSum) + '원' : '') + '</div></div>' +
        '<div class="v num c-bad">' + wonS(cardSum) + '</div></div>';
    if (payAny) h += '<div class="sumrow" style="border-top-width:1px"><div class="grow"><div class="b sm">카드 결제 합계</div>' +
        '<div class="tiny muted">실제 결제된 금액 (입력한 카드만)</div></div>' +
        '<div style="text-align:right"><div class="v num">' + wonS(paySum) + '</div>' +
        '<div class="diff num ' + (paySum - cardSum > 0 ? "c-bad" : "c-ok") + '">차액 ' + signWon(paySum - cardSum) + '</div></div></div>';
    h += '</div>';
  }
  h += '</div>';

  /* 실적 신호등 요약 */
  if (cards.some(a => +a.goal)) {
    h += '<div class="card">' + secHd("light", "실적 신호등", "");
    if (folded("light")) h += '</div>';
    else {
    h += '<div class="bd">';
    cards.filter(a => +a.goal).forEach(a => {
      const L = lightOf(a, D.anchor);
      const rest = Math.max(0, L.goal - L.used);
      h += '<div data-light="' + a.id + '" style="margin-bottom:13px">' +
        '<div class="row" style="margin-bottom:5px">' +
          '<span class="light bg-' + L.k + '"></span>' +
          '<span class="b sm grow ell">' + esc(a.name) + '</span>' +
          '<span class="tiny num ' + (L.k === "ok" ? "c-ok" : L.k === "warn" ? "c-warn" : "c-bad") + ' b">' +
            (rest ? won(rest) + "원 남음" : "달성 ✓") + '</span>' +
        '</div>' +
        '<div class="bar"><i class="bg-' + L.k + '" style="width:' + Math.min(100, L.pct * 100).toFixed(1) + '%"></i></div>' +
        '<div class="tiny muted num" style="margin-top:4px">' + won(L.used) + ' / ' + won(L.goal) + '원</div>' +
      '</div>';
    });
    h += '</div></div>';
    }
  }

  /* 최근 입력 */
  const recent = visibleTx(SP.filter(t => t.date <= todayISO())).sort((a, b) => (b.date + (b.time || "")).localeCompare(a.date + (a.time || ""))).slice(0, 6);
  if (recent.length) {
    h += '<div class="card">' + secHd("recent", "최근 기록", recent.length + "건",
      '<button class="btn sm gho" data-tabgo="list">전체보기</button>') +
      (folded("recent") ? '' : '<div style="margin-top:8px">' + recent.map(txRow).join("") + '</div>') + '</div>';
  }
  return h;
}

/* ============================================================
   거래 행
   ============================================================ */
function txRow(t) {
  const acc = D.accounts.find(a => a.id === t.acc) || {};
  const c = CATC(t.cat);
  const fut = isFut(t);
  const tint = (c && !t.xfer && !t.adj && !fut) ? rgba(c, Math.max(0, Math.min(40, +D.settings.tint || 0)) / 100) : "";
  const isIn = t.flow === "in" && !t.xfer && !t.adj;
  return '<div class="tx' + (t.xfer ? " xfer" : "") + (t.adj ? " adj" : "") + (fut ? " fut" : "") + '" data-tx="' + t.id + '"' +
      (tint ? ' style="background:' + tint + '"' : '') + '>' +
    '<div class="stripe" style="background:' + (t.xfer ? "transparent" : (c || "transparent")) + '"></div>' +
    '<div class="body">' +
      '<div class="d">' + fmtDate(t.date) + '<br><span style="opacity:.7">' + esc(t.time || weekday(t.date)) + '</span></div>' +
      '<div class="grow">' +
        '<div class="t ell' + (isIn ? " in" : "") + '">' +
          (fut ? '<span class="soon">예정</span>' : "") +
          (t.adj ? '<span class="badge">수</span>' : "") +
          (t.inst > 1 ? '<span class="instb">' + (t.instN || 1) + "/" + t.inst + '</span>' : "") +
          (t.virt ? "🔁 " : "") + (t.xfer ? "↔ " : "") + esc(t.desc || "(내용 없음)") + '</div>' +
        '<div class="m ell">' + esc(acc.name || "") +
          (t.cat && !t.xfer && !t.adj ? ' · <span class="cn" style="color:' + c + '">' + esc(CATN(t.cat)) + '</span>' : "") +
          (t.inst > 1 ? ' · ' + (t.instN || 1) + '회납/' + t.inst + '개월할부 · 남은 ' +
            Math.max(0, t.inst - (t.instN || 1)) + '개월' +
            (t.islice ? '' : ' · 월 ' + won(Math.round(t.amt / t.inst))) : "") +
          (t.adj && t.b0 != null ? ' · ' + won(t.b0) + ' → ' + won(t.b1) : "") +
          (t.xfer ? ' · 내 계좌 이동' : "") + (t.memo ? ' · ' + esc(t.memo) : "") + '</div>' +
      '</div>' +
      '<div class="a num ' + (isIn ? "in" : "") + '">' +
        (t.adj ? '(' + (t.flow === "in" ? "+" : "-") + won(t.amt) + '원)' : (isIn ? "+" : "") + won(t.amt)) + '</div>' +
    '</div></div>';
}
function visibleTx(list) { return D.settings.hideXfer ? list.filter(t => !t.xfer) : list; }

/* ============================================================
   전체 내역
   ============================================================ */
let LF = { acc: "all", cat: "all", q: "" };
function viewList() {
  let h = '<div class="chipscroll">' +
    '<button class="chip ' + (LF.acc === "all" ? "on" : "") + '" data-fa="all" style="' + (LF.acc === "all" ? "background:var(--accent)" : "") + '">전체</button>' +
    D.accounts.map(a => '<button class="chip ' + (LF.acc === a.id ? "on" : "") + '" data-fa="' + a.id + '" style="' +
      (LF.acc === a.id ? "background:" + esc(a.color) + ";color:" + onColor(a.color) : "") + '"><span class="dot" style="background:' + esc(a.color) + '"></span>' + esc(a.name) + '</button>').join("") +
    '</div>';

  h += '<div class="chipscroll">' +
    '<button class="chip ' + (LF.cat === "all" ? "on" : "") + '" data-fc="all" style="' + (LF.cat === "all" ? "background:var(--accent)" : "") + '">분류 전체</button>' +
    '<button class="chip ' + (LF.cat === "none" ? "on" : "") + '" data-fc="none" style="' + (LF.cat === "none" ? "background:var(--tx3)" : "") + '">미분류</button>' +
    D.cats.map(c => '<button class="chip ' + (LF.cat === c.id ? "on" : "") + '" data-fc="' + c.id + '" style="' +
      (LF.cat === c.id ? "background:" + esc(c.color) + ";color:" + onColor(c.color) : "") + '"><span class="dot" style="background:' + esc(c.color) + '"></span>' + esc(c.name) + '</button>').join("") +
    '</div>';

  h += '<div class="card"><div class="bd" style="padding-bottom:10px">' +
    '<input id="q" class="inp" placeholder="내용 · 메모 검색" value="' + esc(LF.q) + '">' +
    '<div class="row" style="margin-top:9px;gap:8px">' +
      '<button class="btn pri grow" data-paste>📋 붙여넣기</button>' +
      (canVoice() ? '<button class="btn grow" data-voice>🎤 음성</button>' : '') +
      (canPhoto() ? '<button class="btn grow" data-import>📷 캡처</button>' : '') +
      '<button class="btn grow" data-new2>+ 입력</button>' +
    '</div>' +
    '<div class="row" style="margin-top:6px;gap:8px">' +
      '<button class="btn gho grow sm" data-new>📄 엑셀 · CSV 파일 불러오기</button>' +
    '</div></div></div>';

  let list = SP.slice();
  if (LF.acc !== "all") list = list.filter(t => t.acc === LF.acc);
  if (LF.cat === "none") list = list.filter(t => !t.cat);
  else if (LF.cat !== "all") list = list.filter(t => t.cat === LF.cat);
  if (LF.q) { const q = LF.q.toLowerCase(); list = list.filter(t => ((t.desc || "") + (t.memo || "")).toLowerCase().includes(q)); }

  /* 기준월 기간: 선택한 계좌가 있으면 그 계좌 기간, 없으면 달력 월 */
  if (LF.acc !== "all") {
    const acc = D.accounts.find(a => a.id === LF.acc);
    if (acc) list = list.filter(t => inPeriod(t, acc, D.anchor));
  } else {
    list = list.filter(t => (t.date || "").slice(0, 7) === D.anchor);
  }
  const xferN = list.filter(t => t.xfer).length;
  list = visibleTx(list);
  list.sort((a, b) => (b.date + (b.time || "")).localeCompare(a.date + (a.time || "")));

  const out = list.filter(t => t.flow !== "in" && counts(t)).reduce((s, t) => s + t.amt, 0);
  const inc = list.filter(t => t.flow === "in" && counts(t)).reduce((s, t) => s + t.amt, 0);
  const futN = list.filter(isFut).length, adjN = list.filter(t => t.adj).length;
  h += '<div class="stat">' +
    '<div><b class="num">' + list.length + '</b><span>건</span></div>' +
    '<div><b class="num c-bad">' + won(out) + '</b><span>지출</span></div>' +
    '<div><b class="num c-inc">' + won(inc) + '</b><span>수입</span></div>' +
  '</div>' +
  ((xferN || futN || adjN) ? '<p class="tiny muted" style="margin:-4px 0 10px">합계 제외: ' +
     [xferN ? '내 계좌 이동 ' + xferN + '건' + (D.settings.hideXfer ? '(숨김)' : '') : '',
      futN ? '예정 ' + futN + '건' : '', adjN ? '잔액 수정 ' + adjN + '건' : '']
     .filter(Boolean).join(' · ') + '</p>' : '');

  if (!list.length) {
    h += '<div class="card"><div class="empty"><b>내역이 없습니다</b>캡처를 올리거나 직접 입력해 보세요.</div></div>';
    return h;
  }
  h += '<div class="card">';
  let day = "";
  list.forEach(t => {
    if (t.date !== day) {
      day = t.date;
      h += '<div class="daysep">' + esc(day) + ' (' + weekday(day) + ')</div>';
    }
    h += txRow(t);
  });
  h += '<div class="sumrow"><div class="grow b sm">합계 <span class="tiny muted">자동 계산</span></div>' +
       '<div style="text-align:right"><div class="v num c-bad">-' + won(out) + '</div>' +
       (inc ? '<div class="tiny num c-inc b">+' + won(inc) + '</div>' : '') + '</div></div>';
  h += '</div>';
  return h;
}

/* ============================================================
   분류별
   ============================================================ */
function viewCat() {
  const incF = !!D.settings.catIncFuture;
  const yearMode = !!D.settings.catYear;
  const okT = t => incF ? (!t.xfer && !t.adj) : counts(t);
  const Y = +D.anchor.slice(0, 4);

  function sumsFor(ym) {
    const by = {}; let total = 0, inc = 0;
    SP.forEach(t => {
      if (!okT(t)) return;
      const acc = D.accounts.find(a => a.id === t.acc);
      const ok = acc ? inPeriod(t, acc, ym) : (t.date || "").slice(0, 7) === ym;
      if (!ok) return;
      if (t.flow === "in") { inc += t.amt; return; }
      const k = t.cat || "_none";
      by[k] = (by[k] || 0) + t.amt; total += t.amt;
    });
    return { by, total, inc };
  }
  function sumsYear(y) {
    const by = {}, months = new Array(12).fill(0), imonths = new Array(12).fill(0);
    let total = 0, inc = 0;
    SP.forEach(t => {
      if (!okT(t)) return;
      if ((t.date || "").slice(0, 4) !== String(y)) return;
      const mi = +t.date.slice(5, 7) - 1;
      if (t.flow === "in") { inc += t.amt; imonths[mi] += t.amt; return; }
      const k = t.cat || "_none";
      by[k] = (by[k] || 0) + t.amt; total += t.amt;
      months[mi] += t.amt;
    });
    return { by, total, inc, months, imonths };
  }

  const arrow = (now, prev) => {
    if (!prev) return now ? '<span class="c-bad b">신규</span>' : '<span class="muted">—</span>';
    const p = (now - prev) / prev * 100;
    if (Math.abs(p) < 0.5) return '<span class="muted">변화 없음</span>';
    return '<span class="' + (p > 0 ? "c-bad" : "c-ok") + ' b">' + (p > 0 ? "▲" : "▼") + Math.abs(p).toFixed(0) + "%</span>";
  };

  const LB = yearMode ? [Y - 2, Y - 1, Y].map(String) : [addMonth(D.anchor, -2), addMonth(D.anchor, -1), D.anchor];
  const S = yearMode ? LB.map(y => sumsYear(+y)) : LB.map(sumsFor);
  const cur = S[2], total = cur.total;

  /* ---------- 보기 전환 ---------- */
  let h = '<div class="seg" style="margin-bottom:12px">' +
    '<button data-cmode="month" class="' + (yearMode ? "" : "on") + '">월별로 보기</button>' +
    '<button data-cmode="year" class="' + (yearMode ? "on" : "") + '">연도별로 보기</button>' +
  '</div>';

  /* ---------- 추이 ---------- */
  const anyInc = S.some(s => s.inc > 0);
  const mx = Math.max(1, ...S.map(s => Math.max(s.total, s.inc)));
  h += '<div class="card"><div class="hd"><h2>' + (yearMode ? "최근 3년" : "최근 3개월") +
       (anyInc ? " 수입 · 지출 추이" : " 지출 추이") + '</h2>' +
       (anyInc ? '<span class="tiny b"><span class="c-inc">■</span> 수입 <span class="c-bad">■</span> 지출</span>' : '') + '</div><div class="bd">';
  S.forEach((s, i) => {
    h += '<div style="margin-bottom:' + (i === 2 ? 2 : 13) + 'px">' +
      '<div class="row" style="margin-bottom:5px">' +
        '<span class="sm b grow' + (i === 2 ? "" : " muted") + '">' + (yearMode ? LB[i] + "년" : LB[i].replace("-", ". ")) +
          (i === 2 ? " (기준)" : "") + '</span>' +
        (anyInc ? '<span class="num b sm c-inc" style="margin-right:8px">+' + won(s.inc) + '</span>' : '') +
        '<span class="num b sm c-bad">-' + won(s.total) + '</span>' +
        '<span class="tiny" style="width:58px;text-align:right">' + (i ? arrow(s.total, S[i - 1].total) : "") + '</span>' +
      '</div>' +
      (anyInc ? '<div class="bar" style="height:' + (i === 2 ? 10 : 7) + 'px;margin-bottom:3px">' +
        '<i style="width:' + (s.inc / mx * 100).toFixed(1) + '%;background:var(--inc)"></i></div>' : '') +
      '<div class="bar" style="height:' + (i === 2 ? 10 : 7) + 'px"><i style="width:' + (s.total / mx * 100).toFixed(1) + '%;background:var(--bad)"></i></div>' +
      (anyInc ? '<div class="tiny ' + (s.inc - s.total >= 0 ? "c-inc" : "c-bad") + ' b num" style="margin-top:4px">순 ' +
        (s.inc - s.total >= 0 ? "+" : "") + won(s.inc - s.total) + '원</div>' : '') +
    '</div>';
  });
  const d21 = cur.total - S[1].total;
  h += '<p class="tiny muted" style="margin:12px 0 0;line-height:1.6">' + (yearMode ? "전년" : "전월") + ' 대비 지출 ' +
       (d21 === 0 ? "변화 없음" : (d21 > 0 ? won(d21) + "원 늘었습니다" : won(-d21) + "원 줄었습니다")) +
       ' · ' + (yearMode ? "3년" : "3개월") + ' 평균 ' + won(Math.round((S[0].total + S[1].total + S[2].total) / 3)) + '원' +
       (anyInc ? ' · 평균 수입 ' + won(Math.round((S[0].inc + S[1].inc + S[2].inc) / 3)) + '원' : '') + '</p>';
  h += '</div></div>';

  /* ---------- 연도별: 12개월 흐름 ---------- */
  if (yearMode) {
    const mm = cur.months, im = cur.imonths || new Array(12).fill(0);
    const mxm = Math.max(1, ...mm, ...im);
    const used = mm.filter(v => v > 0).length;
    const hasInc = im.some(v => v > 0);
    h += '<div class="card"><div class="hd"><h2>' + Y + '년 월별 흐름</h2>' +
      (hasInc ? '<span class="tiny b"><span class="c-inc">■</span> 수입 <span class="c-bad">■</span> 지출</span>' : '') + '</div><div class="bd">' +
      '<div class="ybars">' + mm.map((v, i) =>
        '<button class="ybar" data-ym="' + Y + "-" + pad(i + 1) + '">' +
          '<div class="yb2">' +
            (hasInc ? '<i style="height:' + (im[i] ? Math.max(3, im[i] / mxm * 100) : 1) + '%;background:var(--inc)"></i>' : '') +
            '<i style="height:' + (v ? Math.max(3, v / mxm * 100) : 1) + '%;background:' + (v ? "var(--bad)" : "var(--line)") + '"></i>' +
          '</div><span>' + (i + 1) + '</span>' +
        '</button>').join("") + '</div>' +
      '<div class="tiny muted" style="margin-top:10px;line-height:1.6">막대를 누르면 그 달로 넘어갑니다. ' +
        (used ? '가장 많이 쓴 달은 ' + (mm.indexOf(Math.max(...mm)) + 1) + '월 ' + won(Math.max(...mm)) + '원, 기록이 있는 달 기준 월평균 ' +
          won(Math.round(cur.total / used)) + '원입니다.' : '아직 기록이 없습니다.') +
        (hasInc ? ' 수입이 가장 많았던 달은 ' + (im.indexOf(Math.max(...im)) + 1) + '월 ' + won(Math.max(...im)) + '원입니다.' : '') + '</div>' +
    '</div></div>';
  }

  /* ---------- 구성 ---------- */
  const futE = SP.filter(t => isFut(t) && t.flow !== "in" && !t.xfer && !t.adj).filter(t => {
    if (yearMode) return (t.date || "").slice(0, 4) === String(Y);
    const acc = D.accounts.find(a => a.id === t.acc);
    return acc ? inPeriod(t, acc, D.anchor) : (t.date || "").slice(0, 7) === D.anchor;
  });
  const futSum = futE.reduce((s, t) => s + t.amt, 0);
  const futFix = futE.filter(t => t.virt).reduce((s, t) => s + t.amt, 0);

  const rows = D.cats.map(c => ({ id: c.id, name: c.name, color: c.color, v: cur.by[c.id] || 0 }))
    .concat(cur.by._none ? [{ id: "_none", name: "미분류", color: "#9fb0c2", v: cur.by._none }] : [])
    .filter(r => r.v > 0).sort((a, b) => b.v - a.v);

  h += '<div class="card"><div class="bd">' +
    '<div class="tiny muted b">' + (yearMode ? Y + "년 지출 합계" : "이 기간 지출 합계") + '</div>' +
    '<div class="num b" style="font-size:26px;letter-spacing:-.03em">' + wonS(total) + '</div>' +
    (cur.inc ? '<div class="row" style="margin:6px 0 2px">' +
      '<span class="tiny muted b grow">수입 합계</span>' +
      '<span class="num b c-inc">+' + won(cur.inc) + '원</span></div>' +
      '<div class="row" style="margin-bottom:6px">' +
      '<span class="tiny muted b grow">남은 돈 (수입 − 지출)</span>' +
      '<span class="num b ' + (cur.inc - total >= 0 ? "c-inc" : "c-bad") + '">' +
        (cur.inc - total >= 0 ? "+" : "") + won(cur.inc - total) + '원</span></div>' : '') +
    '<div class="tiny ' + (incF ? "c-bad b" : "muted") + '" style="margin:3px 0 10px;line-height:1.5">' +
      (incF
        ? "아직 안 지난 예정 지출 " + won(futSum) + "원이 포함된 금액입니다"
        : (futSum ? "이미 쓴 돈만 더한 금액입니다. 예정된 지출 " + won(futSum) + "원" +
            (futFix ? " (고정지출 " + won(futFix) + "원 포함)" : "") + "은 빠져 있습니다."
          : "이미 쓴 돈만 더한 금액입니다. 아직 남은 예정 지출은 없습니다.")) +
    '</div>' +
    (futSum || incF ? '<label class="tog" style="border:0;padding:0 0 10px">' +
      '<input type="checkbox" id="catFut"' + (incF ? " checked" : "") + '>' +
      '<span class="grow sm b">예정된 지출도 합계에 넣기</span></label>' : '');
  if (total) h += '<div class="legend">' + rows.map(r => '<i style="background:' + r.color + ';width:' + (r.v / total * 100) + '%"></i>').join("") + '</div>';
  h += '</div></div>';

  if (!rows.length) {
    h += '<div class="card"><div class="empty"><b>분류된 지출이 없습니다</b>내역에서 항목을 눌러 색상 분류를 지정하세요.</div></div>';
  } else {
    h += '<div class="card">';
    rows.forEach(r => {
      const v3 = [0, 1, 2].map(i => S[i].by[r.id] || 0);
      const m3 = Math.max(1, ...v3);
      h += '<div class="catrow" data-fcat="' + r.id + '">' +
        '<div class="row" style="margin-bottom:6px">' +
          '<span class="dot" style="background:' + r.color + ';width:11px;height:11px"></span>' +
          '<span class="b sm grow ell">' + esc(r.name) + '</span>' +
          '<span class="spark">' + v3.map((v, i) => '<i style="height:' + Math.max(6, v / m3 * 100) + '%;background:' +
            (i === 2 ? r.color : rgba(r.color, .35) || "var(--line)") + '"></i>').join("") + '</span>' +
          '<span class="num b">' + wonS(r.v) + '</span>' +
        '</div>' +
        '<div class="bar"><i style="background:' + r.color + ';width:' + (r.v / total * 100).toFixed(1) + '%"></i></div>' +
        '<div class="row tiny" style="margin-top:4px">' +
          '<span class="muted grow ell">' + (r.v / total * 100).toFixed(1) + '% · ' +
            (yearMode ? "월평균 " + won(Math.round(r.v / 12)) + " · 3년 " : "3개월 ") + v3.map(won).join(" / ") + '</span>' +
          arrow(v3[2], v3[1]) +
        '</div>' +
      '</div>';
    });
    h += '</div>';
  }

  h += '<div class="card"><div class="hd"><h2>분류 설정</h2><button class="btn sm" data-newcat>+ 분류 추가</button></div><div class="bd">' +
    (D.cats.length ? D.cats.map(c =>
      '<div class="row" style="padding:7px 0;border-top:1px solid var(--line)">' +
        '<span class="dot" style="background:' + esc(c.color) + ';width:15px;height:15px"></span>' +
        '<span class="grow b sm">' + esc(c.name) + '</span>' +
        '<button class="btn sm gho" data-editcat="' + c.id + '">수정</button>' +
      '</div>').join("") : '<p class="tiny muted">분류가 없습니다.</p>') +
  '</div></div>';
  return h;
}

  '</div></div>';
  return h;
}

/* ============================================================

/* ============================================================
   반복 일정 엔진
   rule = { id, acc, desc, memo, amt, flow, xfer, cat, time,
            start:'YYYY-MM-DD', freq:'day|week|month|year', gap:N,
            dows:[0..6], mmode:'date|nth', mday:N, nth:1..5|-1, ndow:0..6,
            ymon:1..12, end:{type:'none|count|date', count, date},
            until:'YYYY-MM-DD'|null,   // 이후 일정 잘라내기
            ex:['YYYY-MM-DD'],         // 이 일정만 삭제
            ov:{ 'YYYY-MM-DD': {…필드} } }
   ============================================================ */
function dParse(iso) { const p = String(iso).split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function dISO(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function addDays(iso, n) { const d = dParse(iso); d.setDate(d.getDate() + n); return dISO(d); }
function nthDowISO(y, m, nth, dow) {
  if (nth === -1) {
    const ld = lastDay(y, m), d = new Date(y, m - 1, ld);
    return dISO(new Date(y, m - 1, ld - ((d.getDay() - dow + 7) % 7)));
  }
  const first = new Date(y, m - 1, 1);
  const day = 1 + ((dow - first.getDay() + 7) % 7) + (nth - 1) * 7;
  return day > lastDay(y, m) ? null : y + "-" + pad(m) + "-" + pad(day);
}
const DOWN = ["일", "월", "화", "수", "목", "금", "토"];

function occDates(r, from, to) {
  let lim = to;
  if (r.until && r.until < lim) lim = r.until;
  if (r.end && r.end.type === "date" && r.end.date && r.end.date < lim) lim = r.end.date;
  const maxN = (r.end && r.end.type === "count") ? Math.max(1, +r.end.count || 1) : Infinity;
  const gap = Math.max(1, +r.gap || 1);
  const out = []; let n = 0, guard = 0;

  const push = iso => {
    if (!iso || iso < r.start) return true;
    if (iso > lim) return false;
    n++; if (n > maxN) return false;
    if (iso >= from) out.push(iso);
    return true;
  };

  if (r.freq === "day") {
    let cur = r.start;
    while (guard++ < 4000) { if (!push(cur)) break; cur = addDays(cur, gap); }
  } else if (r.freq === "week") {
    const dows = (r.dows && r.dows.length ? r.dows : [dParse(r.start).getDay()]).slice().sort();
    let wk = addDays(r.start, -dParse(r.start).getDay());   // 시작 주 일요일
    outer: while (guard++ < 2000) {
      let any = false;
      for (const d of dows) {
        const iso = addDays(wk, d);
        if (iso < r.start) { any = true; continue; }
        if (!push(iso)) break outer;
        any = true;
      }
      if (!any) break;
      if (addDays(wk, 6) > lim && addDays(wk, 6) > r.start) { /* 계속 진행하여 종료 판단 */ }
      wk = addDays(wk, 7 * gap);
      if (wk > lim) break;
    }
  } else if (r.freq === "month" || r.freq === "year") {
    const step = r.freq === "year" ? 12 * gap : gap;
    let ym = r.start.slice(0, 7);
    if (r.freq === "year" && r.ymon) ym = r.start.slice(0, 4) + "-" + pad(r.ymon);
    while (guard++ < 1200) {
      const [y, m] = ym.split("-").map(Number);
      let iso;
      if (r.mmode === "nth") iso = nthDowISO(y, m, +r.nth || 1, +r.ndow || 0);
      else iso = y + "-" + pad(m) + "-" + pad(Math.min(Math.max(1, +r.mday || dParse(r.start).getDate()), lastDay(y, m)));
      if (iso && iso > lim && iso >= r.start) break;
      if (iso && !push(iso)) break;
      ym = addMonth(ym, step);
      if (ym + "-01" > lim && ym + "-01" > r.start) break;
    }
  }
  return out;
}

function ruleTxns(r, from, to) {
  const ex = new Set(r.ex || []);
  const out = [];
  occDates(r, from, to).forEach(date => {
    if (ex.has(date)) return;
    const o = (r.ov || {})[date] || {};
    out.push({
      id: "r:" + r.id + ":" + date, rid: r.id, occ: date, virt: true,
      date: o.date || date, time: o.time != null ? o.time : (r.time || ""),
      desc: o.desc != null ? o.desc : r.desc,
      memo: o.memo != null ? o.memo : (r.memo || ""),
      amt: o.amt != null ? o.amt : r.amt,
      flow: o.flow || r.flow, xfer: o.xfer != null ? o.xfer : !!r.xfer,
      cat: o.cat != null ? o.cat : (r.cat || ""),
      acc: o.acc || r.acc
    });
  });
  return out;
}

/* 할부를 회차별로 쪼갠다 — 월 납입액 기준 집계용 */
function instSlices(t, from, to) {
  const n = Math.max(1, +t.inst || 1);
  if (n <= 1) return [t];
  const base = Math.floor(t.amt / n);
  const ym0 = t.date.slice(0, 7), dd = +t.date.slice(8, 10);
  const out = [];
  for (let k = 0; k < n; k++) {
    const [y, m] = addMonth(ym0, k).split("-").map(Number);
    const date = y + "-" + pad(m) + "-" + pad(Math.min(dd, lastDay(y, m)));
    if (date < from || date > to) continue;
    out.push(Object.assign({}, t, {
      id: "i:" + t.id + ":" + k, date,
      amt: k === n - 1 ? t.amt - base * (n - 1) : base,
      instN: k + 1, islice: true
    }));
  }
  return out;
}

let VTX = [], AL = [], SP = [];
function expandWindow() {
  if (D.settings && D.settings.catYear) {          // 연도별 보기: 3년치
    const y = +D.anchor.slice(0, 4);
    return [(y - 2) + "-01-01", (y + 1) + "-12-31"];
  }
  const a = addMonth(D.anchor, -2) + "-01";
  const [y, m] = addMonth(D.anchor, 3).split("-").map(Number);
  return [a, y + "-" + pad(m) + "-" + pad(lastDay(y, m))];
}
function rebuildV() {
  const [f, t] = expandWindow();
  VTX = [];
  (D.rules || []).forEach(r => { try { VTX = VTX.concat(ruleTxns(r, f, t)); } catch (e) {} });
  AL = D.txns.concat(VTX);
  if ((D.settings.instMode || "monthly") === "monthly") {
    SP = [];
    AL.forEach(x => { SP = SP.concat((+x.inst || 1) > 1 ? instSlices(x, f, t) : [x]); });
  } else SP = AL.slice();
}
function ALL() { return AL; }
const RULE = id => (D.rules || []).find(r => r.id === id);

function ruleLabel(r) {
  const g = Math.max(1, +r.gap || 1);
  if (r.freq === "day") return g === 1 ? "매일" : g + "일마다";
  if (r.freq === "week") {
    const d = (r.dows || []).slice().sort().map(x => DOWN[x]).join("·");
    return (g === 1 ? "매주 " : g + "주마다 ") + (d || DOWN[dParse(r.start).getDay()]) + "요일";
  }
  const core = r.mmode === "nth"
    ? (r.nth === -1 ? "마지막" : r.nth + "째") + " 주 " + DOWN[+r.ndow || 0] + "요일"
    : (r.mday || dParse(r.start).getDate()) + "일";
  if (r.freq === "year") return (g === 1 ? "매년 " : g + "년마다 ") + (r.ymon || +r.start.slice(5, 7)) + "월 " + core;
  return (g === 1 ? "매월 " : g + "개월마다 ") + core;
}
function ruleEndLabel(r) {
  const e = r.end || { type: "none" };
  const cut = r.until ? " · " + r.until + "까지(수정됨)" : "";
  if (e.type === "count") return e.count + "회 반복" + cut;
  if (e.type === "date") return e.date + "까지" + cut;
  return "종료 없음" + cut;
}
