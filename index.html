/* ============================================================
   거래 편집 (반복 설정 포함)
   txId: null | 실제거래id | "r:<ruleId>:<날짜>" | "R:<ruleId>"
   ============================================================ */
function splitRule(r, fromDate, patch) {
  if (fromDate <= r.start) { Object.assign(r, patch); return r; }
  const nr = JSON.parse(JSON.stringify(r));
  nr.id = uid(); nr.until = null;
  nr.ex = (r.ex || []).filter(d => d >= fromDate);
  nr.ov = {}; Object.keys(r.ov || {}).forEach(d => { if (d >= fromDate) nr.ov[d] = r.ov[d]; });
  r.until = addDays(fromDate, -1);
  r.ex = (r.ex || []).filter(d => d < fromDate);
  const ov = {}; Object.keys(r.ov || {}).forEach(d => { if (d < fromDate) ov[d] = r.ov[d]; });
  r.ov = ov;
  Object.assign(nr, patch);
  nr.start = fromDate;
  D.rules.push(nr);
  return nr;
}

function editTxn(txId, presetAcc, forceRep, preset) {
  if (txId && txId.indexOf("i:") === 0) txId = txId.split(":")[1];   // 할부 회차 → 원본 건
  if (!D.accounts.length) { toast("먼저 은행이나 카드를 추가하세요"); return editAccount("card"); }
  let mode = "new", t = null, r = null, occ = null;
  if (txId && txId.indexOf("R:") === 0) { mode = "rule"; r = RULE(txId.slice(2)); if (!r) return; }
  else if (txId && txId.indexOf("r:") === 0) {
    const p = txId.split(":"); r = RULE(p[1]); occ = p[2];
    if (!r) return; mode = "occ";
    t = ruleTxns(r, occ, occ).find(x => x.occ === occ) || null;
    if (!t) return;
  } else if (txId) { mode = "txn"; t = D.txns.find(x => x.id === txId); if (!t) return; }

  const base = mode === "rule"
    ? { date: r.start, time: r.time || "", desc: r.desc, memo: r.memo || "", amt: r.amt, flow: r.flow, acc: r.acc, cat: r.cat || "", xfer: !!r.xfer }
    : (t || Object.assign({ date: todayISO(), time: "", desc: "", memo: "", amt: "", flow: "out",
        acc: presetAcc || (D.accounts[0] || {}).id, cat: "", xfer: false, inst: 1, instN: 1 }, preset || {}));
  const rep0 = (mode === "rule" || mode === "occ") ? r
    : { freq: "month", gap: 1, dows: [dParse(base.date).getDay()], mmode: "date", mday: dParse(base.date).getDate(), nth: 1, ndow: dParse(base.date).getDay(), ymon: +base.date.slice(5, 7), end: { type: "none", count: 12, date: "" } };
  const repOn0 = (mode === "rule" || mode === "occ" || !!forceRep);

  const sel = (id, opts, cur, extra) => '<select id="' + id + '" class="inp"' + (extra || "") + '>' +
    opts.map(o => '<option value="' + o[0] + '"' + (String(cur) === String(o[0]) ? " selected" : "") + '>' + o[1] + '</option>').join("") + '</select>';

  const body =
    (mode === "occ" ? '<div class="pill" style="margin-bottom:10px;background:var(--accent-soft);border-color:transparent">🔁 반복 일정 중 ' + occ + '</div>' : '') +
    (mode === "rule" ? '<div class="pill" style="margin-bottom:10px;background:var(--accent-soft);border-color:transparent">🔁 반복 규칙 전체 수정</div>' : '') +
    '<div class="two">' +
      '<div class="field"><label>' + (mode === "rule" ? "시작 날짜" : "날짜") + '</label><input id="tDate" class="inp" type="date" value="' + esc(base.date) + '"></div>' +
      '<div class="field"><label>시간</label><input id="tTime" class="inp" type="time" value="' + esc(base.time || "") + '"></div>' +
    '</div>' +
    '<div class="field"><label>이용 내역</label><input id="tDesc" class="inp" value="' + esc(base.desc) + '" placeholder="가맹점 / 적요 / 월급 등"></div>' +
    '<div class="two">' +
      '<div class="field"><label>금액</label><input id="tAmt" class="inp" inputmode="numeric" value="' + (base.amt || "") + '"></div>' +
      '<div class="field"><label>구분</label>' + sel("tFlow", [["out", "지출 / 출금"], ["in", "입금 / 수입"]], base.flow === "in" ? "in" : "out") + '</div>' +
    '</div>' +
    '<div class="field"><label>은행 · 카드</label>' +
      sel("tAcc", D.accounts.map(a => [a.id, a.name + " (" + (KINDN[a.kind] || "카드") + ")"]), base.acc) + '</div>' +
    '<label class="tog" style="margin-bottom:8px;border:0"><input type="checkbox" id="tInstOn"' + ((base.inst || 1) > 1 ? " checked" : "") + '>' +
      '<span class="grow"><span class="b sm">할부로 결제</span>' +
      '<span class="tiny muted" style="display:block">체크하면 개월수와 회차를 정할 수 있습니다</span></span></label>' +
    '<div id="tInstBox" class="' + ((base.inst || 1) > 1 ? "" : "hidden") + '">' +
      '<div class="two">' +
        '<div class="field"><label>할부 개월</label>' +
          sel("tInst", Array.from({ length: 35 }, (_, i) => [i + 2, (i + 2) + "개월"]), Math.max(2, base.inst || 2)) + '</div>' +
        '<div class="field"><label>몇 회차까지 냈나</label>' +
          sel("tInstN", Array.from({ length: 36 }, (_, i) => [i + 1, (i + 1) + "회차"]), base.instN || 1) + '</div>' +
      '</div>' +
      '<div id="tInstInfo" class="tiny muted" style="margin:-4px 0 10px"></div>' +
    '</div>' +
    '<label class="tog" style="margin-bottom:10px;border:0"><input type="checkbox" id="tXfer"' + (base.xfer ? " checked" : "") + '>' +
      '<span class="grow"><span class="b sm">내 계좌 간 이동(이체)</span>' +
      '<span class="tiny muted" style="display:block">내 돈이 옮겨간 것이라 지출·수입 합계에서 빠집니다</span></span></label>' +
    '<div class="field"><label>메모</label><input id="tMemo" class="inp" value="' + esc(base.memo || "") + '" placeholder="자유 메모"></div>' +
    '<div class="field"><label>분류 (색상)</label><div class="chips" id="tCat">' +
      '<button class="chip" data-cat="">없음</button>' +
      D.cats.map(c => '<button class="chip" data-cat="' + c.id + '"><span class="dot" style="background:' + esc(c.color) + '"></span>' + esc(c.name) + '</button>').join("") +
    '</div></div>' +

    /* ---------- 반복 ---------- */
    '<label class="tog" style="border-top:1.5px solid var(--line);margin-top:6px;padding-top:12px">' +
      '<input type="checkbox" id="rOn"' + (repOn0 ? " checked" : "") + (mode === "occ" ? " disabled" : "") + '>' +
      '<span class="grow"><span class="b sm">🔁 반복 설정</span>' +
      '<span class="tiny muted" style="display:block">' + (mode === "occ" ? "이 항목은 반복 일정에서 나온 건입니다" : "월급·월세·구독료처럼 되풀이되는 항목") + '</span></span></label>' +

    '<div id="rBox" class="' + (repOn0 ? "" : "hidden") + '" style="background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0 4px">' +
      '<div class="two">' +
        '<div class="field" style="margin-bottom:8px"><label>주기</label>' +
          sel("rFreq", [["day", "매일"], ["week", "매주"], ["month", "매월"], ["year", "매년"]], rep0.freq) + '</div>' +
        '<div class="field" style="margin-bottom:8px"><label>반복 간격</label>' +
          '<div class="row"><input id="rGap" class="inp" inputmode="numeric" value="' + (rep0.gap || 1) + '" style="text-align:center">' +
          '<span class="sm b" id="rGapU" style="flex:none;width:52px">개월마다</span></div></div>' +
      '</div>' +

      '<div id="rWeek" class="field hidden"><label>요일 선택</label><div class="chips">' +
        DOWN.map((n, i) => '<button class="chip" data-dow="' + i + '" style="width:40px;padding:8px 0;justify-content:center">' + n + '</button>').join("") +
      '</div></div>' +

      '<div id="rYear" class="field hidden"><label>몇 월</label>' +
        sel("rYmon", Array.from({ length: 12 }, (_, i) => [i + 1, (i + 1) + "월"]), rep0.ymon || +base.date.slice(5, 7)) + '</div>' +

      '<div id="rMon" class="hidden">' +
        '<label class="tog" style="border:0;padding:4px 0"><input type="radio" name="rmm" value="date" id="rmDate"' + (rep0.mmode !== "nth" ? " checked" : "") + ' style="width:20px;height:20px;accent-color:var(--accent)">' +
          '<span class="grow row" style="gap:6px"><span class="sm b" id="rDayLab" style="flex:none">매월</span>' +
          sel("rMday", Array.from({ length: 31 }, (_, i) => [i + 1, (i + 1) + "일"]), rep0.mday || dParse(base.date).getDate(), ' style="padding:7px 9px"') + '</span></label>' +
        '<label class="tog" style="border:0;padding:4px 0"><input type="radio" name="rmm" value="nth" id="rmNth"' + (rep0.mmode === "nth" ? " checked" : "") + ' style="width:20px;height:20px;accent-color:var(--accent)">' +
          '<span class="grow row" style="gap:6px">' +
          sel("rNth", [[1, "첫째주"], [2, "둘째주"], [3, "셋째주"], [4, "넷째주"], [5, "다섯째주"], [-1, "마지막주"]], rep0.nth || 1, ' style="padding:7px 9px"') +
          sel("rNdow", DOWN.map((n, i) => [i, n + "요일"]), rep0.ndow == null ? dParse(base.date).getDay() : rep0.ndow, ' style="padding:7px 9px"') + '</span></label>' +
        '<p class="tiny muted" style="margin:2px 0 6px">31일로 두면 그 달에 31일이 없을 때 말일에 기록됩니다.</p>' +
      '</div>' +

      '<div class="field" style="margin-bottom:6px"><label>반복 종료</label>' +
        sel("rEnd", [["none", "종료 없음"], ["count", "횟수 지정"], ["date", "종료 날짜 지정"]], (rep0.end || {}).type || "none") + '</div>' +
      '<div id="rEndCount" class="field hidden" style="margin-bottom:0"><label>몇 회 반복</label>' +
        '<input id="rCount" class="inp" inputmode="numeric" value="' + ((rep0.end || {}).count || 12) + '"></div>' +
      '<div id="rEndDate" class="field hidden" style="margin-bottom:0"><label>이 날짜까지</label>' +
        '<input id="rDate" class="inp" type="date" value="' + esc((rep0.end || {}).date || "") + '"></div>' +
      '<div id="rPrev" class="tiny muted" style="margin-top:10px;line-height:1.6"></div>' +
    '</div>';

  modal({
    title: mode === "new" ? "직접 입력" : mode === "rule" ? "반복 규칙 수정" : "내역 수정",
    body,
    foot: (mode !== "new" ? '<button class="btn dan" id="tDel">삭제</button>' : '') + '<button class="btn pri" id="tOk">저장</button>',
    onOpen(el, close) {
      /* 분류 */
      let cat = base.cat || "";
      const paint = () => $$("[data-cat]", el).forEach(b => {
        const on = b.dataset.cat === cat, c = CATC(b.dataset.cat) || "var(--tx3)";
        b.classList.toggle("on", on);
        b.style.background = on ? c : ""; b.style.borderColor = on ? c : "";
        b.style.color = on ? onColor(c) : "";
      });
      paint();
      $$("[data-cat]", el).forEach(b => b.onclick = () => { cat = b.dataset.cat; paint(); });

      /* 할부 안내 */
      commaOn($("#tAmt", el));
      const iOn = $("#tInstOn", el), iBox = $("#tInstBox", el);
      const iSel = $("#tInst", el), iN = $("#tInstN", el), iInfo = $("#tInstInfo", el);
      const iUp = () => {
        iBox.classList.toggle("hidden", !iOn.checked);
        if (!iOn.checked) return;
        const n = +iSel.value, k2 = Math.min(+iN.value, n);
        const amt = +String($("#tAmt", el).value).replace(/[^\d]/g, "") || 0;
        iInfo.textContent = k2 + "회납 / " + n + "개월 할부 · 남은 " + Math.max(0, n - k2) + "개월" +
          (amt ? " · 월 " + won(Math.round(amt / n)) + "원" : "");
      };
      iOn.onchange = iUp; iSel.onchange = iUp; iN.onchange = iUp;
      $("#tAmt", el).addEventListener("input", iUp);
      iUp();

      /* 요일 */
      let dows = (rep0.dows || []).slice();
      const paintD = () => $$("[data-dow]", el).forEach(b => {
        const on = dows.indexOf(+b.dataset.dow) >= 0;
        b.classList.toggle("on", on);
        b.style.background = on ? "var(--accent)" : ""; b.style.borderColor = on ? "var(--accent)" : "";
        b.style.color = on ? "#fff" : "";
      });
      paintD();
      $$("[data-dow]", el).forEach(b => b.onclick = () => {
        const d = +b.dataset.dow, i = dows.indexOf(d);
        if (i >= 0) dows.splice(i, 1); else dows.push(d);
        paintD(); prev();
      });

      const rOn = $("#rOn", el), rBox = $("#rBox", el), rFreq = $("#rFreq", el), rEnd = $("#rEnd", el);
      const show = () => {
        rBox.classList.toggle("hidden", !rOn.checked);
        const f = rFreq.value;
        $("#rGapU", el).textContent = { day: "일마다", week: "주마다", month: "개월마다", year: "년마다" }[f];
        $("#rWeek", el).classList.toggle("hidden", f !== "week");
        $("#rMon", el).classList.toggle("hidden", f !== "month" && f !== "year");
        $("#rYear", el).classList.toggle("hidden", f !== "year");
        $("#rDayLab", el).textContent = f === "year" ? "매년" : "매월";
        $("#rEndCount", el).classList.toggle("hidden", rEnd.value !== "count");
        $("#rEndDate", el).classList.toggle("hidden", rEnd.value !== "date");
        prev();
      };
      const buildRule = () => ({
        id: (mode === "rule" || mode === "occ") ? r.id : uid(),
        acc: $("#tAcc", el).value, desc: $("#tDesc", el).value.trim(),
        memo: $("#tMemo", el).value.trim(),
        amt: +String($("#tAmt", el).value).replace(/[^\d]/g, "") || 0,
        flow: $("#tFlow", el).value, xfer: $("#tXfer", el).checked, cat,
        time: $("#tTime", el).value || "",
        start: $("#tDate", el).value || todayISO(),
        freq: rFreq.value, gap: Math.max(1, +$("#rGap", el).value || 1),
        dows: dows.slice(),
        mmode: $("#rmNth", el).checked ? "nth" : "date",
        mday: +$("#rMday", el).value, nth: +$("#rNth", el).value, ndow: +$("#rNdow", el).value,
        ymon: +$("#rYmon", el).value,
        end: { type: rEnd.value, count: Math.max(1, +$("#rCount", el).value || 1), date: $("#rDate", el).value || "" },
        until: null, ex: [], ov: {}
      });
      const prev = () => {
        const box = $("#rPrev", el);
        if (!rOn.checked) return box.textContent = "";
        const q = buildRule();
        const list = occDates(q, q.start, addMonth(q.start.slice(0, 7), 30) + "-28").slice(0, 5);
        box.innerHTML = '<b>' + esc(ruleLabel(q)) + ' · ' + esc(ruleEndLabel(q)) + '</b><br>' +
          (list.length ? "앞으로: " + list.join(" / ") + (list.length >= 5 ? " …" : "") : "생성되는 일정이 없습니다 — 설정을 확인하세요");
      };
      rOn.onchange = show; rFreq.onchange = show; rEnd.onchange = show;
      $$("#rBox input, #rBox select", el).forEach(x => x.addEventListener("change", prev));
      /* 날짜를 바꾸면 반복 기준일도 같이 따라오게 (직접 고른 값은 건드리지 않음) */
      let prevDay = dParse(base.date).getDate();
      $("#tDate", el).addEventListener("change", () => {
        const dd = $("#tDate", el).value;
        if (dd && +$("#rMday", el).value === prevDay) {
          $("#rMday", el).value = String(+dd.slice(8, 10));
          $("#rNdow", el).value = String(dParse(dd).getDay());
          $("#rYmon", el).value = String(+dd.slice(5, 7));
          prevDay = +dd.slice(8, 10);
        }
        prev();
      });
      show();

      /* ---------- 저장 ---------- */
      $("#tOk", el).onclick = () => {
        const amt = +String($("#tAmt", el).value).replace(/[^\d]/g, "") || 0;
        if (!amt) return toast("금액을 입력하세요");
        const fields = {
          date: $("#tDate", el).value || todayISO(), time: $("#tTime", el).value || "",
          desc: $("#tDesc", el).value.trim(), memo: $("#tMemo", el).value.trim(),
          amt, flow: $("#tFlow", el).value, acc: $("#tAcc", el).value,
          xfer: $("#tXfer", el).checked, cat,
          inst: $("#tInstOn", el).checked ? Math.max(2, +$("#tInst", el).value || 2) : 1,
          instN: $("#tInstOn", el).checked
            ? Math.min(Math.max(1, +$("#tInstN", el).value || 1), Math.max(2, +$("#tInst", el).value || 2)) : 1
        };
        const done = m => { persist(); close(); render(); toast(m || "저장했습니다"); };

        if (mode === "occ") {
          const patch = Object.assign({}, fields);
          askScope("반복 일정 수정", "<b>" + occ + "</b> 건을 바꿉니다. 이 날짜만 바꿀까요, 이 날짜부터 뒤의 모든 반복에도 적용할까요?", pick => {
            if (pick === "one") { r.ov = r.ov || {}; r.ov[occ] = patch; done("이 일정만 바꿨습니다"); }
            else {
              const q = buildRule();
              delete q.id;
              splitRule(r, occ, {
                acc: q.acc, desc: q.desc, memo: q.memo, amt: q.amt, flow: q.flow,
                xfer: q.xfer, cat: q.cat, time: q.time,
                freq: q.freq, gap: q.gap, dows: q.dows, mmode: q.mmode,
                mday: q.mday, nth: q.nth, ndow: q.ndow, ymon: q.ymon, end: q.end
              });
              done("이후 일정에 적용했습니다");
            }
          });
          return;
        }
        if (mode === "rule") {
          const q = buildRule(); q.ex = r.ex || []; q.ov = r.ov || {}; q.until = r.until || null;
          Object.assign(r, q); return done();
        }
        if (rOn.checked) {                       // 새 반복 규칙
          if (mode === "txn") D.txns = D.txns.filter(x => x.id !== t.id);
          D.rules = D.rules || [];
          D.rules.push(buildRule());
          return done("반복 일정을 만들었습니다");
        }
        const o = (mode === "txn") ? t : { id: uid() };
        Object.assign(o, fields);
        if (mode === "new") D.txns.push(o);
        done();
      };

      /* ---------- 삭제 ---------- */
      const del = $("#tDel", el);
      if (del) del.onclick = () => {
        const done = m => { persist(); close(); render(); toast(m || "삭제했습니다"); };
        if (mode === "txn") { D.txns = D.txns.filter(x => x.id !== t.id); return done(); }
        if (mode === "rule") {
          return ask("이 반복 일정을 완전히 지웁니다. 과거 기록도 함께 사라집니다.", () => {
            D.rules = D.rules.filter(x => x.id !== r.id); done();
          }, "삭제", true);
        }
        askScope("반복 일정 삭제", "<b>" + occ + "</b> 건을 지웁니다. 어디까지 지울까요?", pick => {
          if (pick === "one") { r.ex = (r.ex || []).concat([occ]); done("이 건만 지웠습니다"); }
          else if (pick === "all") { D.rules = D.rules.filter(x => x.id !== r.id); done("반복 일정을 전부 지웠습니다"); }
          else if (occ <= r.start) { D.rules = D.rules.filter(x => x.id !== r.id); done("반복을 삭제했습니다"); }
          else { r.until = addDays(occ, -1); done(occ + "부터 반복을 끝냈습니다"); }
        }, true);
      };
    }
  });
}


/* ============================================================
   은행 잔액 수정 — 기존 잔액과의 차액을 기록으로 남긴다

function editBal(accId) {
  const a = D.accounts.find(x => x.id === accId); if (!a) return;
  const deb = a.kind === "debit";
  const stk = !!a.stock;
  const old = deb ? debitBal(a) : (+a.bal || 0);
  modal({
    title: a.name + (stk ? " 평가금액 수정" : deb ? " 충전 잔액 수정" : " 잔액 수정"),

      '<div class="card" style="margin:0 0 12px"><div class="bd row">' +
        '<div class="grow"><div class="tiny muted b">' + (stk ? "지금 기록된 평가금액" : deb ? "현재 자동 계산된 잔액" : "현재 기록된 잔액") + '</div>' +
        '<div class="num b" style="font-size:20px">' + wonS(old) + '</div></div></div></div>' +
      '<div class="field"><label>' + (stk ? "오늘 기준 평가금액 (증권 앱에서 본 금액)" : deb ? "실제 잔액 (카드 앱에서 본 금액)" : "실제 잔액 (통장·앱에서 본 금액)") + '</label>' +
        '<input id="bNew" class="inp" inputmode="numeric" value="' + old + '"></div>' +
      (stk ? '<div class="field"><label>이번 변동은 무엇인가요?</label>' +
        '<div class="seg" style="margin:0">' +
          '<button type="button" data-pk="0" class="on">평가 변동 (수익·손실)</button>' +

function showStock(accId) {
  const a = D.accounts.find(x => x.id === accId); if (!a) return;
  const log = stockLog(a), seed = stockSeed(a), pl = stockPL(a);
  const rate = seed ? pl / seed * 100 : 0;
  const chrono = log.slice().reverse();
  const pts = chrono.map(t => t.b1).filter(v => v != null);
  if (!pts.length && a.bal != null) pts.push(+a.bal || 0);
  const lo = Math.min(...pts, +a.bal || 0), hi = Math.max(...pts, +a.bal || 0);
  const span = Math.max(1, hi - lo);
  const series = pts.concat(pts[pts.length - 1] === (+a.bal || 0) ? [] : [+a.bal || 0]).slice(-14);

  const body =
    '<div class="card" style="margin:0 0 12px"><div class="bd">' +
      '<div class="tiny muted b">현재 평가금액</div>' +
      '<div class="num b" style="font-size:26px;letter-spacing:-.03em">' + wonS(+a.bal || 0) + '</div>' +
      '<div class="stat" style="margin-top:12px">' +
        '<div><b class="num">' + won(seed) + '</b><span>원금</span></div>' +
        '<div><b class="num ' + (pl >= 0 ? "c-inc" : "c-bad") + '">' + signWon(pl) + '</b><span>누적 손익</span></div>' +
        '<div><b class="num ' + (pl >= 0 ? "c-inc" : "c-bad") + '">' + (rate >= 0 ? "+" : "") + rate.toFixed(1) + '%</b><span>수익률</span></div>' +
      '</div>' +
      (series.length > 1 ? '<div class="ybars" style="height:70px;margin-top:12px">' +
        series.map(v => '<button class="ybar" style="pointer-events:none"><div class="yb2">' +
          '<i style="height:' + Math.max(4, (v - lo) / span * 100) + '%;background:' + (pl >= 0 ? "var(--inc)" : "var(--bad)") + '"></i>' +
        '</div></button>').join("") + '</div>' +
        '<div class="tiny muted" style="margin-top:6px">' + won(lo) + '원 ~ ' + won(hi) + '원 사이의 변동입니다.</div>' : '') +
    '</div></div>' +
    (log.length
      ? '<div class="card" style="margin:0"><div class="hd"><h2>변동 내역</h2></div>' +
        log.map(t => '<div class="acc" style="padding:11px 14px">' +
          '<div class="grow"><div class="b sm">' + esc(t.date) +
            ' <span class="pill tiny" style="padding:1px 7px">' + (t.princ ? "원금" : "평가") + '</span></div>' +
            '<div class="tiny muted num">' + won(t.b0) + ' → ' + won(t.b1) + (t.memo ? ' · ' + esc(t.memo) : '') + '</div></div>' +
          '<div class="num b ' + (t.flow === "in" ? "c-inc" : "c-bad") + '">' +
            (t.flow === "in" ? "+" : "-") + won(t.amt) + '</div>' +
        '</div>').join("") + '</div>'
      : '<div class="card" style="margin:0"><div class="empty"><b>아직 변동 기록이 없습니다</b>' +
        '“평가금액 수정”을 누르면 그날 기준 금액으로 바꾸고 차액이 여기에 쌓입니다.</div></div>');

  modal({
    title: a.name,

  '각 거래 한 건을 JSON 객체 하나로 만들어 JSON 배열로만 답하세요.\n' +
  '필드: date("YYYY-MM-DD"), time("HH:MM" 24시간, 없으면 ""), desc(가맹점명·적요를 화면 그대로), ' +

  '- 합계·잔액요약·페이지머리글·광고 문구는 절대 넣지 마세요.\n' +

  '- 취소·환불·승인취소 건은 flow를 "in"으로 하세요.\n' +
  '- 잘리거나 흐려서 확실하지 않은 줄은 제외하세요.\n' +
  '- 연도가 안 보이면 {Y}년으로 보세요.\n' +
  '- 설명 없이 JSON 배열만 출력하세요. 거래가 없으면 [] 만 출력하세요.\n' +
  '예: [{"date":"{Y}-09-03","time":"12:41","desc":"스타벅스 서초점","amount":5600,"flow":"out"}]';

function rules() { return OCR_RULES.replace(/\{Y\}/g, D.anchor.split("-")[0]); }

const XFER_RE = /(이체|송금|타행|자동납부|자동이체|내계좌|계좌이체|ATM|CD출금|출금이체|입금이체)/i;
function normRows(arr, accId) {
  const y = D.anchor.split("-")[0];
  const accX = D.accounts.find(a => a.id === accId) || {};
  const out = [];
  (Array.isArray(arr) ? arr : []).forEach(r => {
    if (!r || typeof r !== "object") return;
    let date = String(r.date || "").trim().replace(/[.\/]/g, "-").replace(/\s/g, "");
    let m = date.match(/(\d{2,4})-(\d{1,2})-(\d{1,2})/);
    if (m) date = (m[1].length === 2 ? "20" + m[1] : m[1]) + "-" + pad(+m[2]) + "-" + pad(+m[3]);
    else { m = date.match(/^(\d{1,2})-(\d{1,2})$/); if (m) date = y + "-" + pad(+m[1]) + "-" + pad(+m[2]); else return; }
    let time = String(r.time || "").trim();
    const tm = time.match(/(\d{1,2}):(\d{2})/);
    time = tm ? pad(+tm[1]) + ":" + tm[2] : "";
    const amt = Math.abs(Math.round(+String(r.amount != null ? r.amount : r.amt).replace(/[^\d.-]/g, "") || 0));
    if (!amt) return;
    out.push({
      id: uid(), acc: accId, date, time,
      desc: String(r.desc || r.memo || "").trim().slice(0, 60),
      memo: "", amt, flow: r.flow === "in" ? "in" : "out", cat: "",
      inst: Math.max(1, Math.min(36, +r.inst || 1)), instN: 1,
      xfer: accX.kind === "bank" && XFER_RE.test(String(r.desc || ""))
    });
  });
  return out;
}

/* ---------- CSV / XLSX ---------- */
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === "," || c === "\t") { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (c !== "\r") cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim()));
}
let XLSXP = null;
function loadXLSX() {
  if (XLSXP) return XLSXP;
  XLSXP = new Promise((res, rej) => {
    let done = false;
    const fin = (ok, v) => { if (done) return; done = true; ok ? res(v) : rej(new Error("xlsx")); };
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = () => fin(!!window.XLSX, window.XLSX);
    s.onerror = () => fin(false);
    document.head.appendChild(s);
    setTimeout(() => { if (!done) { XLSXP = null; fin(!!window.XLSX, window.XLSX); } }, 7000);
  });
  return XLSXP;
}
async function fileToRows(f) {
  const nm = f.name.toLowerCase();
  if (nm.endsWith(".csv") || nm.endsWith(".txt") || nm.endsWith(".tsv")) {
    let buf = await f.arrayBuffer();
    let txt = new TextDecoder("utf-8").decode(buf);
    if (/\uFFFD/.test(txt)) { try { txt = new TextDecoder("euc-kr").decode(buf); } catch (e) {} }
    return parseCSV(txt);
  }
  const X = await loadXLSX();
  const wb = X.read(await f.arrayBuffer(), { type: "array" });
  const sh = wb.Sheets[wb.SheetNames[0]];
  return X.utils.sheet_to_json(sh, { header: 1, raw: false, defval: "" })
    .filter(r => r.some(x => String(x).trim()));
}

              if (!SLIM || !SLIM.images) { stat.textContent = "이 화면에서는 이미지를 보낼 수 없습니다. 엑셀·CSV로 시도해 주세요."; run.disabled = false; return; }
              const arr = await SAMPLE.json(
                "첨부 이미지는 한국 " + (acc.kind === "bank" ? "은행" : "카드사") + " “" + acc.name + "”의 이용내역 화면 캡처입니다.\n" + rules(),
                { images: f, modelTier: "default" }
              );
              found = found.concat(normRows(arr, accId));
            } else {
              const rows = await fileToRows(f);
              let local = null;
              try {
                local = parseTable(rows, +D.anchor.slice(0, 4)) ||
                        parsePaste(rows.map(r => r.join("\t")).join("\n"), +D.anchor.slice(0, 4));
              } catch (e2) { local = null; }
              if (local && local.length) { found = found.concat(normRows(local, accId)); continue; }
              for (let s = 0; s < rows.length; s += 120) {
                const chunk = rows.slice(s, s + 120).map(r => r.join("\t")).join("\n").slice(0, 40000);
                if (!chunk.trim()) continue;
                if (!SAMPLE) { stat.textContent = "이 환경에서는 자동 인식을 쓸 수 없습니다. 직접 입력해 주세요."; run.disabled = false; return; }
                const arr = await SAMPLE.json(
                  "아래는 한국 " + (acc.kind === "bank" ? "은행" : "카드사") + " “" + acc.name + "”에서 받은 이용내역 표입니다(탭 구분).\n" +
                  rules() + "\n\n표:\n" + chunk,
                  { modelTier: "default" }
                );
                found = found.concat(normRows(arr, accId));
              }
            }
          } catch (err) {
            const code = (err && err.code) || "";
            if (code === "not_granted") { stat.textContent = "Claude 사용 권한을 허용해야 자동 인식이 됩니다."; run.disabled = false; return; }
            if (code === "rate_limited") { stat.textContent = "요청이 많습니다. 잠시 뒤 다시 시도해 주세요."; run.disabled = false; return; }
            stat.textContent = "“" + f.name + "” 읽기에 실패했습니다. 다음 파일을 계속 진행합니다.";
          }
        }
        stat.textContent = "";
        if (!found.length) { prev.innerHTML = '<p class="sm c-bad b">읽어낸 거래가 없습니다. 화면이 잘리지 않은 캡처로 다시 시도해 보세요.</p>'; run.disabled = false; return; }
        showPreview(el, prev, run, found, accId, close);
      };
    }
  });
}


/* ============================================================
   텍스트 붙여넣기 파서 — 카드사·은행 화면을 복사해 넣으면 해석한다
   Claude를 쓰지 않고 앱 자체 로직으로 처리 (오프라인 동작)
   ============================================================ */
const SKIP_RE = /(합\s*계|총\s*계|총\s*액|소\s*계|잔여|이용한도|사용한도|남은한도|더보기|전체보기|조회기간|조회조건|내역이\s*없|결과가\s*없|페이지|정렬|선택하세요|단위\s*:|원단위|광고|이벤트|검색|필터|기간선택|카드선택|바로가기|앱카드|간편결제안내)/;
const IN_RE  = /(입\s*금|취\s*소|환\s*불|승인취소|반\s*환|캐시백|적립|충\s*전|이자|급여|상\s*환입금|반품)/;
const OUT_RE = /(출\s*금|결\s*제|승\s*인|사\s*용|이\s*체|지\s*급|납\s*부|인\s*출)/;
const HDR = {
  date: /(거래일|이용일|승인일|매출일|사용일|날짜|일자|거래일시|이용일시)/,
  time: /(시간|시각)/,
  desc: /(적요|가맹점|내용|거래내용|이용내역|상호|내역|사용처|비고|메모|기재)/,
  out:  /(출금|지급|이용금액|승인금액|결제금액|사용금액|출금액|금액|매출액|이용액)/,
  inn:  /(입금|입금액|예금|취소금액|환불)/,
  bal:  /(잔액|거래후|잔고)/
};

function okDate(y, m, d) { return m >= 1 && m <= 12 && d >= 1 && d <= lastDay(y, m); }
function mkDate(y, m, d) { return okDate(+y, +m, +d) ? y + "-" + pad(+m) + "-" + pad(+d) : null; }
function findDate(s, year) {
  let m, r;
  if ((m = s.match(/(20\d{2})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/)) && (r = mkDate(m[1], m[2], m[3]))) return r;
  if ((m = s.match(/(?:^|[^\d])(\d{2})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})(?![\d])/)) && (r = mkDate("20" + m[1], m[2], m[3]))) return r;
  if ((m = s.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/)) && (r = mkDate(year, m[1], m[2]))) return fixYear(r);
  if ((m = s.match(/(?:^|[^\d:])(\d{1,2})[.\-\/](\d{1,2})(?![\d:.\-\/])/)) && (r = mkDate(year, m[1], m[2]))) return fixYear(r);
  if ((m = s.match(/(20\d{2})(\d{2})(\d{2})(?![\d])/)) && (r = mkDate(m[1], m[2], m[3]))) return r;
  return null;
}
function fixYear(iso) {                 // MM.DD만 있을 때 미래로 튀면 작년으로
  const t = todayISO();
  if (iso > addDays(t, 60)) { const y = +iso.slice(0, 4) - 1; return y + iso.slice(4); }
  return iso;
}
function findTime(s) {
  let m = s.match(/(\d{1,2})\s*[:시]\s*(\d{2})/);
  if (!m) return "";
  let hh = +m[1];
  if (/오후|PM/i.test(s) && hh < 12) hh += 12;
  if (/오전|AM/i.test(s) && hh === 12) hh = 0;
  return hh > 23 ? "" : pad(hh) + ":" + m[2];
}
const CARDM = [                                   // 카드번호·마스킹된 번호
  /\d[\d*\u2022\-\s]{4,}\*{1,}[\d*\u2022\-\s]*/g,   /* 1234-56**-****-3333 */
  /\*{1,}[\-\s]?\d{2,4}/g,                        /* ****3333 */
  /\d{2,4}[\-\s]?\*{1,}/g,                        /* 333* */
  /[\u2022]{2,}[\-\s]?\d{2,4}/g,                   /* ••••3333 */
  /\(\s*\d{4}\s*\)/g,                             /* 국민카드(3333) */
  /(카드|승인|거래|가맹점|사업자|회원)\s*(번호|No\.?)\s*[:\-]?\s*[\d\-*]{4,}/gi
];
const MASKS = [
  /(20\d{2})\s*[.\-\/년]\s*\d{1,2}\s*[.\-\/월]\s*\d{1,2}\s*일?/g,
  /(?:^|[^\d])\d{2}\s*[.\-\/]\s*\d{1,2}\s*[.\-\/]\s*\d{1,2}(?![\d])/g,
  /\d{1,2}\s*월\s*\d{1,2}\s*일/g,
  /(?:^|[^\d:])\d{1,2}[.\-\/]\d{1,2}(?![\d:.\-\/])/g,
  /20\d{6}(?![\d])/g,
  /\d{1,2}\s*[:시]\s*\d{2}(\s*분)?/g
];
function mask(s) {                       // 길이는 그대로 두고 숫자만 공백 처리
  let t = String(s);
  CARDM.forEach(re => { t = t.replace(re, m => m.replace(/[0-9]/g, " ")); });
  MASKS.forEach(re => { t = t.replace(re, m => m.replace(/[0-9]/g, " ")); });
  return t;
}
function findAmounts(s) {
  const out = [];
  const re = /(-?\d{1,3}(?:[.,]\d{3})+|-?\d{3,12})\s*(원)?/g;
  let m;
  while ((m = re.exec(s))) {
    const before = s.slice(Math.max(0, m.index - 3), m.index);
    const after = s.slice(m.index + m[1].length, m.index + m[1].length + 3);
    if (/[*\u2022]\s*$/.test(before) || /^\s*[*\u2022]/.test(after)) continue;  // 카드번호 끝자리
    if (/\(\s*$/.test(before) && /^\s*\)/.test(after) && !m[1].includes(",")) continue;
    if (/[.:\-\/]$/.test(before) && !m[1].includes(",")) continue;   // 날짜·시간 조각 제외
    const v = +m[1].replace(/[.,](?=\d{3}\b)/g, "").replace(/,/g, "");
    if (!isFinite(v) || Math.abs(v) < 10) continue;
    out.push({ v: Math.abs(v), neg: v < 0, won: !!m[2], i: m.index, raw: m[1] });
  }
  return out;
}
function findInst(s) {                      // 할부 개월수 (1 = 일시불, 0 = 알 수 없음)
  if (/일시불/.test(s)) return 1;
  const m = s.match(/(\d{1,2})\s*개월/);
  if (m) return Math.max(1, Math.min(36, +m[1]));
  if (/할부/.test(s)) return 0;
  return 0;
}
function pickAmount(s, amts) {
  if (!amts.length) return null;
  let a = amts.slice();
  if (/카드|계좌|번호|끝자리/.test(s))
    a = a.filter(x => x.won || x.raw.includes(",") || String(x.v).length > 4);
  if (!a.length) return null;
  const won = a.filter(x => x.won);
  if (won.length === 1) return won[0];
  if (a.length >= 2) {
    const last = a[a.length - 1], first = a[0];
    const balLike = /잔액|잔고|거래후/.test(s) || (last.v >= first.v * 1.5 && last.v >= 10000 && !last.won);
    if (balLike) a = a.slice(0, -1);
  }
  const nz = a.filter(x => x.v > 0);
  return nz.length ? nz[0] : null;
}
function cleanDesc(masked, picked) {
  let t = String(masked);
  if (picked) t = t.slice(0, picked.i) + " ".repeat(picked.raw.length) + t.slice(picked.i + picked.raw.length);
  t = t.replace(/[*\u2022]+/g, " ")
       .replace(/\([월화수목금토일]\)/g, " ")
       .replace(/\d{1,2}\s*개월/g, " ")
       .replace(/-?\d{1,3}([.,]\d{3})+/g, " ")
       .replace(/\d{3,12}/g, " ")
       .replace(/원/g, " ")
       .replace(/(오전|오후|AM|PM)/gi, " ")
       .replace(/(일시불|무이자|할부|개월|승인취소|승인|정상|완료|매입|체크카드|신용카드|국내|해외|출금액|입금액|출금|입금|지급|결제|사용)/g, " ")
       .replace(/[|｜\t·∙•:,\/\\\-–—.]+/g, " ")
       .replace(/(?:^|\s)\d{1,2}(?=\s|$)/g, " ")
       .replace(/\s{2,}/g, " ").trim();
  return t.slice(0, 40);
}

/* 표(탭·쉼표) 형태 — 머리글이 있으면 열로 해석 */
function parseTable(rows, year) {
  let hi = -1, map = null;
  for (let i = 0; i < Math.min(8, rows.length); i++) {
    const c = rows[i], m = {};
    c.forEach((h, j) => {
      const t = String(h).replace(/\s/g, "");
      if (m.date == null && HDR.date.test(t)) m.date = j;
      else if (m.time == null && HDR.time.test(t)) m.time = j;
      else if (m.bal == null && HDR.bal.test(t)) m.bal = j;
      else if (m.inn == null && HDR.inn.test(t)) m.inn = j;
      else if (m.out == null && HDR.out.test(t)) m.out = j;
      else if (m.desc == null && HDR.desc.test(t)) m.desc = j;
    });
    if (m.date != null && (m.out != null || m.inn != null)) { hi = i; map = m; break; }
  }
  if (hi < 0) return null;
  const num = x => +String(x == null ? "" : x).replace(/[^\d-]/g, "") || 0;
  const out = [];
  for (let i = hi + 1; i < rows.length; i++) {
    const c = rows[i];
    const dtxt = String(c[map.date] || "");
    const date = findDate(dtxt, year); if (!date) continue;
    const o = num(map.out != null ? c[map.out] : 0);
    const inn = num(map.inn != null ? c[map.inn] : 0);
    if (!o && !inn) continue;
    out.push({
      date,
      time: (map.time != null ? findTime(String(c[map.time] || "")) : "") || findTime(dtxt),
      desc: String(map.desc != null ? c[map.desc] || "" : "").trim().slice(0, 40),
      amount: Math.abs(inn && !o ? inn : o),
      flow: (inn && !o) ? "in" : "out"
    });
  }
  return out.length ? out : null;
}

/* 자유 형식 — 줄을 먼저 해석한 뒤, 날짜가 위에 오는지 아래에 오는지 판별해서 묶는다 */
function isNoise(line) {
  if (SKIP_RE.test(line)) return true;
  if (/적립|마일리지|포인트/.test(line)) return true;                 // 적립 예정 710(1.0%)
  if (/(승인|거래|가맹점|사업자|회원|전표)\s*(번호|No)/i.test(line)) return true;
  if (/^[\s\d*\u2022\-]+$/.test(line) && /[*\u2022]/.test(line)) return true;  // 4567-**** 같은 줄
  if (/^\s*(카드|계좌|번호|끝자리)\s*(번호)?\s*[:\-]?\s*[\d\-]{3,4}\s*$/.test(line)) return true;
  if (/할인|쿠폰|캐시백/.test(line) && /[-%]/.test(line)) return true; // 10% 할인 -7,150원
  if (/^[-=_*·.\s]{3,}$/.test(line)) return true;                     // 구분선
  return false;
}

function parsePaste(text, year) {
  const raw = String(text).replace(/\u00a0/g, " ").replace(/\r/g, "");
  const lines = raw.split("\n").map(l => l.trim()).filter(Boolean);
  if (!lines.length) return [];

  if (/\t/.test(raw) || lines.filter(l => (l.match(/,/g) || []).length >= 3).length > 2) {
    const sep = /\t/.test(raw) ? "\t" : ",";
    const rows = lines.map(l => l.split(sep).map(x => x.trim().replace(/^"|"$/g, "")));
    const t = parseTable(rows, year);
    if (t) return t;
  }

  /* 1단계: 줄마다 날짜·시간·금액·문구·할부를 뽑아둔다 */
  const L = lines.map(line => {
    const noise = isNoise(line);
    const mk = mask(line);
    const amts = noise ? [] : findAmounts(mk);
    const balOnly = /잔\s*액|잔고|거래후/.test(line) && amts.length <= 1;
    const dead = noise || balOnly;
    const picked = dead ? null : pickAmount(mk, amts);
    return {
      line, date: findDate(line, year), time: findTime(line),
      picked, inst: findInst(line),
      text: dead ? "" : cleanDesc(mk, picked)
    };
  });
  const A = [];
  L.forEach((x, i) => { if (x.picked) A.push(i); });
  if (!A.length) return [];
  const seg = k => [k ? A[k - 1] + 1 : 0, k < A.length - 1 ? A[k + 1] - 1 : L.length - 1];

  /* 2단계: 날짜가 금액보다 앞에 오는 형식인지 뒤에 오는 형식인지 판별 */
  let lead = 0, trail = 0;
  A.forEach((ai, k) => {
    const [lo, hi] = seg(k);
    let bd = null, fd = null;
    for (let i = ai; i >= lo; i--) if (L[i].date) { bd = ai - i; break; }
    for (let i = ai + 1; i <= hi; i++) if (L[i].date) { fd = i - ai; break; }
    if (bd != null && (fd == null || bd <= fd)) lead++;
    else if (fd != null) trail++;
  });
  const trailing = trail > lead;

  /* 3단계: 각 금액마다 날짜·가맹점·할부를 붙인다 */
  const out = [];
  let lastDate = null;
  A.forEach((ai, k) => {
    const [lo, hi] = seg(k);
    let date = null, time = L[ai].time || "";
    const back = () => { for (let i = ai; i >= lo; i--) if (L[i].date) { if (!time) time = L[i].time; return L[i].date; } return null; };
    const fwd  = () => { for (let i = ai; i <= hi; i++) if (L[i].date) { if (!time) time = L[i].time; return L[i].date; } return null; };
    date = trailing ? (fwd() || back() || lastDate) : (back() || lastDate || fwd());
    if (date) lastDate = date;
    if (!date) return;

    let desc = L[ai].text;
    if (!desc || desc.length < 2)
      for (let i = ai - 1; i >= lo; i--) if (!L[i].picked && L[i].text && L[i].text.length > 1) { desc = L[i].text; break; }
    if (!desc || desc.length < 2)
      for (let i = ai + 1; i <= hi; i++) if (!L[i].picked && L[i].text && L[i].text.length > 1) { desc = L[i].text; break; }

    let inst = L[ai].inst;
    if (!inst) for (let i = lo; i <= hi; i++) if (L[i].inst) { inst = L[i].inst; break; }

    const ln = L[ai].line.replace(/입금자|입금계좌|출금계좌|무이자/g, " ");
    out.push({
      date, time, desc: desc || "(내용 없음)",
      amount: L[ai].picked.v, flow: IN_RE.test(ln) ? "in" : "out",
      inst: inst || 1
    });
  });
  return out;
}

/* ---------- 붙여넣기 화면 ---------- */
function pasteFlow(presetAcc) {
  if (!D.accounts.length) { toast("먼저 은행이나 카드를 추가하세요"); return editAccount("card"); }
  const accId0 = presetAcc || D.accounts[0].id;
  modal({
    title: "복사한 내역 붙여넣기",
    body:
      '<div class="field"><label>어느 은행 · 카드의 내역인가요?</label><select id="pAcc" class="inp">' +

      '</select></div>' +
      '<div class="field"><label>카드사·은행 앱에서 복사한 내용</label>' +
        '<textarea id="pTxt" class="inp" style="min-height:170px;font-size:13px" ' +
        'placeholder="예)&#10;09.18 14:22 스타벅스강남점 5,600원&#10;09.17 이마트 87,400 일시불&#10;2026-09-16 GS25 3,200"></textarea></div>' +
      '<p class="tiny muted" style="margin:-4px 0 10px;line-height:1.6">농협·현대·신한·삼성 등 형식이 달라도 날짜·시간·가맹점·금액을 알아서 찾습니다. ' +
      '엑셀에서 복사한 표도 그대로 붙여넣으면 됩니다. 인터넷이나 Claude 없이 동작합니다.</p>' +
      '<div id="pPrev"></div>',
    foot: '<button class="btn" id="pClear">지우기</button><button class="btn pri" id="pRun">읽어오기</button>',
    onOpen(el, close) {
      const ta = $("#pTxt", el), prev = $("#pPrev", el), run = $("#pRun", el);
      ta.focus();
      $("#pClear", el).onclick = () => { ta.value = ""; prev.innerHTML = ""; run.textContent = "읽어오기"; };
      run.onclick = () => {
        const accId = $("#pAcc", el).value;
        const year = +D.anchor.slice(0, 4);
        let rows = [];
        try { rows = parsePaste(ta.value, year); } catch (e) { rows = []; }
        const found = normRows(rows, accId);
        if (!found.length) {
          prev.innerHTML = '<p class="sm c-bad b" style="margin-top:12px">읽어낸 거래가 없습니다.<br>' +
            '<span class="muted" style="font-weight:400">날짜와 금액이 같이 있는 줄이 필요합니다. 표 전체를 복사하거나 “09.18 스타벅스 5,600” 형태로 적어주세요.</span></p>';
          return;
        }
        showPreview(el, prev, run, found, accId, close);
      };
    }
  });
}

/* ---------- 중복 확인 + 직접 정정 미리보기 ---------- */
function showPreview(el, prev, run, found, accId, closeAll) {
  const exist = new Set(AL.filter(t => t.acc === accId).map(dkey));
  const items = found.map(t => ({ t, dup: false, on: true }));

  const recalc = () => {
    const seen = new Set();
    items.forEach(it => {
      const k = dkey(it.t);
      it.dup = exist.has(k) || seen.has(k);
      seen.add(k);
    });
  };
  recalc();
  items.forEach(it => { it.on = !it.dup; });

  const stats = () => {
    const dn = items.filter(i => i.dup).length, on = items.filter(i => i.on).length;
    const st = $("#pvStat", prev);
    if (st) st.innerHTML =
      '<div><b class="num">' + items.length + '</b><span>읽은 건수</span></div>' +
      '<div><b class="num c-bad">' + dn + '</b><span>중복 의심</span></div>' +
      '<div><b class="num c-ok">' + on + '</b><span>추가할 건수</span></div>';
    items.forEach((it, i) => {
      const row = prev.querySelector('[data-row="' + i + '"]');
      if (!row) return;
      row.classList.toggle("dup", it.dup);
      const tag = row.querySelector(".pvtag");
      if (tag) tag.textContent = it.dup ? "중복" : "";
    });
  };

  prev.innerHTML =
    '<div class="stat" id="pvStat" style="margin-top:14px"></div>' +
    '<p class="tiny muted" style="margin:0 0 8px;line-height:1.6">잘못 읽힌 곳은 <b>바로 눌러 고치세요.</b> 내용·금액·날짜·시간·구분 모두 수정됩니다. ' +
    '날짜와 시간, 금액이 이미 있는 기록과 같으면 중복으로 표시하고 체크를 꺼둡니다.</p>' +
    '<div class="row" style="gap:6px;margin-bottom:8px">' +
      '<button class="btn sm" data-all="1">전체 선택</button>' +
      '<button class="btn sm" data-all="0">전체 해제</button>' +
      '<button class="btn sm" data-all="d">중복만 해제</button>' +
    '</div>' +
    '<div class="prev">' + items.map((it, i) =>
      '<div class="prevrow" data-row="' + i + '">' +
        '<input type="checkbox" data-i="' + i + '"' + (it.on ? " checked" : "") + '>' +
        '<div class="grow" style="min-width:0">' +
          '<input class="pin" data-d="' + i + '" value="' + esc(it.t.desc || "") + '" placeholder="내용">' +
          '<div class="row" style="gap:4px;margin-top:4px">' +
            '<input type="date" class="pin xs" data-dt="' + i + '" value="' + esc(it.t.date) + '">' +
            '<input type="time" class="pin xs" data-tm="' + i + '" value="' + esc(it.t.time || "") + '">' +
            '<button class="pflow' + (it.t.flow === "in" ? " in" : "") + '" data-fl="' + i + '">' +
              (it.t.flow === "in" ? "수입" : "지출") + '</button>' +
            '<span class="pvtag tiny c-bad b" style="margin-left:auto"></span>' +
          '</div>' +
        '</div>' +
        '<input class="pin amt num" data-a="' + i + '" inputmode="numeric" value="' + it.t.amt + '">' +
      '</div>').join("") + '</div>';

  stats();

  $$("[data-i]", prev).forEach(cb => cb.onchange = () => { items[+cb.dataset.i].on = cb.checked; stats(); });
  $$("[data-all]", prev).forEach(b => b.onclick = () => {
    const m = b.dataset.all;
    items.forEach(i => i.on = m === "1" ? true : m === "0" ? false : !i.dup);
    $$("[data-i]", prev).forEach(cb => cb.checked = items[+cb.dataset.i].on);
    stats();
  });
  $$("[data-d]", prev).forEach(x => x.oninput = () => { items[+x.dataset.d].t.desc = x.value.trim(); });
  $$("[data-a]", prev).forEach(x => x.oninput = () => {
    items[+x.dataset.a].t.amt = +String(x.value).replace(/[^\d]/g, "") || 0;
    recalc(); stats();
  });
  $$("[data-dt]", prev).forEach(x => x.onchange = () => {
    if (x.value) items[+x.dataset.dt].t.date = x.value;
    recalc(); stats();
  });
  $$("[data-tm]", prev).forEach(x => x.onchange = () => {
    items[+x.dataset.tm].t.time = x.value || "";
    recalc(); stats();
  });
  $$("[data-fl]", prev).forEach(b => b.onclick = () => {
    const it = items[+b.dataset.fl];
    it.t.flow = it.t.flow === "in" ? "out" : "in";
    b.textContent = it.t.flow === "in" ? "수입" : "지출";
    b.classList.toggle("in", it.t.flow === "in");
  });

  run.textContent = "선택한 내역 추가";
  run.disabled = false;
  run.onclick = () => {
    const add = items.filter(i => i.on).map(i => i.t).filter(t => t.amt > 0);
    if (!add.length) return toast("추가할 항목을 선택하세요");
    D.txns = D.txns.concat(add);
    persist(); closeAll(); render();
    toast(add.length + "건 추가했습니다");
  };
}

function doImportJSON() {
  modal({
    title: "백업 불러오기",
    body:
      '<p class="tiny muted" style="line-height:1.6;margin:0 0 10px">백업 파일을 고르거나 복사해 둔 내용을 붙여넣으세요.</p>' +
      '<button class="btn wide" id="bkPick" style="margin-bottom:10px">📄 백업 파일 선택</button>' +
      '<input type="file" id="bkFile" class="hidden" accept=".json,application/json,text/plain">' +
      '<textarea id="bkIn" class="inp" placeholder="또는 여기에 붙여넣기" style="min-height:130px;font-size:12px"></textarea>' +
      '<div id="bkMsg" style="margin-top:10px"></div>',
    foot: '<button class="btn" id="bkCheck">내용 확인</button><button class="btn pri" id="bkGo" disabled>덮어쓰기</button>',
    onOpen(el, close) {
      const ta = $("#bkIn", el), msg = $("#bkMsg", el), go2 = $("#bkGo", el), fi = $("#bkFile", el);
      let parsed = null;

      const bad = t => { parsed = null; go2.disabled = true; msg.innerHTML = '<p class="sm c-bad b" style="margin:0;line-height:1.6">' + t + '</p>'; };

      const check = () => {
        let raw = String(ta.value || "").trim();
        if (!raw) return bad("내용이 비어 있습니다. 파일을 고르거나 붙여넣어 주세요.");
        const i = raw.indexOf("{"), j = raw.lastIndexOf("}");
        if (i < 0 || j < i) return bad("백업 형식이 아닙니다. { 로 시작해서 } 로 끝나야 합니다.");
        raw = raw.slice(i, j + 1);
        let o;
        try { o = JSON.parse(raw); }
        catch (e2) { return bad("내용이 중간에 끊겼거나 일부만 복사된 것 같습니다.<br><span style=\'font-weight:400\'>메모에 붙여넣은 내용을 처음부터 끝까지 전체 선택해서 다시 복사해 주세요.</span>"); }
        const d = (o && o.data) ? o.data : o;
        if (!d || !Array.isArray(d.accounts) || !Array.isArray(d.txns))
          return bad("가계부 백업 파일이 아닙니다.");
        parsed = d; go2.disabled = false;
        const cards = d.accounts.filter(a => a.kind === "card").length;
        const banks = d.accounts.filter(a => a.kind === "bank").length;
        const deb = d.accounts.filter(a => a.kind === "debit").length;
        msg.innerHTML = '<div class="card" style="margin:0"><div class="bd">' +
          '<div class="b sm" style="margin-bottom:6px">' + esc(d.home || "이름 없음") + '</div>' +
          '<div class="tiny muted" style="line-height:1.7">내역 ' + d.txns.length + '건 · 은행 ' + banks +
          ' · 직불 ' + deb + ' · 카드 ' + cards + ' · 분류 ' + ((d.cats || []).length) +
          ' · 반복 ' + ((d.rules || []).length) + '개' +
          (o && o.at ? '<br>백업 시각 ' + esc(String(o.at).slice(0, 16).replace("T", " ")) : "") +
          '</div></div></div>' +
          '<p class="tiny c-bad b" style="margin:8px 0 0">덮어쓰기를 누르면 지금 로그인한 계정의 내용이 위 내용으로 바뀝니다.</p>';
      };

      $("#bkPick", el).onclick = () => fi.click();
      fi.onchange = async () => {
        const f = fi.files && fi.files[0];
        if (!f) return;
        try { ta.value = await f.text(); check(); }
        catch (e3) { bad("파일을 읽지 못했습니다. 내용을 직접 붙여넣어 주세요."); }
      };
      ta.oninput = () => { if (parsed) { parsed = null; go2.disabled = true; msg.innerHTML = ""; } };
      $("#bkCheck", el).onclick = check;

      go2.onclick = () => {
        if (!parsed) return check();
        const d = parsed;
        D = Object.assign(emptyData(d.home), d);
        if (!D.anchor) D.anchor = thisMonth();
        if (!Array.isArray(D.rules)) D.rules = [];
        D.settings = Object.assign({ hideXfer: false, tint: 16, instMode: "monthly", hideBal: false, catIncFuture: false, catYear: false }, D.settings || {});
        persist(); close(); go("home");
        toast("불러왔습니다 (내역 " + D.txns.length + "건)");
      };
    }
  });
}

/* ============================================================
   음성 입력 — "어제 커피값 3천원" 처럼 말하면 알아서 채운다
   ============================================================ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const canVoice = () => !!SR;

/* 한국어 금액: 3000 / 3,000원 / 3천원 / 이만오천원 / 만원 */
function parseWon(seg) {
  const KD = { "영": "0", "공": "0", "일": "1", "이": "2", "삼": "3", "사": "4", "오": "5", "육": "6", "칠": "7", "팔": "8", "구": "9" };
  let t = String(seg).replace(/,/g, "").replace(/\s+/g, "")
    .replace(/[영공일이삼사오육칠팔구]/g, c => KD[c]);
  const UN = { "만": 10000, "천": 1000, "백": 100, "십": 10 };
  let total = 0, cur = 0, num = "", any = false;
  for (const ch of t) {
    if (/\d/.test(ch)) { num += ch; continue; }
    if (UN[ch]) {
      const n = num ? +num : 1; num = ""; any = true;
      if (ch === "만") { total += (cur + n) * 10000; cur = 0; }
      else cur += n * UN[ch];
      continue;
    }
    if (num) { cur += +num; num = ""; any = true; }
  }
  if (num) { cur += +num; any = true; }
  return any ? total + cur : 0;
}

function parseSpeech(text) {
  let t = String(text || "").trim();
  const out = { date: todayISO(), desc: "", amt: 0, flow: "out", hadDate: false };
  if (!t) return out;

  /* 금액 */
  let amtStr = null;
  let m = t.match(/(\d[\d,]*(?:\s*[만천백십]\s*[\d,]*)*)\s*원/);          /* 3000원 · 12만 5천원 */
  if (!m) m = t.match(/([영공일이삼사오육칠팔구만천백십]{1,12})\s*원/);        /* 만이천원 · 오만삼천원 */
  if (m) { amtStr = m[0]; out.amt = parseWon(m[1]); }
  if (!out.amt) {
    m = t.match(/([\d,]{2,})(?!\s*(일|월|년|시|분))/);
    if (m) { amtStr = m[0]; out.amt = parseWon(m[1]); }
  }
  if (amtStr) t = t.replace(amtStr, " ");

  /* 날짜 */
  const rel = { "그저께": -2, "그제": -2, "어제": -1, "어저께": -1, "오늘": 0, "내일": 1, "모레": 2 };
  let dateStr = null;
  for (const k in rel) if (t.includes(k)) { out.date = addDays(todayISO(), rel[k]); out.hadDate = true; dateStr = k; break; }
  if (!out.hadDate) {
    const y = +todayISO().slice(0, 4);
    if ((m = t.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일?/))) {
      const d = mkDate(y, m[1], m[2]); if (d) { out.date = fixYear(d); out.hadDate = true; dateStr = m[0]; }
    } else if ((m = t.match(/(\d{1,2})\s*[\/.]\s*(\d{1,2})(?!\s*\d)/))) {
      const d = mkDate(y, m[1], m[2]); if (d) { out.date = fixYear(d); out.hadDate = true; dateStr = m[0]; }
    } else if ((m = t.match(/(\d{1,2})\s*일(?!\s*전)/))) {
      const d = mkDate(y, +todayISO().slice(5, 7), m[1]); if (d) { out.date = d; out.hadDate = true; dateStr = m[0]; }
    }
  }
  if (dateStr) t = t.replace(dateStr, " ");

  /* 수입 여부 */
  if (/입금|들어왔|받았|수입|월급|급여|용돈|환불|취소|당첨|벌었/.test(t)) out.flow = "in";

  /* 내용 */
  out.desc = t.replace(/[,·]/g, " ")
    .replace(/(사용했어요|사용했다|사용함|사용|결제했어요|결제함|결제|썼어요|썼어|썼다|지출|나갔어|냈어|샀어|삽니다|샀다|입금됐어요|입금|들어왔어요|들어왔어|받았어요|받았어|추가|기록|해줘|해주세요|넣어줘|으로|에서|한테|했어요|했어|이야|이다|임)/g, " ")
    .replace(/\s{2,}/g, " ").trim().slice(0, 40);
  if (!out.desc) out.desc = out.flow === "in" ? "수입" : "지출";
  return out;
}

}

/* ============================================================
   엑셀 내려받기 — 연말정산·기록 보관용
   ============================================================ */
function exportRows(from, to) {
  let base = D.txns.slice();
  (D.rules || []).forEach(r => { try { base = base.concat(ruleTxns(r, from, to)); } catch (e) {} });
  const monthly = (D.settings.instMode || "monthly") === "monthly";
  let out = [];
  base.forEach(t => { out = out.concat(monthly && (+t.inst || 1) > 1 ? instSlices(t, from, to) : [t]); });
  return out.filter(t => t.date >= from && t.date <= to)
    .sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
}

function kindOf(t) {
  if (t.adj) return t.princ ? "원금 입출금" : "잔액 수정";
  if (t.xfer) return "내 계좌 이동";
  return t.flow === "in" ? "수입" : "지출";
}

function buildSheets(from, to, label) {
  const rows = exportRows(from, to);
  const accN = id => (D.accounts.find(a => a.id === id) || {}).name || "";
  const today = todayISO();

  /* 1) 전체 내역 */
  const s1 = [["날짜", "시간", "구분", "은행·카드", "내용", "분류", "금액", "메모", "할부", "회차", "상태"]];
  rows.forEach(t => s1.push([
    t.date, t.time || "", kindOf(t), accN(t.acc), t.desc || "",
    t.cat ? CATN(t.cat) : "", t.amt, t.memo || "",
    (+t.inst || 1) > 1 ? t.inst + "개월" : "일시불",
    (+t.inst || 1) > 1 ? (t.instN || 1) : "",
    t.date > today ? "예정" : (t.virt ? "반복" : "")
  ]));

  /* 2) 월별 요약 */
  const mk = {};
  rows.forEach(t => {
    const m = t.date.slice(0, 7);
    mk[m] = mk[m] || { out: 0, inn: 0 };
    if (t.adj || t.xfer) return;
    if (t.flow === "in") mk[m].inn += t.amt; else mk[m].out += t.amt;
  });
  const ms = Object.keys(mk).sort();
  const s2 = [["월", "수입", "지출", "남은 돈"]];
  let ti = 0, to2 = 0;
  ms.forEach(m => { s2.push([m, mk[m].inn, mk[m].out, mk[m].inn - mk[m].out]); ti += mk[m].inn; to2 += mk[m].out; });
  s2.push(["합계", ti, to2, ti - to2]);

  /* 3) 분류별 × 월 */
  const cats = D.cats.slice();
  const s3 = [["분류"].concat(ms).concat(["합계"])];
  const grid = {};
  rows.forEach(t => {
    if (t.adj || t.xfer || t.flow === "in") return;
    const c = t.cat || "_none", m = t.date.slice(0, 7);
    grid[c] = grid[c] || {}; grid[c][m] = (grid[c][m] || 0) + t.amt;
  });
  cats.concat([{ id: "_none", name: "미분류" }]).forEach(c => {
    const g = grid[c.id]; if (!g) return;
    const line = [c.name]; let sum = 0;
    ms.forEach(m => { const v = g[m] || 0; line.push(v); sum += v; });
    line.push(sum); s3.push(line);
  });
  const tot = ["합계"];
  ms.forEach(m => tot.push(mk[m] ? mk[m].out : 0));
  tot.push(to2); s3.push(tot);

  /* 4) 계정 현황 */
  const s4 = [["종류", "이름", "잔고·평가액", "원금", "손익", "예산", "실적 목표", "정산 기간", "합계 제외"]];
  D.accounts.forEach(a => {
    const isStock = a.kind === "bank" && a.stock;
    s4.push([
      isStock ? "주식·투자" : a.kind === "bank" ? "은행" : a.kind === "debit" ? "생활비·지역화폐" : "카드",
      a.name,
      a.kind === "card" ? "" : (a.kind === "debit" ? debitBal(a) : (+a.bal || 0)),
      isStock ? stockSeed(a) : "", isStock ? stockPL(a) : "",
      a.kind === "debit" && a.budget ? a.budget : "",
      a.kind === "card" && a.goal ? a.goal : "",
      a.kind === "card" ? (a.ds || 1) + "일~" + (a.de ? a.de + "일" : "말일") : "",
      a.excl ? "제외" : ""
    ]);
  });

  /* 5) 반복 일정 */
  const s5 = [["내용", "은행·카드", "금액", "주기", "종료", "시작일", "구분"]];
  (D.rules || []).forEach(r => s5.push([
    r.desc || "", accN(r.acc), r.amt, ruleLabel(r), ruleEndLabel(r), r.start,
    r.xfer ? "이체" : r.flow === "in" ? "수입" : "지출"
  ]));

  return [
    { name: "전체내역", data: s1, w: [11, 7, 12, 16, 26, 10, 12, 20, 9, 7, 7] },
    { name: "월별요약", data: s2, w: [10, 13, 13, 13] },
    { name: "분류별", data: s3, w: [12].concat(ms.map(() => 12)).concat([13]) },
    { name: "계정현황", data: s4, w: [16, 20, 14, 13, 12, 12, 12, 14, 10] },
    { name: "반복일정", data: s5, w: [22, 16, 12, 18, 18, 12, 8] }
  ];
}

function toCSV(sheets) {
  const q = v => {
    const s = v == null ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return "\uFEFF" + sheets.map(sh =>
    "[" + sh.name + "]\n" + sh.data.map(r => r.map(q).join(",")).join("\n")
  ).join("\n\n");
}

    const man = {
      name: "우리집 가계부", short_name: "가계부",
      start_url: location.pathname + location.search,
      scope: location.pathname.replace(/[^/]*$/, ""),
      display: "standalone", orientation: "portrait",
      background_color: "#f4f5f7", theme_color: "#2f6df6",
      icons: [{ src: icon, sizes: "512x512", type: "image/png", purpose: "any maskable" }]
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: "application/manifest+json" }));
    const ln = document.createElement("link");
    ln.rel = "manifest"; ln.href = url;
    document.head.appendChild(ln);

    const tc = document.createElement("meta");
    tc.name = "theme-color"; tc.content = "#2f6df6";
    document.head.appendChild(tc);
  } catch (e) {}
})();

    box(146, 90, 34, 6, "var(--accent)", 3) + '</svg>';
  if (k === "voice") return '<svg ' + W + '>' +
    '<circle cx="110" cy="62" r="34" fill="var(--accent-soft)"/>' +
    '<rect x="101" y="42" width="18" height="30" rx="9" fill="var(--accent)"/>' +

const TOUR = [

  { art: "acc", t: "먼저 은행과 카드를 등록하세요", d: "요약 화면의 <b>+ 버튼</b>으로 추가합니다. 이름은 직접 정하면 됩니다. 카드는 정산 기간과 실적 목표를, 지역화폐는 생활비 예산을 같이 넣을 수 있습니다." },

  { art: "voice", t: "음성으로도 넣을 수 있습니다", d: "<b>🎤 음성</b>을 누르고 “커피값 3000원”처럼 말하면 됩니다. “어제 점심 만이천원”처럼 날짜를 붙여도 되고, 빼면 오늘로 들어갑니다. 확인을 거쳐 저장합니다." },
  { art: "cat", t: "색으로 분류하면 한눈에 보입니다", d: "내역을 눌러 분류를 지정하면 그 색이 줄에 깔립니다. <b>분류 탭</b>에서 어디에 얼마를 썼는지, 지난달보다 늘었는지 줄었는지 바로 보입니다." },
  { art: "goal", t: "카드 실적은 신호등으로", d: "카드마다 실적 목표를 넣어두면 초록·노랑·빨강으로 표시됩니다. 눌러보면 얼마가 남았는지 알려줍니다. 할부는 월 납입액으로 나눠서 잡힙니다." },
  { art: "backup", t: "한 달에 한 번, 백업만 챙기세요", d: "<b>설정 → 백업 내보내기</b>로 파일을 받아 메일이나 클라우드에 보관하세요. 폰을 바꾸거나 기록이 지워져도 그대로 되살릴 수 있습니다. 연말정산용 엑셀도 여기서 받습니다." }
];

function showTour(fromSettings) {
  let i = 0;
  const host = document.createElement("div");
  host.className = "tourwrap";
  host.innerHTML =
    '<div class="tourbox">' +
      '<button class="tourskip" id="tSkip">건너뛰기</button>' +
      '<div class="tourview"><div class="tourtrack" id="tTrack">' +
        TOUR.map(s => '<div class="tourpage">' +
          '<div class="tourart">' + tourArt(s.art) + '</div>' +
          '<h3>' + s.t + '</h3><p>' + s.d + '</p></div>').join("") +
      '</div></div>' +
      '<div class="tourdots" id="tDots">' + TOUR.map((_, k) => '<i data-go="' + k + '"></i>').join("") + '</div>' +
      '<div class="tournav">' +
        '<button class="btn" id="tPrev">이전</button>' +
        '<button class="btn pri grow" id="tNext">다음</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(host);

  const track = $("#tTrack", host), dots = $$("#tDots i", host);
  const go = k => {
    i = Math.max(0, Math.min(TOUR.length - 1, k));
    track.style.transform = "translateX(" + (-i * 100) + "%)";
    dots.forEach((d, n) => d.classList.toggle("on", n === i));
    $("#tPrev", host).style.visibility = i ? "visible" : "hidden";
    $("#tNext", host).textContent = i === TOUR.length - 1 ? "시작하기" : "다음";
  };
  const done = () => {
    host.remove();
    if (!fromSettings && D) { D.settings.tourDone = true; persist(); }
  };
  go(0);
  dots.forEach(d => d.onclick = () => go(+d.dataset.go));
  $("#tPrev", host).onclick = () => go(i - 1);
  $("#tNext", host).onclick = () => { if (i === TOUR.length - 1) done(); else go(i + 1); };
  $("#tSkip", host).onclick = done;

  let x0 = null;
  track.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  track.addEventListener("touchend", e => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 42) go(i + (dx < 0 ? 1 : -1));
    x0 = null;
  }, { passive: true });
}

/* ============================================================
   메모 — 마지막 기록일자 같은 걸 적어두는 칸
   ============================================================ */
function editMemo() {
  modal({
    title: "메모",
    body:
      '<p class="tiny muted" style="margin:0 0 8px;line-height:1.6">계정별 마지막 기록 날짜는 앱이 알아서 보여줍니다. 여기에는 그 밖에 적어둘 것을 쓰세요. 요약 화면 맨 위에 그대로 보입니다.</p>' +
      '<textarea id="mTa" class="inp" style="min-height:150px;line-height:1.7" placeholder="예)&#10;지역화폐 10월 1일에 충전하기&#10;현대카드 실적 이번 달 아슬아슬함&#10;보험료 인상 확인할 것">' +
        esc(D.memo || "") + '</textarea>',
    foot: (D.memo ? '<button class="btn dan" id="mDel">비우기</button>' : '') + '<button class="btn pri" id="mOk">저장</button>',
    onOpen(el, close) {
      const ta = $("#mTa", el);
      ta.focus();
      $("#mOk", el).onclick = () => { D.memo = ta.value.trim(); persist(); close(); render(); };
      const d = $("#mDel", el);
      if (d) d.onclick = () => { D.memo = ""; persist(); close(); render(); };
    }
  });
}

/* ============================================================
   자동 갱신 — 새 파일이 올라오면 알아서 받아온다
   ============================================================ */
let UPD_AT = 0, UPD_SHOWN = false;
function applyUpdate(v) {
  const base = location.pathname;
  location.replace(base + "?v=" + encodeURIComponent(v));
}
function updateBar(v) {
  if (UPD_SHOWN) return;
  UPD_SHOWN = true;
  const busy = !!$(".mask") || /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || "");
  if (!busy) {                                  // 조용할 때는 알아서 갱신
    toast("새 버전으로 업데이트합니다");
    setTimeout(() => applyUpdate(v), 1100);
    return;
  }
  const bar = document.createElement("div");    // 뭔가 쓰고 있으면 물어본다
  bar.className = "updbar";
  bar.innerHTML = '<span class="grow">새 버전이 나왔습니다</span>' +
    '<button class="btn sm pri" id="updGo">지금 갱신</button>' +
    '<button class="btn sm gho" id="updNo">나중에</button>';
  document.body.appendChild(bar);
  $("#updGo", bar).onclick = () => applyUpdate(v);
  $("#updNo", bar).onclick = () => bar.remove();
}
async function checkUpdate(manual) {
  if (!/^https?:$/.test(location.protocol)) { if (manual) toast("여기서는 확인할 수 없습니다"); return; }
  if (!manual && Date.now() - UPD_AT < 6e5) return;      // 10분에 한 번
  UPD_AT = Date.now();
  try {
    const r = await fetch(location.pathname + "?_=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("http");
    const t = await r.text();
    const m = t.match(/APP_VERSION\s*=\s*"([^"]+)"/);
    if (!m) { if (manual) toast("갱신 정보를 찾지 못했습니다"); return; }
    if (m[1] === APP_VERSION) { if (manual) toast("이미 최신입니다 (" + APP_VERSION + ")"); return; }
    if (manual) applyUpdate(m[1]); else updateBar(m[1]);
  } catch (e) { if (manual) toast("인터넷 연결을 확인해 주세요"); }
}
setTimeout(() => checkUpdate(false), 2500);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(false); });

/* ============================================================
   테마 / 시작
   ============================================================ */
function applyTheme() {
  const t = localStorage.getItem("ledger.theme") || "auto";
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}
applyTheme();
setAuthMode("login");
if (ROOT.session && ROOT.users[ROOT.session]) enter(ROOT.session);
